# Replays scripted replies from mock_responses.yaml. No model server needed.
# Shows the whole loop: a failed first try and its fix, sanitizing, and a milestone.
run_name: mock

model:
  backend: mock
  mock_responses: mock_responses.yaml
  context_window: 8192
  max_output_tokens: 1024

run:
  samples: 1
  max_attempts: 3

checks:
  env:
    PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"   # faster test runs; these tests need no plugins
