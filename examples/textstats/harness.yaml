# Run against a local OpenAI-compatible server. Change model to whatever your server serves.
# Everything not listed here uses the defaults shown in harness/skeleton/harness.yaml.
run_name: local-slm

model:
  backend: openai
  base_url: http://localhost:11434/v1
  model: qwen2.5-coder:3b
  context_window: 8192
  max_output_tokens: 1024

run:
  samples: 3
  max_attempts: 3

checks:
  env:
    PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"   # faster test runs; these tests need no plugins
