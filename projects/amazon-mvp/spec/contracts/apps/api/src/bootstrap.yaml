  imports:
  - import { INestApplication, ValidationPipe } from '@nestjs/common';
  - import { NestFactory } from '@nestjs/core';
  - import { DocumentBuilder, SwaggerModule } from '@nestjs/swagger';
  - import { ApiConfig } from '@amazon-mvp/config-schema';
  - import cookieParser from 'cookie-parser';
  - import { AppModule } from './app.module';
  - import { HttpExceptionFilter } from './common/http-exception.filter';
  - import { StructuredLogger } from './common/structured-logger';
  - import { API_CONFIG } from './config/api-config';
  description: |-
    Create and configure the Nest application shared by `main.ts`, the OpenAPI script and the integration tests; returns `{ app, config }`.
    Do not call `app.init()` or `app.listen()` here: callers do. Steps, in order:
    1. `const app = await NestFactory.create(AppModule, { bufferLogs: true })`.
    2. `const config = app.get<ApiConfig>(API_CONFIG)`; `const logger = app.get(StructuredLogger)`;
       `logger.setLevel(config.app.logLevel)`; `app.useLogger(logger)`.
    3. `app.setGlobalPrefix('api/v1', { exclude: ['health', 'ready'] })`: the probes stay at `/health`
       and `/ready`; every other route lives under `/api/v1` (e.g. `/api/v1/orders`).
    4. `app.use(cookieParser())`: the session guard reads the cookie from `req.cookies`.
    5. `app.useGlobalFilters(new HttpExceptionFilter(logger))`.
    6. `app.useGlobalPipes(new ValidationPipe({ whitelist: true, forbidNonWhitelisted: true,
       transform: true, transformOptions: { enableImplicitConversion: false } }))`. Unknown body or
       query properties (e.g. a forged `totalMinor` or `userId`) are rejected with 400 `VALIDATION_FAILED`.
    7. `app.enableShutdownHooks()`.
    Do not enable CORS (the storefront is same-origin) and do not mount Swagger here (`main.ts` does).
    Return `{ app, config }`.
