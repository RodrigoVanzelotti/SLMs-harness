  description: |-
    Global filter that turns every thrown error into the one wire shape `{ error: { code, message, requestId, details? } }` and logs it.
    Get `response = host.switchToHttp().getResponse<Response>()` and `requestId = RequestContextStore.requestId()`;
    answer with `response.status(status).json(payload)`.
    When `exception instanceof HttpException` (ApiError, Nest built-ins, ValidationPipe errors):
    - `status = exception.getStatus()`; `raw = exception.getResponse()`; a string `raw` is treated as
      `{ message: raw }`, an object as `NestValidationBody`.
    - `code` = `body.code` when present; otherwise by status: 400 `VALIDATION_FAILED`, 401
      `AUTH_SESSION_REQUIRED`, 404 `RESOURCE_NOT_FOUND`, anything else `INTERNAL_ERROR`. So a plain
      `HttpException({ code: 'REVIEW_SELF_VOTE', message }, 403)` keeps its own code.
    - `message` = `'Request validation failed'` when `body.message` is an array; otherwise
      `body.message ?? exception.message`.
    - `details` = `body.details` when present; else, when `body.message` is an array, one
      `{ field, message }` per entry, `field` being the text before the first space (class-validator
      messages start with the property name: `'email must be an email'` gives field `email`); else none.
      Include the `details` key only when there are details.
    - Log before replying: status >= 500 → `` logger.error(`${code}: ${message}`, exception.stack, 'HttpExceptionFilter') ``;
      otherwise `` logger.warn(`${status} ${code}: ${message}`, 'HttpExceptionFilter') ``.
    Any other thrown value (plain Error, Prisma error, a string):
    - `logger.error(exception is an Error ? its message : 'Unhandled exception', its stack or undefined, 'HttpExceptionFilter')`.
    - Reply 500 with `{ error: { code: 'INTERNAL_ERROR', message: 'Something went wrong on our side', requestId } }`.
      Never send the original message or stack to the client.
  max_output_tokens: 1024
