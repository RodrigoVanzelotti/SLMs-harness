  description: |-
    Edits to the signed-in account: display name, password and e-mail. Credential changes need the current password and sign out every other session.

    Folded helper, a private method `confirmPassword(userId, password)`:
    - Load the user with `users.findByIdWithSecret(userId)`. If there is none, throw `ApiError.sessionRequired()` (401).
    - If `passwords.verify(user.passwordHash, password)` is false, call `logger.warn` with `failed password confirmation for user ${userId}` and context `'AccountService'`, then throw `ApiError.currentPasswordInvalid()`. That is 403, `ErrorCode.AUTH_INVALID_CREDENTIALS`, message `Invalid credentials`.
    - Otherwise return the user (`UserWithSecret`).

    - `updateProfile(userId, displayName)`: if `users.findById(userId)` is null, throw `ApiError.sessionRequired()`. Otherwise call `users.updateDisplayName(userId, displayName)`, log `display name changed: ${userId}` with `logger.log` (context `'AccountService'`), and return `toProfile(updated)`.
    - `changePassword(session, currentPassword, newPassword)`, in this order:
      1. `confirmPassword(session.userId, currentPassword)`. A wrong password changes nothing and revokes nothing.
      2. If `newPassword === currentPassword`, throw `new ApiError(ErrorCode.VALIDATION_FAILED, msg, HttpStatus.BAD_REQUEST, [{ field: 'newPassword', message: msg }])`, where msg is `newPassword must be different from the current password`.
      3. `users.updatePasswordHash(session.userId, await passwords.hash(newPassword))`.
      4. `revokedSessions = await sessions.revokeOthersForUser(session.userId, session.sessionId)`.
      5. Log `password changed: ${userId}; ${revokedSessions} other session(s) revoked`, then return `{ success: true, revokedSessions }`.
    - `changeEmail(session, email, currentPassword)`:
      1. `user = await confirmPassword(session.userId, currentPassword)`.
      2. If `normalizeEmail(email) === user.email`, return `toProfile(user)` without writing or revoking anything.
      3. If `users.existsByEmail(email)` is true, throw `ApiError.emailAlreadyRegistered()` (409, `AUTH_EMAIL_ALREADY_REGISTERED`).
      4. Call `users.updateEmail(session.userId, email)`. If it throws and `isUniqueViolation(error)` is true, throw `ApiError.emailAlreadyRegistered()`; otherwise rethrow.
      5. Call `sessions.revokeOthersForUser(session.userId, session.sessionId)`, log `email changed: ${userId}; ${n} other session(s) revoked`, and return `toProfile(updated)`.

    Never log or return a password or a hash. Profiles always go through `toProfile`, which drops `passwordHash`.
