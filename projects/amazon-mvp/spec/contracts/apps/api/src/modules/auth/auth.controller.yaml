  description: |-
    HTTP routes to identify an e-mail, register, log in, log out and read the current session; they set and clear the HttpOnly session cookie.
    `this.config.session` has `cookieName` (string), `secureCookie` (boolean), `sameSite` (`'lax' | 'strict' | 'none'`) and `ttlHours`.

    Folded helpers:
    - Request meta: `{ userAgent: request.header('user-agent'), ipAddress: request.ip }`.
    - `cookieOptions(maxAgeMs)`: `{ httpOnly: true, secure: config.session.secureCookie, sameSite: config.session.sameSite, path: '/', maxAge: maxAgeMs }`.
    - Setting the session cookie: `response.cookie(config.session.cookieName, session.token, cookieOptions(session.expiresAt.getTime() - Date.now()))`.

    Handlers:
    - `identify(dto)`: return `this.auth.identify(dto.email)` → `{ exists }`.
    - `register(dto, request, response)`: `result = await this.auth.register(dto, meta)`. Set the session cookie from `result.session`, then return `{ user: result.profile, expiresAt: result.session.expiresAt.toISOString() }`.
    - `login(dto, request, response)`: the same as `register`, but with `this.auth.login(dto, meta)`. The service throws before any cookie is set, so a failed login sends no `Set-Cookie`.
    - `logout(request, response)`: `await this.auth.logout(request.cookies?.[cookieName])` (undefined when there is no cookie). Then call `response.clearCookie(cookieName, cookieOptions(0))` and return `{ success: true }`. The route is public, so it works without a valid session.
    - `me(auth)`: return `this.auth.currentSession(auth.userId, auth.expiresAt)` → `{ user, expiresAt }`.
    The session cookie is the only cookie these routes set; clients read the first `Set-Cookie` header.
