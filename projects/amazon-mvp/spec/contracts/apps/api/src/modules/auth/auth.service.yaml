- id: api.auth.auth.service.AuthService
  type: implement
  kind: class
  target: apps/api/src/modules/auth/auth.service.ts::AuthService
  signature: |-
    @Injectable()
    export class AuthService {
      constructor(
      @Inject(USERS_API) private readonly users: UsersApi,
      private readonly passwords: PasswordService,
      @Inject(SESSIONS_API) private readonly sessions: SessionsApi,
      private readonly logger: StructuredLogger,
      );
      async register(
      input: { email: string; password: string; displayName: string },
      meta: RequestMeta = {},
      ): Promise<AuthResult>;
      async identify(email: string): Promise<{ exists: boolean }>;
      async login(input: { email: string; password: string }, meta: RequestMeta = {}): Promise<AuthResult>;
      async logout(token: string | undefined): Promise<void>;
      async currentSession(userId: string, expiresAt: Date): Promise<SessionResponse>;
    }
  uses:
  - api.users.users.api.USERS_API
  - api.users.users.api.UsersApi
  - api.auth.password.service.PasswordService
  - api.auth.sessions.api.SESSIONS_API
  - api.auth.sessions.api.SessionsApi
  - api.common.structured-logger.StructuredLogger
  - api.auth.auth.service.RequestMeta
