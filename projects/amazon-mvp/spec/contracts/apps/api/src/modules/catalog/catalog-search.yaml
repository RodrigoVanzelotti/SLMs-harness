  target: apps/api/src/modules/catalog/catalog-search.ts::escapeLike
  signature: 'export function escapeLike(value: string): string'
  imports:
  - import { CATALOG_SEARCH_MAX_LENGTH } from '@amazon-mvp/api-contract';
  description: |-
    Puts a backslash before each LIKE wildcard (`%`, `_`) and before each backslash, which is PostgreSQL's default LIKE escape character.
    Every other character is left unchanged, including case and accents.
  examples:
