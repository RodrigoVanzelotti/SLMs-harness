  - import { Prisma, Product, Inventory } from '@amazon-mvp/database';
  - import { PrismaService } from '../../common/prisma.service';
  - import { CatalogApi, ProductPage, CatalogProduct } from './catalog.api';
  - import { ACCENTED, PLAIN, containsPattern, escapeLike, normalizeText, searchTokens } from './catalog-search';
  - import type { CatalogPage } from '@amazon-mvp/api-contract';
  - import type { CatalogPriceBucket } from '@amazon-mvp/api-contract';
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  description: |-
    Catalog reads (search listing, taxonomy, facets, product details, lookups) and the stock decrement for checkout, using Prisma and raw SQL.

    Raw SQL conventions:
    - Tables: `products(id, slug, sku, name, description, price_minor, currency, active, created_at)`, `inventory(product_id, quantity, reserved, updated_at)`, `product_categories(product_id, category_id)`, `categories(id, parent_id, slug, name)`.
    - Product queries read `products p LEFT JOIN inventory i ON i.product_id = p.id`. Recursive category walks stop at depth 20.
    - Cast counts with `::int` so they come back as numbers, and ids or arrays with `::uuid`, `::uuid[]`, `::text[]`.

    Folded helpers:
    - `toCatalogProduct(product with inventory)`:
      - `availableQuantity = active ? Math.max(0, (inventory?.quantity ?? 0) - (inventory?.reserved ?? 0)) : 0`. A product without an inventory row has 0.
      - Returns exactly `{ id, sku, slug, name, description, priceMinor, currency, active, availableQuantity, inStock: availableQuantity > 0 }`.
    - `whereSql(query, tokens)` returns the conditions joined with ` AND `, or `null` when nothing can match:
      - Always `p.active = true`.
      - `category`: find the ids of the category with that slug and of all its descendants, by a recursive walk down `parent_id`. If there are none, return `null`. Otherwise add an `EXISTS` on `product_categories` with `category_id = ANY(ids)`.
      - `slugs`, when given: `p.slug = ANY(slugs)`.
      - `minPriceMinor`: `p.price_minor >= min`. `maxPriceMinor`: `p.price_minor < max`.
      - `inStock`: `AVAILABLE_SQL`.
      - Every token: `(NAME LIKE pat OR DESCRIPTION LIKE pat OR categoryNameMatch(pat))`, where `pat = containsPattern(token)`.
    - `orderSql(sort, tokens, q)`:
      - `price-asc` / `price-desc` order by `price_minor` ascending / descending, and `newest` by `created_at` descending; each then by `p.name ASC, p.id ASC`.
      - Otherwise (`relevance` or none): `p.name ASC, p.id ASC` without tokens. With tokens, order by score DESC, then name and id.
      - Score: 5 if `NAME LIKE escapeLike(normalizeText(q).trim()) + '%'` (the name starts with the whole query), plus, per token, 3 for a name match, 2 for `categoryNameMatch` and 1 for a description match.

    - `listProducts(query)`:
      - `page = query.page ?? 1`, `pageSize = query.pageSize ?? 12`, `tokens = searchTokens(query.q)`. If `where` is null, return `{ items: [], total: 0 }`.
      - In one `prisma.$transaction([...])`, with the same WHERE, select the ranked page of ids (`p.id::text AS id`, `LIMIT pageSize OFFSET (page - 1) * pageSize`) and `COUNT(*)::int AS total`.
      - Load the page with `prisma.product.findMany({ where: { id: { in: ids } }, include: { inventory: true } })` (skip it when there are no ids). Return `{ items, total }`, with `items` in ranked order through `toCatalogProduct`. A page past the end has `items: []` and the real `total`.
    - `listCategories()`: `prisma.category.findMany({ include: { parent: { select: { slug: true } } }, orderBy: [{ name: 'asc' }, { slug: 'asc' }] })`, mapped to `{ slug, name, parentSlug: parent?.slug ?? null }`.
    - `productFacets(query)`:
      - Build `where` from only `{ q, category, slugs }`.
      - Buckets come from the bounds `[0, ...CATALOG_PRICE_BOUNDS_MINOR]`: bucket k is `{ minMinor: bounds[k], maxMinor: bounds[k + 1] ?? null }`. The minimum is inclusive, the maximum exclusive, and the last bucket is open.
      - If `where` is null, return total 0, inStock 0, every bucket with count 0, `categories: []`, `slugs: []` and `slugsTruncated: false`.
      - Otherwise run three queries in one `$transaction([...])`:
        1. The total, the in-stock count (`AVAILABLE_SQL`) and one count per bucket.
        2. `{ slug, count }` per category, ordered by slug: distinct matched products in the category or any descendant (each product's categories plus all their ancestors).
        3. The matched slugs, ordered by slug, `LIMIT CATALOG_FACET_SLUG_LIMIT + 1`. Return them capped at the limit, with `slugsTruncated` true when there were more.
    - `consumeForOrder(items, tx)`:
      - Process the items sorted by `productId` (`localeCompare`, avoids lock inversion). For each, lock the row (`SELECT id FROM products WHERE id = $id::uuid FOR UPDATE`), then read it with `tx.product.findUnique` including inventory.
      - If the product is missing or inactive, or the quantity is not an integer from 1 to `MAX_CART_QUANTITY`, fail with 409 `CART_ITEM_UNAVAILABLE` and `Um produto não está mais disponível. Revise o carrinho.`
      - Then run `tx.$executeRaw` with `UPDATE inventory SET quantity = quantity - q, updated_at = NOW() WHERE product_id = $id::uuid AND quantity - reserved >= q`. If it did not change exactly 1 row, fail with 409 `CART_ITEM_UNAVAILABLE` and `Estoque insuficiente. Revise as quantidades do carrinho.`
      - Return `toCatalogProduct` of each product as read before the decrement, in the sorted order.
    - `getProduct(identifier)`:
      - Read with `include: { inventory: true, categories: { include: { category: true } } }`. If `identifier` matches `/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i`, try `findUnique` by `id` first. Fall back to `findUnique` by `slug`, so a UUID-shaped slug still works. If neither finds a product, return `null`.
      - `categories`: its categories sorted by slug, as `{ slug, name }`. `categoryPath`: the longest root-first chain (recursive walk up `parent_id`, `{ slug, name }` only) among them; the first wins a tie, `[]` without categories.
      - Return `{ ...toCatalogProduct(product), categories, categoryPath }`, inactive products included.
    - `findBySlug(slug)`: `findUnique({ where: { slug }, include: { inventory: true } })` through `toCatalogProduct`, or `null`.
    - `findByIds(ids)`: `[]` without a query for no ids. Otherwise `findMany({ where: { id: { in: ids } }, include: { inventory: true } })` through `toCatalogProduct`, inactive products included, in no guaranteed order.
  max_output_tokens: 5376
