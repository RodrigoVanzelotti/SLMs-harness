      .map((slug) => slug.trim())
      .filter(Boolean)
      : value,
      )
      @IsArray()
      @ArrayMaxSize(CATALOG_MAX_PAGE_SIZE)
      @IsString({ each: true })
      @MaxLength(200, { each: true })
      slugs?: string[];
    }
