- id: api.orders.checkout-quote.quoteCart
  type: implement
  kind: function
  target: apps/api/src/modules/orders/checkout-quote.ts::quoteCart
  signature: |-
    export function quoteCart(
      cart: CartResponse,
      paymentMethod: SimulatedPayment,
      pricing: CheckoutPricing,
    ): CheckoutQuote
  uses:
  - contract.CartResponse
  - contract.SimulatedPayment
  - contract.CheckoutPricing
  - contract.CheckoutQuote
  - api.orders.checkout-quote.conflict
  - contract.paymentDiscountPercent
  - contract.percentDiscountMinor
  - contract.installmentOptions
  - contract.CartItemResponse
  - contract.InstallmentOption
  - api.common.api-error.ApiError
  - contract.CatalogItem
  imports:
  - import { createHash } from 'node:crypto';
  - import { HttpStatus } from '@nestjs/common';
  - import { ErrorCode, CartResponse, SimulatedPayment, CheckoutPricing, CheckoutQuote, paymentDiscountPercent,
    percentDiscountMinor, installmentOptions } from '@amazon-mvp/api-contract';
  - import { ApiError } from '../../common/api-error';
  - import type { CartItemResponse } from '@amazon-mvp/api-contract';
  - import type { InstallmentOption } from '@amazon-mvp/api-contract';
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  description: |-
    Price a cart for one payment method: validate it, apply the Pix discount, and return totals, a revision hash and the card installment plans.
    Pure and synchronous. Checks, in order; each throws `conflict(message)` (409 `CART_ITEM_UNAVAILABLE`):
    1. `cart.lines` is empty → `'Seu carrinho está vazio.'`
    2. Some line has `line.product.currency !== cart.currency`, `!line.product.active`, or
       `line.quantity > line.product.availableQuantity` → `'Revise os produtos e quantidades do carrinho.'`
    3. `cart.subtotalMinor` is not a safe integer, is negative, or is > 2147483647 →
       `'O total do carrinho excede o limite permitido.'`
    Then:
    - `discountPercent = paymentDiscountPercent(paymentMethod, pricing)` (the Pix rate for `SIMULATED_PIX`, 0 for card).
    - `revision` = SHA-256 hex digest (`createHash('sha256').update(text).digest('hex')`, 64 chars) of
      `text = JSON.stringify([cart.id, cart.currency, lines, paymentMethod, discountPercent])`, where
      `lines` is a copy of `cart.lines` sorted by `productId` (`a.productId.localeCompare(b.productId)`)
      and mapped to `[productId, quantity, unitPriceMinor]`. Put nothing else in it (no user, product
      data, totals or installments): a card quote then does not change with the Pix rate, and the order
      flow can rebuild the same revision from locked prices.
    - `shippingMinor = 0`; `discountMinor = percentDiscountMinor(cart.subtotalMinor, discountPercent)`
      (on the whole subtotal, rounded down); `totalMinor = cart.subtotalMinor + shippingMinor - discountMinor`.
    - Return `{ cart, revision, subtotalMinor: cart.subtotalMinor, shippingMinor, discountMinor, totalMinor,
      currency: cart.currency, paymentMethod, discountPercent, installmentOptions: paymentMethod === 'SIMULATED_CARD'
      ? installmentOptions(totalMinor, pricing) : [] }` (plans on the discounted total; none for Pix).
      Do not declare a local variable named `installmentOptions`: it would shadow the imported function.
  examples:
  - 'quoteCart(cart of 3 x 1234 BRL, ''SIMULATED_PIX'', { pixDiscountPercent: 5, maxInstallments: 10, minInstallmentMinor:
    500 }) matches { subtotalMinor: 3702, discountMinor: 185, totalMinor: 3517, discountPercent: 5, installmentOptions:
    [] }'
  - quoteCart(cart of 1 x 1000 BRL, 'SIMULATED_CARD', same pricing).installmentOptions.length == 2
  tests:
  - tests/apps/api/src/modules/orders/checkout-quote.quoteCart.unit.spec.ts
  max_output_tokens: 768
