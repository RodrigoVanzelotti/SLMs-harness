  description: |-
    Orders module service: checkout pricing and quotes, the transactional place-order flow, and the user's order history (Prisma `order`, `orderItem`).
    Constructor: keep `{ pixDiscountPercent, maxInstallments, minInstallmentMinor }` from `config.checkout` in a
    private `checkoutPricing` field. `invalidPayment(msg)` below means `new ApiError(ErrorCode.PAYMENT_INVALID, msg, HttpStatus.BAD_REQUEST)`.
    - `pricing()`: a fresh copy of `checkoutPricing` (e.g. `{ pixDiscountPercent: 5, maxInstallments: 10, minInstallmentMinor: 500 }`).
    - `quote(userId, paymentMethod = 'SIMULATED_CARD')`: `quoteCart(await this.cart.getActiveCart(userId), paymentMethod, this.checkoutPricing)`.
    - `placeOrderFromCart(userId, input)`: all steps inside one
      `this.prisma.$transaction(async (tx) => { ... }, { maxWait: 10000, timeout: 20000 })`; pass `tx` to every
      API call; any throw rolls back stock, order and cart changes. In order:
      1. `await this.cart.lockForCheckout(userId, tx)` (serializes concurrent confirmations).
      2. `tx.order.findFirst({ where: { userId, sourceCartId: input.cartId }, include: { items: true } })`;
         if found, return it mapped, with no other check (retries, even with another method, get the original).
      3. Card: for Pix (method not `SIMULATED_CARD`), `cardId` or `installments` present (not undefined) →
         `invalidPayment('Pix não aceita cartão nem parcelamento.')`, card = null. For card: no `cardId` →
         `{ ...DEMO_CARD }`; else `await this.cards.findCard(userId, cardId, tx)`; null →
         `ApiError.notFound('Payment card')`; `isCardExpired(card)` → `invalidPayment('O cartão selecionado está vencido.')`;
         else `{ brand, last4 }`.
      4. `address = await this.users.findAddress(userId, input.addressId, tx)`; null → `ApiError.notFound('Address')`.
      5. `items = await this.cart.checkoutItems(userId, input.cartId, tx)`;
         `products = await this.catalog.consumeForOrder(items, tx)` (locks rows, decrements stock, may throw 409).
      6. Lines, in `items` order: `{ ...item, product, unitPriceMinor: product.priceMinor,
         lineTotalMinor: item.quantity * product.priceMinor }` (product found by id).
      7. `quote = quoteCart({ id: input.cartId, userId, lines, itemCount: sum of quantities,
         subtotalMinor: sum of lineTotalMinor, currency: products[0].currency }, input.paymentMethod, this.checkoutPricing)`.
         Nothing monetary comes from the request.
      8. `quote.revision !== input.revision` → `throw conflict('Seu carrinho, os preços ou a forma de pagamento mudaram. Revise o resumo e confirme novamente.')`.
      9. `installments = card ? (input.installments ?? 1) : null`; if not null and no
         `quote.installmentOptions` entry has `count === installments` →
         `invalidPayment('Número de parcelas indisponível para este total.')`.
      10. `tx.order.create({ data, include: { items: true } })`, data: `userId`, `sourceCartId: input.cartId`,
          `orderNumber: 'PED-' + randomUUID()`, `status: 'PENDING'`, `subtotalMinor`, `shippingMinor`,
          `discountMinor`, `totalMinor`, `currency` from the quote, `shippingAddress` = the address's
          `recipient, postalCode, street, number, complement, neighborhood, city, state, phone,
          deliveryInstructions` (no id), `paymentMethod: input.paymentMethod`,
          `paymentCard: card ? { brand, last4 } : undefined`, `installments`, and `items: { create: [...] }`
          with `productId`, `productName: product.name`, `sku: product.sku`, `quantity`, `unitPriceMinor`,
          `lineTotalMinor`, `currency: product.currency`.
      11. `await this.cart.convertForCheckout(userId, input.cartId, tx)`; return the created order mapped.
    - `listForUser(userId)`: `prisma.order.findMany({ where: { userId }, include: { items: true }, orderBy: { placedAt: 'desc' }, take: 50 })`, mapped.
    - `findForUser(userId, orderId)`: `prisma.order.findFirst({ where: { id: orderId, userId }, include: { items: true } })`, mapped, or `null`.
    - `hasPurchased(userId, productId)`: `true` when `prisma.orderItem.findFirst({ where: { productId,
      order: { userId, status: { not: 'CANCELLED' } } }, select: { id: true } })` finds a row.
    Mapping an order row (with `items`) to `OrderResponse`: copy `id, orderNumber, status, subtotalMinor,
    shippingMinor, discountMinor, totalMinor, currency, shippingAddress, paymentMethod, paymentCard,
    installments, deliveryNote` (JSON columns cast as is; null stays null), `placedAt.toISOString()`,
    `deliveredAt?.toISOString() ?? null`, and `lines` = items as `{ productId, productName, sku, quantity,
    unitPriceMinor, lineTotalMinor, currency }` only. A re-read order equals the one returned at creation.
