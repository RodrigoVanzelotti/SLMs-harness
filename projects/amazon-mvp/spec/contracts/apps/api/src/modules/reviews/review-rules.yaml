- id: api.reviews.review-rules.summarize
  type: implement
  kind: function
  target: apps/api/src/modules/reviews/review-rules.ts::summarize
  signature: 'export function summarize(baselines: RatingBaseline[], stars: StarCount[]): RatingSummary'
  uses:
  - api.reviews.review-rules.RatingBaseline
  - api.reviews.review-rules.StarCount
  - contract.RatingSummary
  - contract.RatingBucket
  imports:
  - import { RatingSummary } from '@amazon-mvp/api-contract';
  - import type { RatingBucket } from '@amazon-mvp/api-contract';
  description: |-
    Merge demo listing aggregates (baselines) with written-review star counts into one `RatingSummary` (`average`, `count`, `distribution`).
    - Baselines sharing a `listingKey` (variants of one listing) count once: keep the first of each key.
    - `count` = sum of kept `ratingCount` + sum of written `count`; `sum` = sum of kept `ratingSum` +
      sum of `rating * count`.
    - Per-star totals, index 0 = 5 stars ... index 4 = 1 star: each kept baseline adds
      `ratingCount * percent / 100` (unrounded) for each of its 5 `distribution` values (5 stars first);
      each written `{ rating, count }` adds `count` to star `rating`.
    - `average` = `Math.round((sum / count) * 10) / 10`, or `null` when `count` is 0.
    - `distribution` = 5 buckets `{ stars, percent }` for stars 5, 4, 3, 2, 1, with
      `percent = count ? Math.round((starTotal / count) * 100) : 0`; but `null` when any kept baseline's
      `distribution` does not have exactly 5 values (unknown; never derived from the average). Its
      `ratingCount` and `ratingSum` still count.
  examples:
  - 'summarize([], [{ rating: 5, count: 3 }, { rating: 2, count: 1 }]) == { average: 4.3, count: 4, distribution:
    [{ stars: 5, percent: 75 }, { stars: 4, percent: 0 }, { stars: 3, percent: 0 }, { stars: 2, percent: 25 }, {
    stars: 1, percent: 0 }] }'
  - 'summarize([], []) == { average: null, count: 0, distribution: [5, 4, 3, 2, 1].map((stars) => ({ stars, percent:
    0 })) }'
  - 'summarize([{ listingKey: ''a'', ratingCount: 100, ratingSum: 450, distribution: [] }], []) == { average: 4.5,
    count: 100, distribution: null }'
  tests:
  - tests/apps/api/src/modules/reviews/review-rules.summarize.unit.spec.ts
  max_output_tokens: 512
