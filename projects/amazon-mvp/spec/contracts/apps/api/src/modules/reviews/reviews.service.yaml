  description: |-
    Reviews service over Prisma `review`, `reviewHelpfulVote` and `reviewRatingBaseline`: lists, rating summaries, viewer state, own review, helpful votes.
    Prisma fields: `review { id, productId, userId (null for demo rows), authorName, rating, title, body,
    verifiedPurchase, helpfulCount, createdAt, updatedAt }` with unique key `productId_userId`;
    `reviewHelpfulVote { reviewId, userId }` (one row per pair, relation `review`);
    `reviewRatingBaseline { productId, listingKey, ratingCount, ratingSum, distribution: number[] }`.
    Every method first de-duplicates `productIds` (`[...new Set(ids)]`).
    - `list(q)`: `where = { productId: { in: ids }, ...(q.stars ? { rating: q.stars } : {}) }`; `orderBy` for
      `'recent'` is `[{ createdAt: 'desc' }, { id: 'asc' }]`, else `[{ helpfulCount: 'desc' }, { createdAt: 'desc' }, { id: 'asc' }]`.
      `const [rows, total] = await this.prisma.$transaction([review.findMany({ where, orderBy, skip: (q.page - 1) * q.pageSize, take: q.pageSize }), review.count({ where })])`;
      return `{ items: rows mapped, total, page: q.page, pageSize: q.pageSize }`.
    - `summary(ids)`: in parallel `reviewRatingBaseline.findMany({ where: { productId: { in: ids } }, orderBy: { productId: 'asc' } })`
      and `review.groupBy({ by: ['rating'], where: { productId: { in: ids } }, _count: { _all: true } })`;
      return `summarize(baselines, groups.map((g) => ({ rating: g.rating, count: g._count._all })))`.
    - `summaries(ids)`: the same two queries (no orderBy; groupBy `['productId', 'rating']`); return
      `{ items }` with one `{ productId, average, count }` per unique id, in request order, each from
      `summarize` over that product's rows only (nothing → `average: null, count: 0`).
    - `viewerState(userId, ids)`: in parallel `review.findMany({ where: { userId, productId: { in: ids } }, select: { id: true, productId: true } })`
      and `reviewHelpfulVote.findMany({ where: { userId, review: { productId: { in: ids } } }, select: { reviewId: true } })`;
      return `{ ownReviews, helpfulReviewIds: votes.map((v) => v.reviewId) }`.
    - A product exists when `(await this.catalog.findByIds([productId])).length > 0`.
    - `findOwn(userId, productId)`: product missing → `null`. Else in parallel
      `review.findUnique({ where: { productId_userId: { productId, userId } } })` and
      `this.orders.hasPurchased(userId, productId)`; return `{ review: mapped or null, verifiedPurchase }`
      (the current purchase state, which may differ from the stored review's flag).
    - `saveOwn(userId, input)`: product missing → `throw ApiError.notFound('Product')`. In parallel
      `this.users.findById(userId)` and `this.orders.hasPurchased(userId, input.productId)`; no user →
      `throw ApiError.sessionRequired()`. `data = { authorName: publicName(user.displayName), rating, title,
      body, verifiedPurchase }`; `review.upsert({ where: { productId_userId: { productId, userId } }, update: data,
      create: { ...data, productId, userId } })` (an edit keeps id and createdAt). If it throws
      `Prisma.PrismaClientKnownRequestError` with `code === 'P2002'`, return `review.update({ where, data })`
      mapped instead; rethrow anything else.
    - `markHelpful(userId, reviewId)`: `review.findUnique({ where: { id: reviewId }, select: { userId: true } })`;
      missing → `ApiError.notFound('Review')`; own review → `throw new HttpException({ code: ReviewErrorCode.REVIEW_SELF_VOTE,
      message: 'Você não pode marcar sua própria avaliação como útil.' }, HttpStatus.FORBIDDEN)`. Then in
      `this.prisma.$transaction(async (tx) => ...)`: `tx.reviewHelpfulVote.createMany({ data: [{ reviewId, userId }], skipDuplicates: true })`;
      if `count` is 1, `tx.review.update({ where: { id: reviewId }, data: { helpfulCount: { increment: 1 } }, select: { helpfulCount: true } })`,
      else `tx.review.findUniqueOrThrow` with the same select; return `{ reviewId, helpfulCount, voted: true }`.
      A repeated vote is a no-op returning the same count.
    Mapping a review row: `{ id, productId, authorName, rating, title, body, verifiedPurchase, helpfulCount,
    createdAt: toISOString(), updatedAt: toISOString() }` (no userId, source or fixtureKey).
