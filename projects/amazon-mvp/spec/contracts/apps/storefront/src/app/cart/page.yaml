  uses:
  - sf.config.feature-gate.isFeatureEnabled
  - sf.config.feature-gate.FeatureRoute
  - sf.config.storefront-config.getConfig
  - contract.CatalogPage
  - sf.features.checkout.pricing-server.getCheckoutPricing
  - sf.components.amazon.amazon-header.AmazonHeader
  - sf.features.cart.cart-content.CartContent
  - sf.features.product.reviews.product-reviews.withRatings
  - sf.components.amazon.amazon-footer.AmazonFooter
  - config.app-config.StorefrontConfig
  - contract.CatalogItem
  - sf.features.checkout.pricing-server.PixPricing
  - sf.features.product.reviews.ratings.RatedCatalogItem
  - contract.CheckoutPricing
  - sf.features.product.reviews.ratings.CardRating
  after:
  - sf.features.home.catalog-mock.varied
  - sf.features.home.catalog-mock.PRODUCTS
  - sf.features.home.catalog-mock.BEST_SELLERS
  - sf.features.home.catalog-mock.RECOMMENDED
  imports:
  - import { CatalogPage } from '@amazon-mvp/api-contract';
  - import { AmazonHeader } from '@/components/amazon/amazon-header';
  - import { AmazonFooter } from '@/components/amazon/amazon-footer';
  - import { isFeatureEnabled, FeatureRoute } from '@/config/feature-gate';
  - import { getConfig } from '@/config/storefront-config';
  - import { CartContent } from '@/features/cart/cart-content';
  - import { getCheckoutPricing } from '@/features/checkout/pricing-server';
  - import { withRatings } from '@/features/product/reviews/product-reviews';
  - import type { StorefrontConfig } from '@amazon-mvp/config-schema';
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  - import type { RatedCatalogItem } from '@/features/product/reviews/ratings';
  - import type { CheckoutPricing } from '@amazon-mvp/api-contract';
  - import type { CardRating } from '@/features/product/reviews/ratings';
  description: |-
    Route `/cart` ("Carrinho"): renders `CartContent` with up to 12 catalog suggestions and the Pix rate, or Coming Soon when the cart is off.
    - When `isFeatureEnabled('cart')` is false, return `<FeatureRoute routeKey="cart" title="Carrinho">{null}</FeatureRoute>`, which shows Coming Soon, and load nothing.
    - Otherwise, with `config = getConfig()`, fetch `${config.api.internalBaseUrl}${config.api.publicBasePath}/catalog/products?pageSize=12` with `{ cache: 'no-store' }`.
      - A non-ok response or a thrown error sets `catalogFailed = true` and leaves the catalog as `{ items: [], total: 0 }`.
      - Otherwise the JSON body is a `CatalogPage`.
    - `checkoutEnabled = isFeatureEnabled('checkout')`. `pricing = checkoutEnabled ? await getCheckoutPricing() : null`, so pricing is never requested when checkout is off.
    - Render `<div className="amazon-cart-page" id="top">`, containing in order:
      1. `<AmazonHeader />`.
      2. `CartContent` with `products={await withRatings(catalog.items)}`, `catalogFailed`, `checkoutEnabled` and `pixDiscountPercent={pricing?.pixDiscountPercent ?? null}`.
      3. `<AmazonFooter />`.
    When the cart is enabled, the page is not wrapped in `FeatureRoute`.
  max_output_tokens: 512
