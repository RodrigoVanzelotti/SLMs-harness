# Contracts for apps/storefront/src/app/checkout/success/[orderId]/page.tsx. Generated by tools/planner; edit descriptions, examples and notes only.
units:
- id: sf.app.checkout.success._orderId_.page.CheckoutSuccess
  type: integrate
  kind: function
  target: apps/storefront/src/app/checkout/success/[orderId]/page.tsx::CheckoutSuccess
  signature: 'export default async function CheckoutSuccess({ params }: { params: { orderId: string } })'
  uses:
  - sf.config.feature-gate.isFeatureEnabled
  - sf.config.feature-gate.FeatureRoute
  - sf.features.auth.server-session.getServerSession
  - sf.config.storefront-config.getConfig
  - contract.OrderResponse
  - sf.features.checkout.checkout-shell.CheckoutShell
  - sf.features.orders.order-presentation.paymentLabel
  - sf.features.cart.money.formatCartMoney
  - sf.features.orders.order-presentation.discountLabel
  - contract.SessionResponse
  - config.app-config.StorefrontConfig
  - contract.AddressInput
  - contract.SimulatedPayment
  - contract.OrderPaymentCard
  - contract.OrderLineResponse
  - contract.UserProfile
  - contract.CardBrand
  after:
  - sf.features.orders.order-presentation.dateFormat
  imports:
  - import Link from 'next/link';
  - import { cookies } from 'next/headers';
  - import { redirect, notFound } from 'next/navigation';
  - import { OrderResponse } from '@amazon-mvp/api-contract';
  - import { isFeatureEnabled, FeatureRoute } from '@/config/feature-gate';
  - import { getConfig } from '@/config/storefront-config';
  - import { getServerSession } from '@/features/auth/server-session';
  - import { CheckoutShell } from '@/features/checkout/checkout-shell';
  - import { formatCartMoney } from '@/features/cart/money';
  - import { paymentLabel, discountLabel } from '@/features/orders/order-presentation';
  - import type { SessionResponse } from '@amazon-mvp/api-contract';
  - import type { StorefrontConfig } from '@amazon-mvp/config-schema';
  - import type { AddressInput } from '@amazon-mvp/api-contract';
  - import type { SimulatedPayment } from '@amazon-mvp/api-contract';
  - import type { OrderPaymentCard } from '@amazon-mvp/api-contract';
  - import type { OrderLineResponse } from '@amazon-mvp/api-contract';
  - import type { UserProfile } from '@amazon-mvp/api-contract';
  - import type { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Route `/checkout/success/[orderId]`: the order confirmation shown after checkout, loaded from the orders API with the visitor's cookies.
    Steps, in order:
    1. When `isFeatureEnabled('checkout')` is false, return `<FeatureRoute routeKey="checkout" title="Pedido">{null}</FeatureRoute>`.
    2. When there is no session (`getServerSession()`), `redirect('/login?next=checkout')`.
    3. When `params.orderId` does not match `/^[a-f\d]{8}(-[a-f\d]{4}){3}-[a-f\d]{12}$/i`, `notFound()`.
    4. Fetch `${api.internalBaseUrl}${api.publicBasePath}/orders/${orderId}`, where `api` is `getConfig().api`, with `{ cache: 'no-store', headers: { cookie: cookies().toString() } }`.
       - Status 401: `redirect('/login?next=checkout')`.
       - Status 404: `notFound()`.
       - Any other non-ok status: `throw new Error('Order unavailable')`.
       - Otherwise the JSON body is the `OrderResponse`.
    Format every amount with `formatCartMoney(amountMinor, currency)`, using the line's or the order's currency.
    Markup: `<CheckoutShell>` wrapping `<main className="az-checkout-main az-checkout-success">`, which holds three `<section className="az-checkout-panel">` elements:
    1. The first section contains:
       - `<h1>Pedido confirmado!</h1>`
       - `<p>Seu pedido foi salvo. O pagamento é simulado e não houve cobrança real.</p>`
       - `<p className="az-checkout-order-number">Número do pedido: <strong>{orderNumber}</strong></p>`
       - A `<p>` with `Status: ` followed by `Recebido — pendente` (with an em dash) when `order.status` is `PENDING`, or the raw status otherwise.
    2. The second section contains `<h2>Entrega</h2>`, then the address and payment:
       - When `shippingAddress` is non-null, a `<p>` with four lines separated by `<br />`: the recipient; `street, number`, followed by `, complement` when there is one; `neighborhood, city — state`; the postalCode.
       - `<p>Pagamento: {paymentLabel(order)}</p>`.
    3. The third section contains, in order:
       - `<h2>Resumo do pedido</h2>`.
       - `<ul className="az-checkout-confirmed-items">` with one `<li>` per order line (key productId). Each holds `<span>{quantity} × {productName}</span>` (U+00D7) and a `<strong>` with the line total.
       - A `<p>` with `Subtotal: ` followed by the formatted `subtotalMinor`, then a `<p>` with `Frete: ` followed by the formatted `shippingMinor`.
       - Only when `discountMinor > 0`: a `<p>` with `{discountLabel(order)}: −` followed by the formatted `discountMinor`. The minus is U+2212, not a hyphen.
       - `<p className="az-checkout-total">`, holding `Total: ` and then a `<strong>` with the formatted `totalMinor`.
       - `<Link className="az-cart-button" href="/">Continuar comprando</Link>`.
  max_output_tokens: 1280
