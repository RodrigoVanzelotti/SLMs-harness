- id: sf.app.layout.RootLayout
  type: integrate
  kind: function
  target: apps/storefront/src/app/layout.tsx::RootLayout
  signature: 'export default async function RootLayout({ children }: { children: ReactNode })'
  uses:
  - sf.app.layout.BARE_ROUTES
  - sf.app.layout.ACCOUNT_AREA_ROUTES
  - sf.app.layout.CUSTOMER_PAGE_ROUTES
  - sf.config.feature-gate.isFeatureEnabled
  - sf.features.auth.server-session.getServerSession
  - sf.features.cart.cart-provider.CartProvider
  - sf.components.navigation.FeatureStampStrip
  - sf.components.navigation.Navigation
  - contract.SessionResponse
  - contract.UserProfile
  after:
  - sf.features.corporate.corporate-routes.CORPORATE_ROUTES
  imports:
  - import type { Metadata } from 'next';
  - import { headers } from 'next/headers';
  - import { ReactNode } from 'react';
  - import { FeatureStampStrip, Navigation } from '@/components/navigation';
  - import { CartProvider } from '@/features/cart/cart-provider';
  - import { getServerSession } from '@/features/auth/server-session';
  - import { isFeatureEnabled } from '@/config/feature-gate';
  - import { CORPORATE_ROUTES } from '@/features/corporate/corporate-routes';
  - import './globals.css';
  - import type { SessionResponse } from '@amazon-mvp/api-contract';
  - import type { UserProfile } from '@amazon-mvp/api-contract';
  description: |-
    Root layout: the `<html lang="pt-BR">` shell that wraps every page in `CartProvider` and adds the generic navigation except on Amazon-styled routes.
    - `pathname = headers().get('x-pathname') ?? ''`. The middleware sets that header.
    - `bare` is true when any of these holds:
      - `BARE_ROUTES`, `ACCOUNT_AREA_ROUTES` or `CUSTOMER_PAGE_ROUTES` includes the exact pathname.
      - The pathname is `/checkout` or starts with `/checkout/`.
      - The pathname is `/orders` or starts with `/orders/`.
      - The pathname matches `/^\/products\/[^/]+(\/review)?\/?$/`.
    - `cartEnabled = isFeatureEnabled('cart')`. `session = cartEnabled ? await getServerSession() : null`.
    - Markup: `<html lang="pt-BR"><body>` containing `CartProvider` with `key={session?.user.id ?? 'guest'}`, `userId={session?.user.id ?? null}` and `enabled={cartEnabled}`. The provider holds, in order:
      1. `<a className="visually-hidden" href="#main">Skip to content</a>`.
      2. `<FeatureStampStrip />`, only when not bare.
      3. `<Navigation />`, only when not bare.
      4. `<div id="main">{children}</div>`.
    `metadata`, `dynamic`, the route lists and the `globals.css` import are provided.
  max_output_tokens: 512
