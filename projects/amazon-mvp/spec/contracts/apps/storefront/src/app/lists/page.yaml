    Route `/lists` ("Suas listas"): the signed-in shopping and wish lists, showing the list chosen by `?list=<id>`, or the first list.
    Return `FeatureRoute` with `routeKey="lists"` and `title="Suas listas"`. Its only child is a separate async server component that you write in this file and give `searchParams`. That component does this:
