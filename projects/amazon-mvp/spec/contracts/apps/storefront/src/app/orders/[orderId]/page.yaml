         - `Subtotal do(s) item(ns):` with the subtotal.
         - `Frete e manuseio:` with the shipping.
         - Only when `discountMinor > 0`: `{discountLabel(order)}:` with `-` (ASCII hyphen) followed by the discount.
         - `Total do pedido:` with the total. This last row's div has `className="az-order-detail__grand"`.
    5. `<article className="az-order" aria-label={`Pedido nº ${order.orderNumber}`}>` containing `<OrderShipment order={order} />`.
