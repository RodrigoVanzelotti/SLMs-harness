    4. `<section className="az-order-detail__summary" aria-label="Informações do pedido">`, holding three `<div>`s:
       - `<h2>Endereço de envio</h2>`, then either an `<address>` or `<p>Não informado</p>` when there is no `shippingAddress`. The `<address>` has four lines separated by `<br />`: the recipient; `street, number`, followed by `, complement` when there is one; `neighborhood, city — state`; the postalCode.
