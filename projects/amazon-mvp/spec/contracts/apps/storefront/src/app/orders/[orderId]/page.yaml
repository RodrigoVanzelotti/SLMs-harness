  description: |-
    Route `/orders/[orderId]` ("Detalhes do pedido"): one signed-in order, with its address, payment, totals and shipment card.
    Return `FeatureRoute` with `routeKey="orderDetails"` and `title="Detalhes do pedido"`. Its only child is a separate async server component that you write in this file and give `params.orderId`. That component checks, in order:
