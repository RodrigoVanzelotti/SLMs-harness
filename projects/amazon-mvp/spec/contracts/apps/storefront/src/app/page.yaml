  description: |-
    Route `/`: the Amazon-style home page, with a hero and catalog-backed product shelves; a signed-in user's recent orders take the first collection slot.
    Data, loaded before rendering:
    - `orders`: when `isFeatureEnabled('orders')` is true and `await getServerSession()` returns a session, `(await fetchOrders()) ?? []`. Otherwise `[]`, and `fetchOrders` is not called.
    - `curated`: `HOME_COLLECTIONS` without its last entry (`.slice(0, -1)`) when there are orders, else all of `HOME_COLLECTIONS`.
    - `resolve = await resolveHomeProducts([DEALS_OF_THE_DAY, BEST_SELLERS, RECOMMENDED, ALSO_CONSIDER, ...curated.map((c) => c.products)])`.
    - `collections`: each curated collection with `products` replaced by `resolve(products)`. Collections whose resolved list is empty are dropped.
    Markup: `FeatureRoute` with `routeKey="home"` and `title="Home"` (the route 404s when off). It wraps `<div className="amazon-home" id="top">`, which contains in order:
    1. `<AmazonHeader />`.
    2. `<main className="az-main">`, containing `<HeroBanner />` and then `<div className="az-content">` with:
       - `ProductSection` with title `Ofertas do dia` and `products={resolve(DEALS_OF_THE_DAY)}`.
       - `CategorySection` with title `Compre por categoria` and `categories={CATEGORIES}`.
       - `ProductCollections` with `collections` and `leading` = `<RecentOrdersCard orders={orders} />` when there are orders, else undefined.
       - `ProductSection` with title `Mais vendidos` and `resolve(BEST_SELLERS)`.
       - `<div className="az-home-ending">` holding a `ProductSection` with title `Recomendados para você` (`resolve(RECOMMENDED)`) and a `ProductSection` with title `Confira também` (`resolve(ALSO_CONSIDER)`).
    3. `<AmazonFooter />`.
  max_output_tokens: 768
