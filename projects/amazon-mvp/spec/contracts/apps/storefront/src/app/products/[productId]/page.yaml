  description: |-
    Route `/products/[productId]`: loads the product, its variant family, reviews, pricing and the viewer's purchases, and renders the full product page.
    The header and footer come from the route's layout, so do not render them here.
    Flag and lookup:
    - When `isFeatureEnabled('productDetails')` is false, return `<FeatureRoute routeKey="productDetails" title="Produto">{null}</FeatureRoute>` and load nothing.
    - `product = await getCatalogProduct(params.productId)`, which accepts a UUID or a slug. Errors propagate. When the result is null, `notFound()`.
    - `content = productContent(product)`. Read the flags `cart`, `checkout` and `catalog` with `isFeatureEnabled`.
    Variant family (sibling catalog records in `content.variant.group`):
    - `siblings`: `[]` without `content.variant`. Otherwise call `findCatalogProduct` in parallel for every slug of `variantGroupSlugs(group)` except `product.slug`, and drop the nulls.
    - Each member is `{ product: item, options: c.variant?.options ?? [], image: c.images[0] }`. Here `c` is `content` for the product itself and `productContent(item)` for a sibling.
    - `members` is `[current, ...siblings]`, sorted by each slug's index in `variantGroupSlugs(group)`. All indexes count as 0 when there is no group.
    - `dimensions` is `variantDimensions(current, members)` when there is at least one sibling, else `[]`.
    - `familyIds` holds the ids of `members` in sorted order, and the reviews request lists them in that order.
    Next, `session = await getServerSession()`. Then load the following in one `Promise.all`:
    - orders: `fetchOrders()` only when there is a session and the `orders` flag is on, else null.
    - address: `getDeliveryAddress()` only when there is a session and checkout is on, else null.
    - pricing: `getCheckoutPricing()` only when checkout is on, else null. Never request it when checkout is off.
    - related: `relatedProducts(product, new Set(familyIds))` followed by `withRatings`. Elsewhere `familyIds` is the plain array.
    - brand products: when `content.brand` is set, `findCatalogProduct` for each slug of `brandSlugs(content.brand)` except `product.slug`, else `[]`.
    - reviews: `productReviews({ productId: product.id, familyIds, variantOptions, productSlugs, query: parseReviewQuery(searchParams), signedIn: Boolean(session) })`. `variantOptions` and `productSlugs` are Maps from each member's id to its options and to its slug.
    - cards: `fetchPaymentCards()` when there is a session, else null.
    Derived values:
    - `primeNotice`: a session and `showPrimeNotice(cards, cookies().get(PRIME_NOTICE_COOKIE)?.value, session.user.id)`.
    - `purchase`: `lastPurchase(orders, familyIds)` when `orders` is non-null, else null.
    - `purchasedOptions`: the options of the member whose id is `purchase.line.productId`, else `[]`.
    - `story = brandStory(content.brand)`, `pix = pricing?.pixDiscountPercent ?? null`, `rating = reviews.summary ?? undefined`.
    - `productPath = /products/${encodeURIComponent(product.slug)}` and `reviewHref = ${productPath}/review`.
    - `notice` is `searchParams.review` when that is `'published'` or `'updated'`, else undefined.
    Markup inside `<main className="az-pdp">`, in order:
    1. When the `browsingHistory` flag is on, `RecordProductView` with the product's id and name and `image={content.images[0]}`.
    2. When there is a session and `primeNotice` is true, `<PrimePaymentNotice userId={session.user.id} userName={session.user.displayName} />`.
    3. `ProductBreadcrumb` with `path={product.categoryPath}` and `hrefFor={categoryHref}`. Pass `hrefFor` only when the catalog is on.
    4. When `purchase` is set, `PurchaseNotice` with `purchase`, `options={purchasedOptions}` and `reviewHref`.
    5. `<div className="az-pdp-layout">`, containing in order:
       - `ProductGallery` with key `gallery-${product.id}`, the product's name and `images={content.images}`.
       - `ProductOverview` with `product`, `content`, `rating`, `dimensions` and `pixDiscountPercent={pix}`. Its `brandHref` is `brandHref(content.brand)` when there is a brand and the catalog is on; otherwise `'#brand-story'` when a story exists; otherwise undefined.
       - `<aside className="az-pdp-aside" aria-label="Opções de compra">`, holding `<PrimeUpsell />` and then `ProductPurchase`. Give `ProductPurchase` the key `purchase-${product.id}`, `product`, `cartEnabled`, `checkoutEnabled`, `installments` and `fulfillment` from `content`, `address` and `pixDiscountPercent={pix}`. Pass `lists={{ signedIn: Boolean(session) }}` only when the `lists` flag is on.
    6. When `related` is non-empty, `<section className="az-pdp-section" aria-labelledby="related-title">`. It holds `<h2 id="related-title">Produtos relacionados a este item</h2>` and a `HorizontalRail` with `label="Produtos relacionados a este item"` and `className="az-pdp-product-rail"`. The rail contains one `<ProductCard product={item} compact freeDelivery />` per item, with key `item.id`.
    7. `<ProductDetailsSection content={content} rating={rating} />`, then `<ProductDescription description={product.description} />`.
    8. When `story` is set, `BrandStorySection` with `story`. Its `listingHref` is `brandHref(story.name)`, passed only when the catalog is on. Its `products` are the brand products that are non-null and `active`, each mapped to `{ product, image: productContent(item).images[0] }`.
    9. `CustomerReviews` with `reviews`, `writeReviewHref={reviewHref}`, `productPath`, `notice` and `loginHref = /login?next=${encodeURIComponent(`${productPath}#customer-reviews`)}`.
  tests:
  - tests/apps/storefront/test/product-page.ProductDetailPage.unit.spec.ts
  max_output_tokens: 2816
