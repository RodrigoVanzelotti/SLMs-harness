  description: |-
    Page title, description and Open Graph data for a product page, built from the product's catalog record.
    - When `isFeatureEnabled('productDetails')` is false, return `{}`.
    - `product = await getCatalogProduct(params.productId)`, treating a rejection as `null`. When it is null, return `{ title: 'Produto não encontrado | Amazon.com.br' }`.
    - `content = productContent(product)`.
    - `description = (product.description ?? content.bullets[0] ?? product.name).slice(0, 160)`.
    - Return `{ title: `${product.name} | ${SITE}`, description, openGraph: { title: product.name, description, images } }`, using the provided `SITE`. `images` is `content.images.slice(0, 1)` mapped to `{ url: image.src, alt: image.alt }`, so it is `[]` when the product has no photos.
    For example, the reference product `p6` gives the title `8BitDo Ultimate 2C (Mint) | Amazon.com.br`. Its catalog description is the description, and its Open Graph image is `/images/products/8bitdo-ultimate-2c/hortela-1.jpg`.
