  description: |-
    Route `/products/[productId]/review`: lets a signed-in customer create a review of a product, or edit the one they already wrote.
    Steps, in order:
    1. When `isFeatureEnabled('productReviews')` is false, return `<FeatureRoute routeKey="productReviews" title="Escreva uma avaliação">{null}</FeatureRoute>`.
    2. `product = await getCatalogProduct(params.productId)`. When it is null, `notFound()`.
    3. `productHref = /products/${encodeURIComponent(product.slug)}`. `loginHref = /login?next=${encodeURIComponent(`${productHref}/review`)}`, for example `/login?next=%2Fproducts%2Fp6%2Freview`.
    4. When there is no session (`getServerSession()`), `redirect(loginHref)`.
    5. `own = await fetchOwnReview(product.id)`. When it is `'signed-out'`, `redirect(loginHref)`. When it is `'not-found'`, `notFound()`.
    6. `image = productContent(product).images[0]`.
    Markup inside `<main className="az-review-page">`, in order:
    1. An `<h1>`: `Editar avaliação` when `own?.review` exists, else `Criar avaliação`.
    2. `<div className="az-review-page__product">`, holding, when there is an image, `<Image src={image.src} alt={image.alt} width={64} height={64} />` (from `next/image`), and then `<Link href={productHref}>{product.name}</Link>`.
    3. When `own === null` (the reviews service is unreachable), `EmptyState` with the title `Não foi possível abrir sua avaliação` and the body `Não conseguimos falar com o serviço de avaliações agora. Tente novamente em instantes.`
    4. Otherwise, in order:
       - Only when `own.verifiedPurchase` is true: `<p className="az-review-page__verified">` with `Você comprou este produto: sua avaliação terá o selo `, then `<strong>Compra verificada</strong>`, then `.`.
       - `ReviewForm` with `productId={product.id}`, `productHref`, `loginHref` and `initial`. `initial` is `{ rating, title, body }` from `own.review` when that exists, else undefined.
       - `<p className="az-review-page__note">Sua avaliação é publicada com seu primeiro nome e a inicial do sobrenome. Você pode editá-la quando quiser; cada cliente tem uma avaliação por produto.</p>`.
    The `metadata` export (title `Escreva uma avaliação | Amazon.com.br`, `robots: { index: false }`) is provided.
