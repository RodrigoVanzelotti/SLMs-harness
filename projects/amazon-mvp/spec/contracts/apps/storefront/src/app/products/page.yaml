  imports:
  - import { Suspense } from 'react';
  - import type { Metadata } from 'next';
  - import { AmazonFooter } from '@/components/amazon/amazon-footer';
  - import { AmazonHeader } from '@/components/amazon/amazon-header';
  - import { isFeatureEnabled, FeatureRoute } from '@/config/feature-gate';
  - import { brandByKey } from '@/features/product/product-content';
  - import { listingTitle } from '@/features/browse/browse-model';
  - import { type SearchParams, parseBrowseParams, browseKey } from '@/features/browse/browse-params';
  - import { fetchCategories } from '@/features/browse/browse-server';
  - import { BrowseSkeleton, BrowseResults } from '@/features/browse/browse-view';
  - import '@/features/browse/browse.css';
  - import type { BrowseParams } from '@/features/browse/browse-params';
  - import type { PriceRange } from '@/features/browse/browse-params';
  - import type { CatalogSort } from '@amazon-mvp/api-contract';
  description: |-
    Route `/products`: one URL-driven template for listings, search results, and category and brand pages. The results stream in behind a skeleton.
    - `params = parseBrowseParams(searchParams)`. The page itself is synchronous, and `BrowseResults` loads the data.
    - Return `FeatureRoute` with `routeKey="products"` and `title="Produtos"`, wrapping `<div className="amazon-browse-page" id="top">`. The div contains, in order:
      1. `<AmazonHeader search={{ q: params.q, category: params.category }} />`.
      2. `<main className="az-browse-main">`, containing `<Suspense key={browseKey(params)} fallback={<BrowseSkeleton />}>` around `<BrowseResults params={params} />`. Because of the key, a new search or filter shows the skeleton instead of stale results.
      3. `<AmazonFooter />`.
