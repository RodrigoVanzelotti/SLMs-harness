  imports:
  - import { Suspense } from 'react';
  - import type { Metadata } from 'next';
  - import { AmazonFooter } from '@/components/amazon/amazon-footer';
  - import { AmazonHeader } from '@/components/amazon/amazon-header';
  - import { isFeatureEnabled, FeatureRoute } from '@/config/feature-gate';
  - import { brandByKey } from '@/features/product/product-content';
  - import { listingTitle } from '@/features/browse/browse-model';
  - import { type SearchParams, parseBrowseParams, browseKey } from '@/features/browse/browse-params';
  - import { fetchCategories } from '@/features/browse/browse-server';
  - import { BrowseSkeleton, BrowseResults } from '@/features/browse/browse-view';
  - import '@/features/browse/browse.css';
  - import type { BrowseParams } from '@/features/browse/browse-params';
  - import type { CatalogCategoryNode } from '@amazon-mvp/api-contract';
  - import type { PriceRange } from '@/features/browse/browse-params';
  - import type { CatalogSort } from '@amazon-mvp/api-contract';
  description: |-
    Title and robots metadata for the product listing `/products`, derived from the search, category and brand in the URL.
    - When `isFeatureEnabled('catalog')` is false, return `{}`.
    - `params = parseBrowseParams(searchParams)`.
    - Call `fetchCategories()` only when `params.category` is set, and treat a rejection as `[]`. `categoryName` is the `name` of the node whose `slug` equals `params.category`. It is undefined when no node matches.
    - `brandName` is `brandByKey(params.brand)` when `params.brand` is non-empty, else undefined.
    - `title = listingTitle({ q: params.q, categoryName, brandName })`.
    - The listing is plain when `q` is empty, `price` is null, `inStock` is false and `page === 1`. Category, brand and sort do not affect this.
    - Return `{ title: `${title} | ${SITE}`, robots: plain ? undefined : { index: false } }`, using the provided `SITE`.
    For example, `{ category: 'livros' }` gives the title `Livros | Amazon.com.br`. `{ q: 'fone' }` gives the title `Resultados para “fone” | Amazon.com.br` and `robots: { index: false }`.
  tests:
  - tests/apps/storefront/test/browse-page.generateMetadata.unit.spec.ts
  max_output_tokens: 512
