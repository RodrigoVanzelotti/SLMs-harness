- id: sf.components.amazon.all-menu.AllMenu
  type: implement
  kind: function
  target: apps/storefront/src/components/amazon/all-menu.tsx::AllMenu
  signature: 'export function AllMenu({ firstName }: { firstName?: string })'
  uses:
  - sf.components.amazon.all-menu.ALL_MENU_SECTIONS
  - sf.components.amazon.all-menu.MenuSection
  - sf.components.amazon.all-menu.MenuLink
  imports:
  - '''use client'';'
  - import { useState, useRef, useEffect } from 'react';
  description: |-
    The navbar's "Todos" button and the left slide-in "Menu Todos" dialog listing every `ALL_MENU_SECTIONS` section and link.

    Client component. State `open` (false); refs on the trigger button and on the panel.

    Render a fragment:
    1. Trigger `<button type="button" className="az-navbar__link az-navbar__link--all"
       aria-expanded={open} aria-controls="az-all-menu">` that toggles `open` on click. Content: the
       menu icon, then the text `Todos` (its accessible name and trimmed text must be exactly `Todos`).
    2. Only while open, the overlay `<div className="az-all-menu" data-testid="az-all-menu-overlay">`;
       clicking it closes the menu. Inside, in order:
       - The panel `<div id="az-all-menu" className="az-all-menu__panel" role="dialog" aria-modal="true"
         aria-label="Menu Todos" tabIndex={-1}>`. Its `onClick` calls `event.stopPropagation()`, so
         clicks inside the panel do not close it. It contains:
         - `<div className="az-all-menu__header">`: the user icon, then `Olá, {firstName}`, or
           `Olá, faça seu login` when `firstName` is undefined. This is not a heading.
         - `<div className="az-all-menu__content">` with, per section (key = title),
           `<section className="az-all-menu__section">` holding `<h2 className="az-all-menu__title">{title}</h2>`
           and `<ul className="az-all-menu__list">` of
           `<li key={label}><a href={link.href} className="az-all-menu__link">{label}{chevron}</a></li>`.
           Use a plain `<a>`, not `next/link`: the hrefs are absolute amazon.com.br URLs and
           `javascript:void(0)`. The chevron icon is added only when `section.submenu` is true and the
           label is not `Ver tudo`. The dialog's headings and links are exactly these, in data order.
       - After the panel, still inside the overlay: `<button type="button" className="az-all-menu__close"
         aria-label="Fechar menu">` with the close icon; it closes the menu.

    Effect while open: save `document.body.style.overflow` and set it to `hidden`; add a `document`
    `keydown` listener that closes on `Escape`; focus the panel. The cleanup restores the saved
    overflow, removes the listener and focuses the trigger again.

    The icons (private helpers) are decorative inline SVGs with `viewBox="0 0 24 24"`,
    `aria-hidden="true"` and no text; see notes.
