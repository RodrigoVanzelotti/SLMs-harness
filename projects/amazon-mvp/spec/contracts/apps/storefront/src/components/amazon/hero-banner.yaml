- id: sf.components.amazon.hero-banner.HeroBanner
  type: implement
  kind: function
  target: apps/storefront/src/components/amazon/hero-banner.tsx::HeroBanner
  signature: export function HeroBanner()
  uses:
  - sf.components.amazon.hero-banner.KITCHEN
  - sf.components.amazon.hero-banner.COMPUTERS
  - sf.components.amazon.hero-banner.DISCOVER
  imports:
  - '''use client'';'
  - import Image from 'next/image';
  - import Link from 'next/link';
  - import { useRef, useState, useEffect } from 'react';
  description: |-
    Home hero: pantry promo card, a scrollable row of four campaign cards with prev/next buttons, and a row of six "discover" cards.

    Client component. Images are local files at `/images/home/<name>.webp` (private helper
    `imagePath(name)`), rendered with `next/image` `Image`. Every image has `alt=""` except the one noted.

    Markup: `<section className="az-promotions" aria-label="Destaques e categorias">` with
    `<h1 className="visually-hidden">Encontre produtos para o seu dia a dia</h1>` and
    `<div className="az-promotions__layout">` containing:
    1. `<Link href="/products?q=alimentos" className="az-promo az-promo--pantry">`:
       `<span className="az-promo__eyebrow">Seu mercado</span>`,
       `<h2>O essencial da sua despensa, em um só lugar</h2>`, and
       `<div className="az-pantry-photos" aria-hidden="true">` with four 300x300 images, in order:
       class `az-pantry-photos__oil` (`cooking-oil`, `priority`), `az-pantry-photos__rice` (`rice`,
       `priority`), `az-pantry-photos__coffee` (`nescafe-coffee`), `az-pantry-photos__honey` (`honey-jar`).
    2. `<div className="az-promotions__right">` with:
       a. Campaign track `<div className="az-campaigns" id="home-campaigns" ref tabIndex={0}
          aria-label="Campanhas: deslize para explorar">` with four `<article>`s:
          - `id="slide-1" className="az-promo az-promo--beauty"`: one
            `<Link href="/products?q=beleza" className="az-promo__full-link">` wrapping
            `span.az-promo__eyebrow` `Beleza e cuidados`, `<h2>Seu momento<br />de se cuidar</h2>`,
            `<p>Descubra seus novos favoritos</p>`, `<div className="az-beauty-photos" aria-hidden="true">`
            with `red-lipstick` and `eyeshadow-palette-with-mirror` (300x300, `priority`), and
            `span.az-promo__text-link` `Explore beleza ›`.
          - `id="slide-2" className="az-promo az-promo--kitchen"`: `span.az-promo__eyebrow`
            `Destaques do momento`, `<h2>Escolhas pra você</h2>`, `<div className="az-promo__tiles">` with
            one `<Link href={`/products?q=${encodeURIComponent(label)}`}>` per `KITCHEN` item
            (key = image) holding a 150x150 image and `<span>{label}</span>`, then
            `<Link href="/products?department=home" className="az-promo__text-link">` `Veja mais para sua casa ›`.
          - `id="slide-3" className="az-promo az-promo--devices"`: `<h2>Tecnologia para seu dia a dia</h2>`,
            `<p>Trabalho, estudo e diversão</p>`, `div.az-promo__tiles` with one
            `<Link href="/products?department=electronics">` per `COMPUTERS` item (same inner markup),
            then `<Link href="/products?department=electronics" className="az-promo__text-link">`
            `Explore eletrônicos ›`.
          - No id, `className="az-promo az-promo--home"`: `<Link href="/products?department=home"
            className="az-promo__full-link">` wrapping `span.az-promo__eyebrow` `Inspire-se`,
            `<h2>Novidades para sua cozinha</h2>`, `<p>Pequenos detalhes.<br />Novas possibilidades.</p>`,
            the 300x300 image `silver-pot-with-glass-cap` with `className="az-promo__large-image"` and
            `alt="Panela com tampa de vidro"`, and `span.az-promo__text-link` `Confira a seleção ›`.
          In each "... ›" text link, the `›` is a `<span aria-hidden="true">` after a space.
       b. Only when the campaign track overflows: `<div className="az-campaign-controls"
          aria-label="Navegar pelas campanhas">` with `<button type="button" aria-label="Campanha anterior"
          aria-controls="home-campaigns">‹</button>` and the same with `aria-label="Próxima campanha"` and `›`.
       c. `<div className="az-discover-wrap">` with the track `<div className="az-discover" id="home-discover"
          ref tabIndex={0} aria-label="Mais categorias para explorar">`, holding one
          `<Link className="az-discover__card" href={`/products?q=${encodeURIComponent(query)}`}>` per
          `DISCOVER` item (key = image) with `<h3>{title}</h3>` and a 150x150 image. Then, only when that
          track overflows, `<button type="button" className="az-discover__next" aria-label="Mais categorias"
          aria-controls="home-discover">›</button>`.

    State `overflow = { campaigns: false, discoveries: false }`; a track overflows when
    `scrollWidth > clientWidth + 1`. A mount-only effect computes both, and recomputes them from one
    `ResizeObserver` observing both tracks; the cleanup disconnects it. Use only `observe` and `disconnect`.

    Scroll behavior is `'auto'` when `window.matchMedia('(prefers-reduced-motion: reduce)').matches`,
    else `'smooth'`. Evaluate it only inside the click handlers.
    - Campaign buttons: `track.scrollBy({ left: direction * (w + 12), behavior })`, where `w` is the
      `getBoundingClientRect().width` of the first `article` in the track (fallback `clientWidth`);
      previous is -1, next is +1.
    - Discover button: at the end (`scrollLeft + clientWidth >= scrollWidth - 2`), `scrollTo({ left: 0 })`;
      otherwise `scrollTo({ left: scrollLeft + clientWidth * 0.7 })`.
