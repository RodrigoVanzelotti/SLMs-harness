  imports:
  - '''use client'';'
  - import { ReactNode, useId, useRef, useState, useEffect } from 'react';
  description: |-
    Client wrapper that shows server-rendered children in a horizontally scrollable, keyboard-focusable track with previous/next arrows.

    State: `id = useId()`, a ref on the track, and `edges = { previous: false, next: false }`.

    `updateEdges()` reads the track: `previous = scrollLeft > 2`,
    `next = scrollLeft + clientWidth < scrollWidth - 2`. It sets state only when a value changed.

    Effect, re-run when `children` changes: create `new ResizeObserver(updateEdges)`, observe the track
    and each of its element children, call `updateEdges()` once, and `disconnect()` in the cleanup. Use
    only `observe` and `disconnect`: tests stub `ResizeObserver` with just those two methods.

    `scroll(direction)`: `first` = width of the track's first element child
    (`getBoundingClientRect().width`, 160 if none). Call
    `track.scrollBy({ left: direction * Math.max(first, clientWidth - first), behavior })`, where
    behavior is `'auto'` if `window.matchMedia('(prefers-reduced-motion: reduce)').matches`, else
    `'smooth'`. Call `matchMedia` only here, never during render or in effects.

    Markup: `<div className={`az-rail ${className}`}>` containing:
    1. `<div className="az-rail__track" ref id={id} role="region" aria-label={label} tabIndex={0}
       onScroll={updateEdges} onKeyDown>` with the children. On keydown, ignore events whose `target`
       is not the track itself. For `ArrowRight`/`ArrowLeft`, call `preventDefault()` and
       `scroll(+1)`/`scroll(-1)`.
    2. Only when `edges.previous || edges.next`, two buttons:
       - `<button type="button" className="az-rail__arrow az-rail__arrow--previous"
         aria-label={`Voltar em ${label}`} aria-controls={id} disabled={!edges.previous}>` with
         `<span aria-hidden="true">‹</span>`; click calls `scroll(-1)`.
       - `<button type="button" className="az-rail__arrow az-rail__arrow--next"
         aria-label={`Avançar em ${label}`} aria-controls={id} disabled={!edges.next}>` with
         `<span aria-hidden="true">›</span>`; click calls `scroll(1)`.
    Before any measurement (and in jsdom, where sizes are 0) no arrows are rendered.
