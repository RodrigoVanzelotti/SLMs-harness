    Render `<div className="field">` with:
    - `<label className="field__label" htmlFor={inputId}>{label}</label>`
    - `<input id={inputId} className="field__input" aria-invalid={error ? 'true' : undefined}
      aria-describedby={describedBy || undefined} {...rest} />`. `rest` is spread last, so a caller
      may override these attributes.
    - When `hint`: `<p className="field__hint" id={`${inputId}-hint`}>{hint}</p>`
    - When `error`: `<p className="field__error" id={`${inputId}-error`} role="alert">{error}</p>`
