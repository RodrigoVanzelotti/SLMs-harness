  description: |-
    Browser client for the account pages: addresses, name/e-mail/password changes and lists, with pt-BR error messages.
    Every method calls one private `request<T>(path, method = 'GET', body?)` helper:
    - `fetch(path, { method, credentials: 'same-origin', cache: 'no-store', headers, body })`. Only when `body` is given,
      `headers` is `{ 'content-type': 'application/json' }` and `body` is `JSON.stringify(body)`; otherwise both are undefined.
    - If `fetch` throws: throw `new AccountRequestError('Não foi possível conectar. Tente novamente.', 0, 'NETWORK')`.
    - Status 204: resolve `undefined` without reading the body.
    - Otherwise read `response.json()`, using `null` if parsing fails. If `response.ok`, resolve that payload.
    - If not ok: `error = isApiErrorBody(payload) ? payload.error : null`. Throw
      `new AccountRequestError(message, response.status, error?.code ?? 'UNKNOWN')`. Pick `message` in this order:
      1. code `ErrorCode.AUTH_INVALID_CREDENTIALS`: `Sua senha atual está incorreta.`
      2. code `ErrorCode.AUTH_EMAIL_ALREADY_REGISTERED`: `Já existe uma conta com este e-mail.`
      3. status 401: `Sua sessão expirou. Entre novamente para continuar.`
      4. status 404: `Este item não existe mais. Atualize a página.`
      5. `error.details` non-empty: `Confira os campos e tente novamente.`
      6. code `LIST_LIMIT_EXCEEDED` or `LIST_DEFAULT_PROTECTED`: the API's `error.message`.
      7. anything else: `Não foi possível concluir a solicitação.`

    Methods (ids and product ids are `encodeURIComponent`-encoded in paths; `A = CHECKOUT_ROUTES.addresses`,
    `L = LIST_ROUTES.lists`):
    - `addresses()`: GET `A`, resolves `AccountAddress[]`.
    - `updateAddress(id, data)`: PUT `A/{id}` with body `data`, resolves `AccountAddress`.
    - `deleteAddress(id)`: DELETE `A/{id}`, resolves `AccountAddress[]` (the remaining list).
    - `setDefaultAddress(id)`: POST `A/{id}/default` with no body, resolves `AccountAddress[]`.
    - `updateName(displayName)`: PATCH `ACCOUNT_ROUTES.profile` with `{ displayName }`, resolves `UserProfile`.
    - `changeEmail(email, currentPassword)`: POST `ACCOUNT_ROUTES.email` with `{ email, currentPassword }`, resolves `UserProfile`.
    - `changePassword(currentPassword, newPassword)`: POST `ACCOUNT_ROUTES.password` with `{ currentPassword, newPassword }`,
      resolves `ChangePasswordResponse`.
    - `lists()`: GET `L`, resolves `ListSummary[]`. `list(id)`: GET `L/{id}`, resolves `ListDetails`.
    - `createList(name)`: POST `L` with `{ name }`, resolves `ListSummary`.
    - `renameList(id, name)`: PATCH `L/{id}` with `{ name }`, resolves `ListSummary`.
    - `deleteList(id)`: DELETE `L/{id}`, resolves `void`.
    - `addToList(id, productId)`: POST `L/{id}/items` with `{ productId }`, resolves `ListDetails`.
    - `removeFromList(id, productId)`: DELETE `L/{id}/items/{productId}`, resolves `ListDetails`.
    For example, `setDefaultAddress('x y')` POSTs to `/api/v1/addresses/x%20y/default`, and `removeFromList('l1', 'p/1')`
    DELETEs `/api/v1/lists/l1/items/p%2F1`.
