- id: sf.features.account.account-presentation.stockLabel
  type: implement
  kind: function
  target: apps/storefront/src/features/account/account-presentation.ts::stockLabel
  signature: 'export function stockLabel(product: CatalogItem): { text: string; tone: ''ok'' | ''low'' | ''out''
