  uses:
  - contract.CatalogItem
  - sf.features.account.account-presentation.LOW_STOCK
  imports:
  - import { CatalogItem } from '@amazon-mvp/api-contract';
  description: |-
    Stock line for a saved product, worded like the product page, with a tone for styling (`ok`, `low` or `out`).
    Checks, in order:
    1. `!product.active`: `{ text: 'Indisponível no momento', tone: 'out' }`.
    2. `!product.inStock`: `{ text: 'Fora de estoque', tone: 'out' }`.
    3. `product.availableQuantity <= LOW_STOCK` (5): `{ text: 'Apenas N em estoque', tone: 'low' }`, where N is the quantity.
    4. Otherwise: `{ text: 'Em estoque', tone: 'ok' }`.
  examples:
  - 'stockLabel({ ...item, active: true, inStock: true, availableQuantity: 5 }) == { text: "Apenas 5 em estoque",
    tone: "low" }'
  - 'stockLabel({ ...item, active: true, inStock: true, availableQuantity: 6 }) == { text: "Em estoque", tone: "ok"
    }'
  - 'stockLabel({ ...item, active: false, inStock: false, availableQuantity: 0 }) == { text: "Indisponível no momento",
    tone: "out" }'
  tests:
  - tests/apps/storefront/test/account.stockLabel.unit.spec.ts
  max_output_tokens: 512
