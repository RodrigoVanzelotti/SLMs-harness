- id: sf.features.account.account-shell.AccountShell
  type: implement
  kind: function
  target: apps/storefront/src/features/account/account-shell.tsx::AccountShell
  signature: |-
    export function AccountShell({
      title,
      lead,
      actions,
      wide = false,
      children,
    }: {
      title: string;
      lead?: ReactNode;
      actions?: ReactNode;
      wide?: boolean;
      children: ReactNode;
    })
  uses:
  - sf.components.amazon.amazon-header.AmazonHeader
  - sf.components.amazon.amazon-footer.AmazonFooter
  imports:
  - import 'server-only';
  - import Link from 'next/link';
  - import { redirect } from 'next/navigation';
  - import { ReactNode } from 'react';
  - import { SessionResponse } from '@amazon-mvp/api-contract';
  - import { AmazonFooter } from '@/components/amazon/amazon-footer';
  - import { AmazonHeader } from '@/components/amazon/amazon-header';
  - import { getServerSession } from '@/features/auth/server-session';
  - import './account.css';
  description: |-
    Amazon account-page frame: header, "Sua conta › title" breadcrumb, title row with optional actions, optional lead, children, footer.
    Markup, in order:
    - `<div className="amazon-account-page az-acct">`, starting with `<AmazonHeader />`.
    - `<main className="az-acct-main">`. When `wide` is true, the class is `az-acct-main az-acct-main--wide`.
      Inside it:
      - `<nav className="az-acct-crumbs" aria-label="Trilha de navegação">`. It holds an `<ol>` with two items:
        `<li><Link href="/account">Sua conta</Link></li>` and `<li aria-current="page">{title}</li>`.
      - `<div className="az-acct-top">` holding `<h1 className="az-acct-title">{title}</h1>` followed by `{actions}`.
      - Only when `lead` is truthy: `<p className="az-acct-lead">{lead}</p>`.
      - `{children}`.
    - After `</main>`: `<AmazonFooter />`.
    It is a server component with no state.
  max_output_tokens: 512
