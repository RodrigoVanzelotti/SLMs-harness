- id: sf.features.account.account-shell.requireAccountSession
  type: implement
  kind: function
  target: apps/storefront/src/features/account/account-shell.tsx::requireAccountSession
  signature: 'export async function requireAccountSession(path: string): Promise<SessionResponse>'
  uses:
  - contract.SessionResponse
  - sf.features.auth.server-session.getServerSession
  - contract.UserProfile
  imports:
  - import 'server-only';
  - import Link from 'next/link';
  - import { redirect } from 'next/navigation';
  - import { ReactNode } from 'react';
  - import { SessionResponse } from '@amazon-mvp/api-contract';
  - import { AmazonFooter } from '@/components/amazon/amazon-footer';
  - import { AmazonHeader } from '@/components/amazon/amazon-header';
  - import { getServerSession } from '@/features/auth/server-session';
  - import './account.css';
  - import type { UserProfile } from '@amazon-mvp/api-contract';
  description: |-
    Returns the current session for an account page, or redirects guests to login with `next` set to that page.
    `const session = await getServerSession()`. If it is `null`, call
    `redirect(`/login?next=${encodeURIComponent(path)}`)` (from `next/navigation`; it throws). Otherwise return the session.
    For example, a guest on `/gift-cards` is redirected to `/login?next=%2Fgift-cards`.
