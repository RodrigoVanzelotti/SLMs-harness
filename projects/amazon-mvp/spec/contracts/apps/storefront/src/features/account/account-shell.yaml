- id: sf.features.account.account-shell.EmptyPanel
  type: implement
  kind: function
  target: apps/storefront/src/features/account/account-shell.tsx::EmptyPanel
  signature: |-
    export function EmptyPanel({
      heading,
      message,
      children,
    }: {
      heading: string;
      message: string;
      children?: ReactNode;
    })
  imports:
  - import 'server-only';
  - import Link from 'next/link';
  - import { redirect } from 'next/navigation';
  - import { ReactNode } from 'react';
  - import { SessionResponse } from '@amazon-mvp/api-contract';
  - import { AmazonFooter } from '@/components/amazon/amazon-footer';
  - import { AmazonHeader } from '@/components/amazon/amazon-header';
  - import { getServerSession } from '@/features/auth/server-session';
  - import './account.css';
  description: |-
    A titled box on an account page whose data area is honestly empty: heading, the empty message, and optional extra children.
    Compute `id = `panel-${heading.toLowerCase().replace(/[^a-z0-9]+/g, '-')}``. For example, `Saldo do vale-presente`
    gives `panel-saldo-do-vale-presente`, and `Histórico` gives `panel-hist-rico`.
    Render `<section className="az-acct-box" aria-labelledby={id}>`. Inside it:
    - `<h2 id={id} className="az-acct-box__heading">{heading}</h2>`.
    - `<div className="az-acct-box__body">` holding `<p className="az-acct-empty">{message}</p>` followed by `{children}`.
