  description: |-
    Product-page "Adicionar à lista" split button: the main part saves to the default list, the arrow opens a menu of lists.
    Guests get a login link.
    Hooks: `useRouter()`; state `lists: ListSummary[] | null` (null = not loaded), `open`, `busy`, `added: { id, name } | null`,
    `error` (string); refs for the root `<div>` and the toggle button. Call every hook before the guest return.

    Guest (`!signedIn`): render only `<div className="az-add-to-list"><Link className="az-add-to-list__main" href={loginHref}>Adicionar à lista</Link></div>`.
    Make no API call.

    Helpers:
    - `load()`: resolve the cached `lists` if any, else `await accountClient.lists()`. Store the result in `lists` and return it.
    - `add(pick?)`, in order:
      1. Set `busy`, clear `error` and `added`, and close the menu.
      2. The target is `pick`, or else the entry of `await load()` with `isDefault`. If there is none,
         throw `new Error('Não foi possível encontrar sua lista.')`.
      3. `await accountClient.addToList(target.id, productId)`. Then set `added = { id: target.id, name: target.name }`
         and reset `lists` to `null` (the counts changed).
      - On error: an `AccountRequestError` with status 401 calls `router.push(loginHref)` and stops. Any other error sets
        `error` to its message (non-Error: `Não foi possível adicionar à lista.`).
      - Always clear `busy` at the end.
    - `openMenu()`: if the menu is open, close it. Otherwise clear `error`, `await load()`, then open it. On failure set
      `error` to the message (non-Error: `Não foi possível carregar suas listas.`).
    - While the menu is open (an effect on `open`), listen on `document`:
      - `keydown` Escape closes the menu and focuses the toggle.
      - `mousedown` outside the root closes it.
      Remove both listeners in the cleanup.

    Signed-in markup, in order:
    - `<div className="az-add-to-list" ref={root}>` holding `<div className="az-add-to-list__group">`, which contains two buttons:
      - The main `<button type="button" className="az-add-to-list__main" disabled={busy}>`. Its text is `Adicionando…` while
        busy, else `Adicionar à lista`. Clicking calls `add()`.
      - The toggle `<button type="button" className="az-add-to-list__toggle" aria-label="Escolher uma lista" aria-haspopup="true"
        aria-expanded={open} aria-controls="add-to-list-menu" disabled={busy}>`. Clicking calls `openMenu()`. It holds a chevron
        `<svg viewBox="0 0 12 8" width="12" height="8" aria-hidden="true">` with
        `<path d="m1 1 5 5 5-5" fill="none" stroke="currentColor" strokeWidth="1.6" />`.
    - When `open && lists`: `<ul id="add-to-list-menu" className="az-add-to-list__menu" aria-label="Suas listas">`.
      - One `<li>` per list, each with a `<button type="button">`. The first one gets `autoFocus`. The button text is the list
        name, followed by ` (padrão)` when `isDefault`. Clicking calls `add(list)`.
      - A last `<li><p><Link href="/lists">Gerenciar suas listas</Link></p></li>`.
    - Always `<p className="az-add-to-list__feedback" role="status">`. When `added` is set, it contains:
      `Adicionado a <strong>{name}</strong>.`, a space, then `<Link href={listHref(added.id)}>Ver sua lista</Link>`.
    - When `error` is set: `<p className="az-add-to-list__feedback az-add-to-list__error" role="alert">{error}</p>`.
