  description: |-
    "Seus endereços" manager: an add tile plus one card per saved address, with edit, delete (confirmed), set-default and delivery instructions.
    Hooks: `useRouter()`. State:
    - `addresses` (from `initial`).
    - `editor: Editor`, starting `{ mode: 'new' }` if `startAdding`, else `null`.
    - `confirming` (address id or null), `instructing: { id, text } | null`, `busy` (address id or null).
    - `error` and `status` strings.
    Refs: the editor `<h2>` and the add tile. When `editor` becomes non-null, an effect focuses the editor heading.

    Helpers:
    - `fail(reason)`: an `AccountRequestError` with status 401 calls `router.push('/login?next=%2Faddresses')`. Anything else
      sets `error` to its message (non-Error: `Não foi possível concluir a solicitação.`).
    - `run(id, work, done)`: set `busy = id`, clear `error` and `status`, then `setAddresses(await work())`, set
      `status = done`, call `router.refresh()` once (the header's "Enviar para" is server-rendered) and return true.
      On error call `fail` and return false. Always clear `busy` and `confirming` at the end.
    - Save instructions: `run(address.id, ...)`, where the work calls `accountClient.updateAddress(address.id, { ...input,
      deliveryInstructions: text.trim() })`, `input` is the address minus `id` and `isDefault` (PUT replaces the whole address),
      and the work replaces the matching item by the returned address. `done` is `Instruções de entrega salvas.`.
      Only on success: clear `instructing` and, in `requestAnimationFrame`, focus the element with id `address-{id}`.
      On failure the draft stays open with its text, and there is no refresh.
    - `onSave` of the form (`saved(address)`), in order:
      1. Remember whether the mode was `'new'`. Clear `editor` and `error`.
      2. Reload with `setAddresses(await accountClient.addresses())`, set `status` to `Endereço adicionado.` (new) or
         `Endereço atualizado.`, and call `router.refresh()`. On error call `fail`.
      3. Then, in `requestAnimationFrame`, focus `address-{saved id}`.

    Markup, in order:
    1. Always `<div className="az-acct-status" role="status" aria-live="polite">`, containing
       `<p className="az-acct-success">{status}</p>` when `status` is set.
    2. When `error` is set: `<p className="az-acct-error" role="alert">{error}</p>`.
    3. When `editor` is set: `<section className="az-acct-editor" aria-labelledby="address-editor-title">` with
       `<h2 id="address-editor-title" tabIndex={-1}>`. Its text is `Adicionar um novo endereço` (new) or
       `Editar seu endereço`. Below it, `<AddressForm key={edit ? address.id : 'new'} initial={edit ? address : undefined}
       name={name} onSave={saved} onCancel>`. `onCancel` clears `editor` and focuses the add tile in `requestAnimationFrame`.
    4. `<ul className="az-acct-addresses" aria-label="Endereços salvos">`. Its first `<li>` holds the add tile
       `<button type="button" className="az-acct-address-add" disabled={Boolean(editor)}>`, containing
       `<svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true"><path d="M24 6v36M6 24h36" stroke="currentColor" strokeWidth="5" /></svg>`
       and the text `Adicionar endereço`. Clicking clears `status` and opens `{ mode: 'new' }`.
       Then one card per address: `<li id="address-{id}" tabIndex={-1}>`.
       - Class `az-acct-address`, plus ` az-acct-address--default` for the default address.
       - `aria-label` is `Endereço padrão: ` or `Endereço: `, followed by `{recipient}, {street}, {number}`.
       Inside the card, in order:
       - Default only: `<p className="az-acct-address__badge">Endereço padrão:<AmazonLogo className="az-acct-address__logo" /></p>`.
       - `<div className="az-acct-address__body">` holding an `<address>` with these lines, separated by `<br />`:
         - `<strong>{recipient}</strong>` followed by `{street} {number}`.
         - `[complement, neighborhood].filter(Boolean).join(' ')`.
         - `{city}, {state} {postalCode}`.
         - `Brasil`.
         - Only when `phone` is set: `Telefone: +55{phone}`.
       - Still inside the body, when `instructing?.id` is this address, a
         `<form className="az-acct-address__instructions-form" aria-label="Instruções de entrega para {recipient}, {street}">`.
         Its submit calls `preventDefault` and saves. It contains:
         - `<label htmlFor="instructions-{id}">Instruções de entrega</label>`.
         - `<textarea id="instructions-{id}" value maxLength={INSTRUCTIONS_MAX} rows={3} autoFocus disabled={busy===id}
           placeholder="Ex.: deixar com o porteiro, tocar o interfone 710">`. `onChange` updates the text.
         - `<div className="az-acct-form__actions">` with a submit button `az-acct-button az-acct-button--primary` (text
           `Salvando…` while busy, else `Salvar`) and a `button` `az-acct-button` `Cancelar` that clears `instructing`.
           Both are disabled while busy.
       - Otherwise:
         - When the address has `deliveryInstructions`:
           `<p className="az-acct-address__instructions"><strong>Instruções de entrega:</strong> {text}</p>`.
         - A `<button type="button" className="az-acct-linkbutton">`, disabled when any `busy` or `instructing` is set.
           Its `aria-label` is `{Editar|Adicionar} instruções de entrega para {recipient}, {street}` and its text is
           `{Editar|Adicionar} instruções de entrega`. Clicking clears `status` and opens
           `{ id, text: deliveryInstructions ?? '' }`.
       - When `confirming` is this address:
         `<div className="az-acct-address__confirm" role="group" aria-label="Confirmar exclusão">`, containing
         `<p>Excluir este endereço?</p>` and an `az-acct-form__actions` div.
         - First the primary button, with `autoFocus`. Its text is `Excluindo…` while busy, else `Sim, excluir`. It runs
           `accountClient.deleteAddress(id)` with done `Endereço excluído.`; the server's list replaces the state.
         - Then `Cancelar`, which clears `confirming`.
       - Otherwise `<div className="az-acct-address__actions">` with `az-acct-linkbutton` buttons, all disabled while any
         `busy` is set:
         - `Alterar` (aria-label `Alterar endereço de {recipient}, {street}`). It clears `status` and opens
           `{ mode: 'edit', address }`.
         - `Excluir` (aria-label `Excluir endereço de {recipient}, {street}`). It sets `confirming`.
         - Non-default only: aria-label `Definir como padrão o endereço de {recipient}, {street}`, text `Salvando…` while
           busy, else `Definir como padrão`. It runs `accountClient.setDefaultAddress(id)` with done `Endereço padrão atualizado.`.
    5. When `addresses` is empty, after the list: `<p className="az-acct-muted az-acct-note">Você ainda não tem endereços salvos. Os endereços adicionados aqui aparecem no checkout.</p>`.
