  description: |-
    "Suas listas" view: list navigation on the left; on the right the selected list, with create/rename/delete and per-item cart and remove actions.
    Hooks: `useRouter()` and `cart = useCart()`. From the cart this uses:
    - `status` (`'ready'` when usable) and `pending`.
    - `add(productId, quantity)`, which resolves true on success.
    - `error` (string or null).
    State:
    - `list` (from `initial`) and `mode: 'create' | 'rename' | 'delete' | null`.
    - `busy`, `error`, `status`.
    - `itemBusy` (product id or null) and `cartAdded` (boolean).

    Helpers:
    - `go(href)`: `router.push(href)`, then `router.refresh()`.
    - `act(work)`: set `busy`, clear `error`, `cartAdded` and `status`, then `await work()`.
      - An `AccountRequestError` with status 401 calls `go(`/login?next=${encodeURIComponent(listHref(list.id))}`)`.
      - Other errors set `error` to the message (non-Error: `Não foi possível concluir.`).
      - Always clear `busy` at the end.
    - The form name: `preventDefault`, then `new FormData(form).get('name')` trimmed.
    - `summaries`: `lists`, where the entry with `list.id` takes the current `list.name` and `list.itemCount`.

    Markup:
    - `<div className="az-acct-lists">`.
    - `<nav className="az-acct-lists__nav" aria-label="Suas listas"><ul>`, with one `<li>` per summary holding
      `<Link href={listHref(id)} aria-current={selected ? 'page' : undefined}>`. The link contains `<strong>{name}</strong>` and
      `<span>`. The span text is `Padrão · ` (default list only), then `{n} item` or `{n} itens` (singular when n is 1),
      then ` · Privada`.
    - `<section aria-labelledby="list-title">` containing, in order:
      1. Always `<div className="az-acct-status" role="status" aria-live="polite">`. When `status` is set it holds
         `<p className="az-acct-success">{status}</p>`; when `cartAdded` is also set, the `<p>` continues with a space and
         `<Link href="/cart">Ver carrinho</Link>`.
      2. When `error` is set: `<p className="az-acct-error" role="alert">`.
      3. `<div className="az-acct-list-head">`, holding `<h2 id="list-title">{list.name}</h2>` and
         `<div className="az-acct-list-head__actions">`. Each of its buttons toggles its own `mode` and has
         `aria-expanded={mode === thatMode}`:
         - `<button className="az-acct-button">Criar uma lista</button>`, disabled when busy or
           `lists.length >= MAX_LISTS_PER_USER`.
         - `az-acct-linkbutton` `Renomear lista`.
         - Non-default lists only: `az-acct-linkbutton` `Excluir lista`.
         The last two are disabled when busy.
      4. Mode panels:
         - `create`: `<form className="az-acct-inline-form" aria-label="Criar uma lista">`.
           - `<label>Nome da lista<input name="name" required maxLength={LIST_NAME_MAX_LENGTH} autoFocus disabled={busy} /></label>`.
           - A submit button `az-acct-button az-acct-button--primary` `Criar lista`.
           - An `az-acct-button` `Cancelar` that sets `mode` to null.
           Submit runs `act`: `createList(name)`, then `go(listHref(created.id))`.
         - `rename`: the same form with `aria-label="Renomear lista"`, label `Novo nome`, `defaultValue={list.name}` and submit
           `Salvar`. Submit runs `act`: `renameList(list.id, name)`, then `setList({ ...list, name: renamed.name })`, close the
           mode, set status `Lista renomeada.` and call `router.refresh()`.
         - `delete`: `<div className="az-acct-inline-form" role="group" aria-label="Confirmar exclusão da lista">`.
           - `<p className="az-acct-muted">Excluir a lista “{name}” e todos os seus itens? Esta ação não pode ser desfeita.</p>`.
           - A primary `autoFocus` button, with text `Excluindo…` while busy, else `Sim, excluir`. It runs `act`:
             `deleteList(list.id)`, then `go('/lists')`.
           - `Cancelar`.
         All panel controls are disabled while busy.
      5. Items. When there are none:
         `<div className="az-acct-list-empty"><p className="az-acct-empty">Não há itens nesta lista.</p><p className="az-acct-muted">Use o botão “Adicionar à lista” na página de um produto para salvá-lo aqui.</p></div>`.
         Otherwise `<ul className="az-acct-items" aria-label="Itens de {list.name}">`, with one `<li className="az-acct-item">` per
         item (key `productId`), where `href = /products/{encodeURIComponent(slug)}` and `p = productPresentation(product)`.
         Each item, in order:
         - `<Link href className="az-acct-item__image" tabIndex={-1} aria-hidden="true"><ProductImage image={p.images[0]} glyph={p.glyph} /></Link>`.
         - A `<div>` holding:
           - `<h3><Link href>{name}</Link></h3>`.
           - `<p className="az-acct-item__price">{formatCartMoney(priceMinor, currency)}</p>`.
           - `<p className="az-acct-item__stock az-acct-item__stock--{tone}">{text}</p>`, from `stockLabel(product)`.
           - `<p className="az-acct-muted">Item adicionado em {addedOn.format(new Date(addedAt))}</p>`.
         - `<div className="az-acct-item__actions">` with two buttons:
           - Cart: `az-acct-button az-acct-button--primary`, `aria-label="Adicionar ao carrinho: {name}"`. It is enabled only
             when `inStock`, the cart status is `'ready'`, `!cart.pending` and `itemBusy` is null. Its text is `Adicionando…`
             while `itemBusy` is this item and `cart.pending`, else `Adicionar ao carrinho`. Clicking: set `itemBusy`, clear
             `status` and `error`, `ok = await cart.add(productId, 1)`, clear `itemBusy`, set `cartAdded = ok`. If ok, set
             status `“{name}” foi adicionado ao carrinho.`.
           - Remove: `az-acct-button`, text `Excluir`, `aria-label="Excluir da lista: {name}"`, disabled when `itemBusy` is set
             or busy. Clicking sets `itemBusy`, then runs `act`: `setList(await removeFromList(list.id, productId))` and status
             `“{name}” foi excluído da lista.`. Clear `itemBusy` once `act` settles.
      6. When `cart.error` is set: `<p className="az-acct-error" role="alert">{cart.error}</p>`.
  notes: The quotes in the item and delete texts are the typographic “ and ”.
