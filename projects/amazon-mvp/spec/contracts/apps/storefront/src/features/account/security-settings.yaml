  description: |-
    "Acesso e segurança": rows for name, e-mail and password, each with "Editar" opening an inline form that saves through `accountClient`.
    Hooks: `useRouter()`. State: `profile` (from `user`), `editing: Field | null`, `status`. A ref keeps the Editar button of
    each field.
    `close(field, message = '')`: clear `editing`, set `status = message`, and focus that field's Editar button in
    `requestAnimationFrame`.

    Markup:
    - `<div className="az-acct-status" role="status" aria-live="polite">`, containing `<p className="az-acct-success">{status}</p>`
      when `status` is set.
    - `<ul className="az-acct-rows">` with three rows, in order: name, email, password. Each row is
      `<li className="az-acct-row">`:
      - `<div className="az-acct-row__summary">`, holding a `<div>` with `<h2 className="az-acct-row__label" id="security-{field}">{label}</h2>`
        and `<p className="az-acct-row__value">{value}</p>`.
      - While the row is not open, the summary also holds `<button type="button" className="az-acct-button"
        aria-describedby="security-{field}" disabled={editing !== null}>Editar</button>` (no aria-label). Clicking clears
        `status` and sets `editing`.
      - When open: the row's form below the summary.
    - Row `name`: label `Nome`, value `profile.displayName`. The form saves with
      `updateName(displayName.trim())`, then `setProfile(updated)`, `close('name', 'Seu nome foi atualizado.')` and
      `router.refresh()`.
    - Row `email`: label `E-mail`, value `profile.email`. The form saves with `changeEmail(email.trim(), currentPassword)`, then
      `setProfile` and `close('email', 'Seu e-mail foi atualizado. Use-o no próximo login.')`.
    - Row `password`: label `Senha`, value `<span aria-label="Senha oculta">********</span>`. The form saves with
      `changePassword(currentPassword, newPassword)`, then closes with a message that depends on `n = revokedSessions`:
      - n = 0: `Sua senha foi alterada.`
      - n = 1: `Sua senha foi alterada. 1 outra sessão foi encerrada.`
      - n > 1: `Sua senha foi alterada. {n} outras sessões foram encerradas.`
    For every form, Cancelar calls `close(field)`, and a 401 calls `router.push('/login?next=%2Fsecurity')`.

    Form (private `EditForm` component). It has its own `saving` and `error` state, and on mount focuses its first input.
    - Renders `<form className="az-acct-form" aria-label={label}>`, containing:
      - `<p className="az-acct-error" role="alert">` when there is an error.
      - `<p className="az-acct-form__hint">` when there is a hint.
      - One `<label>{field.label}<input name type autoComplete defaultValue minLength maxLength required disabled={saving} /></label>`
        per field.
      - `<div className="az-acct-form__actions">` with a submit button `az-acct-button az-acct-button--primary` (text
        `Salvando…` while saving, else `Salvar alterações`) and an `az-acct-button` `Cancelar`. Both are disabled while saving.
    - On submit, in order:
      1. `preventDefault`. Read every field from `FormData` as a string.
      2. Run the optional validate; set `error` to its result and stop if it is non-empty.
      3. Set `saving` and await the row's save.
      - An `AccountRequestError` with status 401 calls the unauthorized handler. Any other error, including a 403 for a
        wrong current password, shows its `message` (non-Error: `Não foi possível salvar.`).
      - Always clear `saving` at the end.

    The three forms:
    - `Alterar seu nome`: field `displayName`, label `Novo nome`, type text, autoComplete `name`,
      `defaultValue={profile.displayName}`, min/max `DISPLAY_NAME_MIN_LENGTH`/`DISPLAY_NAME_MAX_LENGTH`.
    - `Alterar seu e-mail`, with hint `Por segurança, confirme sua senha atual. As outras sessões conectadas à sua conta serão encerradas; esta continua ativa.`
      Fields:
      - `email`: `Novo e-mail`, type email, autoComplete `email`, maxLength 254.
      - `currentPassword`: `Senha atual`, type password, autoComplete `current-password`, maxLength `PASSWORD_MAX_LENGTH`.
    - `Alterar sua senha`, with hint `A nova senha deve ter pelo menos {PASSWORD_MIN_LENGTH} caracteres. As outras sessões conectadas à sua conta serão encerradas; esta continua ativa.`
      Fields:
      - `currentPassword` (`Senha atual`, as above).
      - `newPassword`: `Nova senha`, type password, autoComplete `new-password`.
      - `confirmPassword`: `Digite a nova senha novamente`, type password, autoComplete `new-password`.
      Both new-password fields use min `PASSWORD_MIN_LENGTH` and max `PASSWORD_MAX_LENGTH`.
      Validation: when the new and confirm values differ, `As novas senhas não coincidem.`; when the new password equals the
      current one, `A nova senha deve ser diferente da senha atual.`; otherwise no error. No request is made when validation fails.
