  type: implement
  kind: function
  target: apps/storefront/src/features/auth/login-identifier-form.tsx::LoginIdentifierForm
  signature: export function LoginIdentifierForm()
  uses:
  - sf.features.auth.login-identifier-form.Step
  - sf.features.auth.login-identifier-form.EMAIL_PATTERN
  - sf.features.auth.auth-client.authClient
