  - contract.UserProfile
  imports:
  - '''use client'';'
  - import { useState, useRef, useEffect, FormEvent } from 'react';
  - import Link from 'next/link';
  - import { useRouter, useSearchParams } from 'next/navigation';
  - import { authClient, AuthRequestError } from './auth-client';
  - import type { IdentifyRequest } from '@amazon-mvp/api-contract';
  - import type { IdentifyResponse } from '@amazon-mvp/api-contract';
  - import type { RegisterRequest } from '@amazon-mvp/api-contract';
  - import type { SessionResponse } from '@amazon-mvp/api-contract';
  - import type { LoginRequest } from '@amazon-mvp/api-contract';
  - import type { UserProfile } from '@amazon-mvp/api-contract';
  description: |-
    Amazon-style /login flow in one component: an identifier step, then a password step for known e-mails or a "new to Amazon" step.
    Hooks: `useRouter()`, `useSearchParams()`. State:
    - `step: Step` (`'identifier'`) and `email` (initially `searchParams.get('email') ?? ''`).
    - `identifierError` and `checkingEmail`.
    - `password`, `passwordError`, `authError`, `pending`.
    A ref holds the password input. An effect focuses it whenever `step` becomes `'password'`.

    Identifier submit, in order:
    1. `preventDefault`. Trim the e-mail. If it is empty or fails `EMAIL_PATTERN`, set `identifierError` to
       `Insira um número de celular ou endereço de e-mail válido.` and stop.
    2. Store the trimmed e-mail, clear the error and set `checkingEmail`.
    3. `const { exists } = await authClient.identify({ email: trimmed })`. Go to step `'password'` if it exists, else `'new-user'`.
    - On any error: `Não foi possível continuar agora. Tente novamente.`.
    - Always clear `checkingEmail` at the end.
    Going back (`back(clearEmail)`): set step `'identifier'`, clear the e-mail only if asked, clear `password`,
    `passwordError` and `authError`.

    Password submit, in order:
    1. `preventDefault`. If the password is empty, set `passwordError` to `Insira sua senha.` and stop.
    2. Clear both errors and set `pending`.
    3. `await authClient.login({ email, password })`, then `router.push(afterLogin(searchParams.get('next')))` and
       `router.refresh()`.
    - On error, set `authError` to:
      - `Sua senha está incorreta.` for an `AuthRequestError` with code `AUTH_INVALID_CREDENTIALS`;
      - the message of any other `AuthRequestError`;
      - `Algo deu errado. Tente novamente.` for anything else.
      Then clear the password and focus the input.
    - Always clear `pending` at the end.

    Markup is a fragment:
    - When `authError` is set: `<div className="amazon-alert" role="alert">`, holding
      `<svg className="amazon-alert__icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">` (a circled "!" path)
      and `<div><p className="amazon-alert__title">Houve um problema</p><p className="amazon-alert__body">{authError}</p></div>`.
    - `<div className="amazon-card">` with the current step.
    - Step `identifier`:
      - `<h1 className="amazon-card__title">Faça login ou crie uma conta</h1>`.
      - `<form className="amazon-field" noValidate>`, containing:
        - `<label className="amazon-field__label" htmlFor="login-identifier">Insira um número de celular ou um endereço de e-mail</label>`.
        - `<input id="login-identifier" className="amazon-field__input" name="identifier" type="text" autoComplete="username">`.
          With an error, it gets `aria-invalid="true"` and `aria-describedby="login-identifier-error"`. Typing updates
          `email` and clears the error.
        - The error `<p className="amazon-field__error" id="login-identifier-error" role="alert">`.
        - `<button type="submit" className="amazon-button" disabled={checkingEmail}>`, with text `Verificando…` while
          checking, else `Continuar`.
      - `<p className="amazon-card__legal">Ao continuar, você concorda com as <Link href="/conditions-of-use">Condições de Uso</Link> e a <Link href="/privacy">Notificação de privacidade da Amazon</Link>.</p>`.
      - `<Link className="amazon-card__help" href="/account-issues">Precisa de ajuda?</Link>`.
    - Step `password`: `<h1 className="amazon-card__title">Fazer login</h1>`, then `<form noValidate>` containing:
      - `<div className="amazon-identity"><span>{email}</span><button type="button" className="amazon-identity__change">Alterar</button></div>`.
        The button calls `back(false)`.
      - `<div className="amazon-field">`, holding `<div className="amazon-field__row">` with
        `<label className="amazon-field__label" htmlFor="login-password">Senha</label>` and `<a href="#">Esqueci a senha</a>`.
        Then `<input id="login-password" className="amazon-field__input" name="password" type="password" autoComplete="current-password">`,
        with `aria-invalid="true"` and `aria-describedby="login-password-error"` when there is an error. Typing clears the error.
        Then the error `<p className="amazon-field__error" id="login-password-error" role="alert">`.
      - `<button type="submit" className="amazon-button" disabled={pending}>`, with text `Entrando…` while pending, else
        `Fazer login`.
      - `<div className="amazon-divider">Ou</div>`.
      - `<button type="button" className="amazon-button amazon-button--secondary">Fazer login com uma chave de acesso</button>`,
        which does nothing.
    - Step `new-user`:
      - `<h1 className="amazon-card__title">Parece que você é novo na Amazon</h1>`.
      - The same identity row; its `Alterar` calls `back(false)`.
      - `<p className="amazon-card__prose">Vamos criar uma conta usando seu e-mail</p>`.
      - `<Link href={`/register?email=${encodeURIComponent(email)}`} className="amazon-button">Prossiga com a criação de uma conta</Link>`.
      - `<hr className="amazon-hr" />`.
      - `<div className="amazon-note"><p className="amazon-note__title">Já é cliente?</p><button type="button" className="amazon-identity__change">Faça login com outro e-mail ou celular</button></div>`.
        The button calls `back(true)`.
    Tests read this file's source text, so write these three links exactly as above:
    - `<Link href="/conditions-of-use">Condições de Uso</Link>` and `<Link href="/privacy">Notificação de privacidade da Amazon</Link>`,
      with `href` as the only attribute and the text right after `>`.
    - The help link with `href="/account-issues"` as its last attribute, so that `href="/account-issues">` is followed by
      `Precisa de ajuda?`.
