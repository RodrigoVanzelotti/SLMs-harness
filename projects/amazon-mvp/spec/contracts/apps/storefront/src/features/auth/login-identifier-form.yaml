- id: sf.features.auth.login-identifier-form.SAME_SITE_PATH
  type: provided
  kind: declaration
  target: apps/storefront/src/features/auth/login-identifier-form.tsx::SAME_SITE_PATH
  signature: const SAME_SITE_PATH = /^\/(?!\/)[^\s\\\u0000-\u001f\u007f]*$/;
  imports:
  - '''use client'';'
  - import { useState, useRef, useEffect, FormEvent } from 'react';
  - import Link from 'next/link';
  - import { useRouter, useSearchParams } from 'next/navigation';
  - import { authClient, AuthRequestError } from './auth-client';
  description: |-
    Where to go after signing in. "checkout" is the legacy value; otherwise only
    same-site absolute paths are honoured. Whitespace/control characters are refused too:
    browsers strip tabs and newlines, so "/\t/evil.example" would become "//evil.example".
  code: const SAME_SITE_PATH = /^\/(?!\/)[^\s\\\u0000-\u001f\u007f]*$/;
- id: sf.features.auth.login-identifier-form.afterLogin
  type: implement
  kind: function
  target: apps/storefront/src/features/auth/login-identifier-form.tsx::afterLogin
  signature: 'export function afterLogin(next: string | null): string'
  uses:
  - sf.features.auth.login-identifier-form.SAME_SITE_PATH
  imports:
  - '''use client'';'
  - import { useState, useRef, useEffect, FormEvent } from 'react';
  - import Link from 'next/link';
  - import { useRouter, useSearchParams } from 'next/navigation';
  - import { authClient, AuthRequestError } from './auth-client';
  description: |-
    Where to send the user after signing in: `/checkout` for the legacy `checkout` value, a same-site path, or `/account`.
    - `next === 'checkout'`: return `/checkout`.
    - `next` is non-empty and matches `SAME_SITE_PATH`: return `next` unchanged. `SAME_SITE_PATH` accepts only a single
      leading `/`, and rejects whitespace, backslashes and control characters.
    - Anything else, including `null`: return `/account`.
  examples:
  - afterLogin("/products/p6") == "/products/p6"
  - afterLogin("checkout") == "/checkout"
  - afterLogin("//evil.example") == "/account" && afterLogin("/\t/evil.example") == "/account" && afterLogin(null)
    == "/account"
  tests:
  - tests/apps/storefront/test/login-redirect.afterLogin.unit.spec.ts
  max_output_tokens: 512
