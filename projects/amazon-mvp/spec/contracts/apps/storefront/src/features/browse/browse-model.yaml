- id: sf.features.browse.browse-model.listingTitle
  type: implement
  kind: function
  target: apps/storefront/src/features/browse/browse-model.ts::listingTitle
  signature: |-
    export function listingTitle({
      q,
      categoryName,
      brandName,
    }: {
      q: string;
      categoryName?: string;
      brandName?: string;
    }): string
  imports:
  - import type { CatalogCategoryNode, CatalogFacets } from '@amazon-mvp/api-contract';
  - import { brandKey } from './browse-params';
  description: |-
    Heading of the product listing: the search, else the brand, else the category, else `Todos os produtos`.
    - `q` set: `Resultados para “{q}”` (curly quotes U+201C and U+201D), plus ` em {categoryName}`
      when there is a category. The brand is ignored.
    - Else `brandName` set: `{brandName} em {categoryName}`, or `{brandName}` without a category.
    - Else `categoryName` when given, else `Todos os produtos`.
  examples:
  - 'listingTitle({ q: "fone", categoryName: "Áudio" }) == "Resultados para “fone” em Áudio"'
  - 'listingTitle({ q: "", brandName: "Vortex", categoryName: "Áudio" }) == "Vortex em Áudio"'
  - 'listingTitle({ q: "" }) == "Todos os produtos"'
  tests:
  - tests/apps/storefront/test/browse-model.listingTitle.new.spec.ts
  max_output_tokens: 512
- id: sf.features.browse.browse-model.resultsSummary
  type: implement
  kind: function
  target: apps/storefront/src/features/browse/browse-model.ts::resultsSummary
  signature: 'export function resultsSummary(page: number, pageSize: number, total: number): string'
  imports:
  - import type { CatalogCategoryNode, CatalogFacets } from '@amazon-mvp/api-contract';
  - import { brandKey } from './browse-params';
  description: |-
    Amazon-style result count of a listing page, such as `1-48 de 150 resultados`.
    Numbers are written with `toLocaleString('pt-BR')` (`1.500`).
    - `total === 1`: `1 resultado`.
    - `total <= pageSize` and `page === 1`: `{total} resultados` (also `0 resultados`).
    - Otherwise `{first}-{last} de {total} resultados`, with first = (page - 1) * pageSize + 1 and
      last = min(total, page * pageSize).
  examples:
  - resultsSummary(4, 48, 150) == "145-150 de 150 resultados"
  - resultsSummary(21, 48, 1500) == "961-1.008 de 1.500 resultados"
  - resultsSummary(1, 48, 12) == "12 resultados"
  tests:
  - tests/apps/storefront/test/browse-model.resultsSummary.new.spec.ts
  max_output_tokens: 512
