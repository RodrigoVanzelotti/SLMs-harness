- id: sf.features.browse.browse-model.buildCategoryTree
  type: implement
  kind: function
  target: apps/storefront/src/features/browse/browse-model.ts::buildCategoryTree
  signature: 'export function buildCategoryTree(nodes: CatalogCategoryNode[]): CategoryTree'
  uses:
  - contract.CatalogCategoryNode
  - sf.features.browse.browse-model.CategoryTree
  after:
  - sf.features.browse.browse-model.resultsSummary
  - sf.features.browse.browse-model.listingTitle
  - sf.features.browse.browse-model.pageWindow
  imports:
  - import type { CatalogCategoryNode, CatalogFacets } from '@amazon-mvp/api-contract';
  - import { brandKey } from './browse-params';
  description: |-
    Index a flat category list by slug and by parent slug, with every sibling list sorted by name.
    `bySlug` maps each slug to its node. `children` maps a parent slug to its child nodes, with the
    key `null` for the roots. A node is a root when its `parentSlug` is null, empty, or not a slug of
    the list (an orphan is shown at the top level instead of being hidden). A parent with no children
    has no `children` entry. Sort each list with `a.name.localeCompare(b.name, 'pt-BR')`. Do not
    mutate the input.
  examples:
  - 'buildCategoryTree([{ slug: "b", name: "Beta", parentSlug: null }, { slug: "a", name: "Alfa", parentSlug: "x"
    }]).children.get(null).map((n) => n.slug) == ["a", "b"]'
  tests:
  - tests/apps/storefront/test/browse.buildCategoryTree.unit.spec.ts
  max_output_tokens: 512
- id: sf.features.browse.browse-model.categoryTrail
  type: implement
  kind: function
  target: apps/storefront/src/features/browse/browse-model.ts::categoryTrail
  signature: 'export function categoryTrail(tree: CategoryTree, slug: string): CatalogCategoryNode[]'
  uses:
  - sf.features.browse.browse-model.CategoryTree
  - contract.CatalogCategoryNode
  after:
  - sf.features.browse.browse-model.buildCategoryTree
  imports:
  - import type { CatalogCategoryNode, CatalogFacets } from '@amazon-mvp/api-contract';
  - import { brandKey } from './browse-params';
  description: |-
    Return the chain of categories from the root down to `slug` (inclusive), or `[]` when the slug is unknown.
    Start at `tree.bySlug.get(slug)` and walk up through `parentSlug`, putting each node in front of
    the list. Stop when the parent is missing, when a node is already in the list (a corrupted cycle),
    or once the list has 20 nodes.
  examples:
  - 'categoryTrail(buildCategoryTree([{ slug: "eletronicos", name: "Eletrônicos", parentSlug: null }, { slug: "audio",
    name: "Áudio", parentSlug: "eletronicos" }, { slug: "fones", name: "Fones de Ouvido", parentSlug: "audio" }]),
    "fones").map((n) => n.slug) == ["eletronicos", "audio", "fones"]'
  - 'categoryTrail(buildCategoryTree([{ slug: "a", name: "A", parentSlug: "b" }, { slug: "b", name: "B", parentSlug:
    "a" }]), "a").map((n) => n.slug) == ["b", "a"]'
  tests:
  - tests/apps/storefront/test/browse.categoryTrail.unit.spec.ts
  max_output_tokens: 512
