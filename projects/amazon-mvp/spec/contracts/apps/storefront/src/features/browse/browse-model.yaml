- id: sf.features.browse.browse-model.departmentFacet
  type: implement
  kind: function
  target: apps/storefront/src/features/browse/browse-model.ts::departmentFacet
  signature: |-
    export function departmentFacet(
      tree: CategoryTree,
      counts: CatalogFacets['categories'],
      selectedSlug: string,
    ): DepartmentFacet
  uses:
  - sf.features.browse.browse-model.CategoryTree
  - contract.CatalogFacets
  - sf.features.browse.browse-model.DepartmentFacet-type
  - sf.features.browse.browse-model.categoryTrail
  - contract.CatalogCategoryNode
  - contract.CatalogPriceBucket
  imports:
  - import type { CatalogCategoryNode, CatalogFacets } from '@amazon-mvp/api-contract';
  - import { brandKey } from './browse-params';
  - import type { CatalogPriceBucket } from '@amazon-mvp/api-contract';
  description: |-
    Build the "Departamento" filter: the ancestors of the selected category, the selection, and its sub-categories that have results.
    With a non-empty `selectedSlug`, take `categoryTrail(tree, selectedSlug)`: `selected` is its last
    node and `trail` is the rest (root first). An empty or unknown slug gives `trail: []` and
    `selected: null`. `options` are the children of the selection, or the roots when nothing is
    selected (`tree.children.get(selected?.slug ?? null)`), in tree order, each as `{ node, count }`
    with the count from `counts` matched by slug (0 when absent). Options with a count of 0 are left
    out, so a leaf selection has no options.
  examples:
  - 'departmentFacet(buildCategoryTree([{ slug: "e", name: "E", parentSlug: null }, { slug: "f", name: "F", parentSlug:
    "e" }]), [{ slug: "e", count: 2 }, { slug: "f", count: 2 }], "f").trail.map((n) => n.slug) == ["e"]'
  tests:
  - tests/apps/storefront/test/browse.departmentFacet.unit.spec.ts
  max_output_tokens: 512
