- id: sf.features.browse.browse-model.pageWindow
  type: implement
  kind: function
  target: apps/storefront/src/features/browse/browse-model.ts::pageWindow
  signature: 'export function pageWindow(page: number, last: number): Array<number | ''gap''>'
  imports:
  - import type { CatalogCategoryNode, CatalogFacets } from '@amazon-mvp/api-contract';
  - import { brandKey } from './browse-params';
  description: |-
    Page links around the current page: the first, the last, the current page and its neighbours, with `'gap'` where pages are skipped.
    Take the set {1, last, page - 1, page, page + 1}, keep the numbers in 1..last, and sort them. Walk
    the sorted list: when a number is exactly 2 above the previous one, insert the single page between
    them; when it is more than 2 above, insert `'gap'`; then push the number.
  examples:
  - pageWindow(10, 20) == [1, "gap", 9, 10, 11, "gap", 20]
  - pageWindow(3, 20) == [1, 2, 3, 4, "gap", 20]
  - pageWindow(1, 1) == [1]
  tests:
  - tests/apps/storefront/test/browse-model.pageWindow.new.spec.ts
  max_output_tokens: 512
