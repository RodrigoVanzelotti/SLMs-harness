- id: sf.features.browse.browse-params.parsePrice
  type: implement
  kind: function
  target: apps/storefront/src/features/browse/browse-params.ts::parsePrice
  signature: 'export function parsePrice(value: string): PriceRange | null'
  uses:
  - sf.features.browse.browse-params.PriceRange
  imports:
  - import { type CatalogSort, CATALOG_SEARCH_MAX_LENGTH, CATALOG_SORTS } from '@amazon-mvp/api-contract';
  description: |-
    Parse a `price` URL value `min-max` (integer minor units) into a `PriceRange`, or null when it is not a usable range.
    The whole value must match `^(\d{1,9})-(\d{1,9})?$` (no spaces, signs or decimals). A missing max
    means no upper bound (`max: null`). A max that is not greater than min gives null.
  examples:
  - 'parsePrice("200000-") == { min: 200000, max: null }'
  - 'parsePrice("0-5000") == { min: 0, max: 5000 }'
  - parsePrice("5000-5000") == null
