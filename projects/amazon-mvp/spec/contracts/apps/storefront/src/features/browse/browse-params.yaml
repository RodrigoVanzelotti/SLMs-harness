- id: sf.features.browse.browse-params.parseBrowseParams
  type: implement
  kind: function
  target: apps/storefront/src/features/browse/browse-params.ts::parseBrowseParams
  signature: 'export function parseBrowseParams(searchParams: SearchParams): BrowseParams'
  uses:
  - sf.features.browse.browse-params.SearchParams
  - sf.features.browse.browse-params.BrowseParams
  - sf.features.browse.browse-params.MAX_PAGE
  - contract.CATALOG_SEARCH_MAX_LENGTH
  - sf.features.browse.browse-params.brandKey
  - sf.features.browse.browse-params.parsePrice
  - contract.CATALOG_SORTS
  - contract.CatalogSort
  - sf.features.browse.browse-params.PriceRange
  after:
  - sf.features.browse.browse-params.browseHref
  - sf.features.browse.browse-params.categoryHref
  - sf.features.browse.browse-params.brandHref
  imports:
  - import { type CatalogSort, CATALOG_SEARCH_MAX_LENGTH, CATALOG_SORTS } from '@amazon-mvp/api-contract';
  description: |-
    Read the listing state from Next.js search params, using the defaults of `EMPTY_BROWSE` for anything missing or invalid.
    For every key use the first element when the value is an array, and '' when it is missing.
    - `q`: trimmed, inner runs of whitespace collapsed to one space, cut to `CATALOG_SEARCH_MAX_LENGTH`.
    - `category`: trimmed and cut to 100 characters ('' is valid: the header's "Todos" submits it).
    - `brand`: `brandKey(value)` cut to 100 characters.
    - `price`: `parsePrice(value.trim())`.
    - `inStock`: true only for exactly `1` or `true`.
    - `sort`: the value when it is one of `CATALOG_SORTS`, else `relevance`.
    - `page`: the trimmed value, '' meaning 1. `pageValid` is true when the value (or `1` when empty)
      matches `^\d+$` and its number is between 1 and `MAX_PAGE`. `page` is that number when valid,
      else 1.
  examples:
  - 'parseBrowseParams({ q: "  fone   bluetooth ", brand: "Letra Viva", price: "5000-10000", inStock: "1", sort:
    "price-desc", page: "3" }) == { q: "fone bluetooth", category: "", brand: "letra-viva", price: { min: 5000,
    max: 10000 }, inStock: true, sort: "price-desc", page: 3, pageValid: true }'
  - 'parseBrowseParams({ page: "abc" }) == { ...EMPTY_BROWSE, pageValid: false }'
  - 'parseBrowseParams({ q: ["first", "second"] }).q == "first"'
  tests:
  - tests/apps/storefront/test/browse.parseBrowseParams.unit.spec.ts
  max_output_tokens: 512
- id: sf.features.browse.browse-params.browseHref
  type: implement
  kind: function
  target: apps/storefront/src/features/browse/browse-params.ts::browseHref
  signature: 'export function browseHref(params: BrowseParams, change: Partial<BrowseParams> = {}): string'
