- id: sf.features.browse.browse-params.priceLabel
  type: implement
  kind: function
  target: apps/storefront/src/features/browse/browse-params.ts::priceLabel
  signature: 'export function priceLabel(range: PriceRange): string'
  uses:
  - sf.features.browse.browse-params.PriceRange
  imports:
  - import { type CatalogSort, CATALOG_SEARCH_MAX_LENGTH, CATALOG_SORTS } from '@amazon-mvp/api-contract';
  description: |-
    Label of a price range in reais: `Até R$ 50`, `R$ 50 a R$ 100` or `R$ 2.000 ou mais`.
    Format each bound (minor units) with `Intl.NumberFormat('pt-BR', { style: 'currency', currency:
    'BRL', minimumFractionDigits: minor % 100 ? 2 : 0, maximumFractionDigits: 2 })` applied to
    minor / 100, so whole reais have no decimals (`R$ 50`) and others have two (`R$ 49,90`).
    - `max` null: `{min} ou mais`.
    - `min` 0: `Até {max}`.
    - Otherwise `{min} a {max}`.
    The space after `R$` is the U+00A0 that Intl produces.
  examples:
  - 'priceLabel({ min: 0, max: 5000 }) == "Até R$\u00a050"'
  - 'priceLabel({ min: 4990, max: null }) == "R$\u00a049,90 ou mais"'
  tests:
  - tests/apps/storefront/test/browse.priceLabel.unit.spec.ts
  max_output_tokens: 512
