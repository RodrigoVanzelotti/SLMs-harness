- id: sf.features.browse.browse-server.loadBrowse
  type: integrate
  kind: function
  target: apps/storefront/src/features/browse/browse-server.ts::loadBrowse
  signature: 'export async function loadBrowse(params: BrowseParams): Promise<BrowseData>'
  uses:
  - sf.features.browse.browse-params.BrowseParams
  - sf.features.browse.browse-server.BrowseData
  - sf.features.browse.browse-model.buildCategoryTree
  - sf.features.browse.browse-server.fetchCategories
  - sf.features.product.product-content.brandByKey
  - sf.features.product.product-content.brandSlugs
  - sf.features.browse.browse-server.BROWSE_PAGE_SIZE
  - sf.features.browse.browse-server.getJson
  - contract.CatalogPage
  - sf.features.browse.browse-server.apiUrl
  - contract.CatalogFacets
  - sf.features.browse.browse-model.brandFacet
  - sf.features.product.product-content.brandOfSlug
  - sf.features.browse.browse-params.PriceRange
  - contract.CatalogSort
  - sf.features.browse.browse-model.CategoryTree
  - sf.features.browse.browse-model.BrandOption
  - contract.CatalogCategoryNode
  - contract.CatalogItem
  - contract.CatalogPriceBucket
  imports:
  - import 'server-only';
  - import { cache } from 'react';
  - import { CATALOG_MAX_PAGE_SIZE, type CatalogCategoryNode, type CatalogPage, type CatalogFacets } from '@amazon-mvp/api-contract';
  - import { getConfig } from '@/config/storefront-config';
  - import { brandByKey, brandSlugs, brandOfSlug } from '@/features/product/product-content';
  - import { buildCategoryTree, categoryTrail, type CategoryTree, type BrandOption, brandFacet } from './browse-model';
  - import type { BrowseParams } from './browse-params';
  - import type { PriceRange } from '@/features/browse/browse-params';
  - import type { CatalogSort } from '@amazon-mvp/api-contract';
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  - import type { CatalogPriceBucket } from '@amazon-mvp/api-contract';
  description: |-
    Fetch everything one listing page needs (taxonomy, product page, facets, brand list) for parsed browse params; throws when the catalog API fails.
    1. `tree = buildCategoryTree(await fetchCategories())`. A `category` that is not in `tree.bySlug`
       returns `{ kind: 'unknown-category', tree }`.
    2. With a brand, `brandName = brandByKey(params.brand)`; not found returns
       `{ kind: 'unknown-brand', tree }`.
    3. Build three `URLSearchParams`, using `set` in this order:
       - scope: `q`, `category` (each only when set).
       - scoped: scope plus, with a brand, `slugs` = the first `BROWSE_PAGE_SIZE` of
         `brandSlugs(brandName)` joined with `,`.
       - list: scoped plus `page`, `pageSize` (`BROWSE_PAGE_SIZE`, 48), `sort`; then, with a price,
         `minPriceMinor` and (when max is not null) `maxPriceMinor`; then `inStock` = `true` when set.
    4. In parallel with `Promise.all`, through `getJson(apiUrl(path, query))`: `/catalog/products`
       with list, `/catalog/facets` with scoped, and, only with a brand, `/catalog/facets` with scope
       (so the other brands stay selectable).
    5. Return `{ kind: 'results', tree, page, facets, brands, brandName }`, where `brands` is
       `brandFacet(slugs, brandOfSlug)` over the slugs of the brand-less facets when a brand is set,
       else of `facets`.
    For `{ q: 'ultimate' }` the requests are `/catalog/products?q=ultimate&page=1&pageSize=48&sort=relevance`
    and `/catalog/facets?q=ultimate`.
  max_output_tokens: 768
