  description: |-
    Async server component for the result area of `/products` for one parsed URL: bar, filters, product grid and pagination, or a message state.
    A private message layout is used for the error states: `<div class="az-browse az-browse--message">` ›
    `<section class="az-browse-results">` (with `role="alert"` only for the catalog error) ›
    `<h1 class="az-browse-results__title">{title}</h1>`, `<p>{body}</p>`,
    `<p><Link class="az-browse-button" href>{label}</Link></p>`. The states, checked in this order:
    1. `!params.pageValid`, before any request: `Página inválida` / `O número da página informado não existe.` / `Ir para a primeira página` → `browseHref(params)`.
    2. `loadBrowse(params)` throws: alert `Não foi possível carregar os produtos` / `O catálogo não respondeu. Tente novamente em instantes.` / `Tentar novamente` → `browseHref(params, { page: params.page })`.
    3. kind `unknown-category`: `Categoria não encontrada` / `Esta categoria não existe ou foi removida do catálogo.` / `Ver todos os produtos` → `/products`.
    4. kind `unknown-brand`: `Marca não encontrada` / `Não há produtos desta marca no catálogo.` / `Ver todos os produtos` → `/products`.

    Results: categoryName = the name of `tree.bySlug.get(params.category)`; title =
    `listingTitle({ q, categoryName, brandName })`; last = `lastPage(page.total, BROWSE_PAGE_SIZE)`;
    refined = price or inStock set; filtered = refined, brand or category set. Render a fragment:
    1. `<div class="az-browse-bar">`:
       - `<p class="az-browse-bar__summary" role="status">`: `resultsSummary(params.page, BROWSE_PAGE_SIZE, total)` when total > 0 and page <= last, else `{total.toLocaleString('pt-BR')} resultados`; then, with `q`, the text ` para ` and `<span class="az-browse-bar__query">“{q}”</span>` (textContent `3 resultados para “ultimate”`).
       - When total > 0, `<SortSelect value={params.sort} options hidden>`: options are `CATALOG_SORTS` as `{ value, label: SORT_LABELS[value], href: browseHref(params, { sort: value }) }`; hidden is the current filters as [name, value] pairs, each only when set, in order `q`, `category`, `brand`, `price` (priceParam), `inStock` = `1`.
    2. `<div class="az-browse">`:
       - When `facets.total > 0`: `<FiltersToggle active={number of truthy category, brand, price, inStock}>` around the sidebar.
       - `<section class="az-browse-results" aria-labelledby="az-browse-title">` with `<h1 id="az-browse-title" class="az-browse-results__title">{title}</h1>`, then:
         - total 0: `<div class="az-browse-empty">`, `<p class="az-browse-empty__title">` = `Nenhum resultado para “{q}”` (or `Nenhum produto encontrado` without q) + ` com os filtros selecionados` when filtered + `.`; then a `<ul>` with one `<li>` per item: `Verifique a ortografia ou use termos mais gerais.` (with q); link `Remover filtros de preço e disponibilidade` → `browseHref(params, { price: null, inStock: false })` (refined); link `Limpar todos os filtros` → `browseHref(params, { category: '', brand: '', price: null, inStock: false })` (filtered); always link `Ver todos os produtos` → `/products`.
         - page > last: `<div class="az-browse-empty"><p class="az-browse-empty__title">A página {page} não existe.</p><p>Estes resultados vão até a página {last}. <Link href={browseHref(params, { page: 1 })}>Ir para a primeira página</Link></p></div>`.
         - else `<ul class="az-browse-grid">` with `<li key={item.id}><ProductCard product={item} freeDelivery availability /></li>` per item, then the pagination when last > 1.

    Sidebar: `<nav class="az-browse-sidebar" aria-label="Filtros de resultados">` with these
    `<section class="az-browse-facet" aria-labelledby={id}><h2 id={id}>` blocks, `‹ ` below meaning
    `<span aria-hidden="true">‹ </span>` and `(n)` meaning `<span class="az-browse-count">(n)</span>`:
    - `az-facet-department`, `Departamento`, from `departmentFacet(tree, facets.categories, params.category)`, shown with a selection or options. `<ul>`: with a selection, `<li><Link class="az-browse-back" href={browseHref(params, { category: '' })}>‹ Qualquer departamento</Link></li>`; per trail node the same link with its name and `{ category: node.slug }`; with a selection, `<li><span class="az-browse-selected" aria-current="true">{name}</span></li>`; per option `<li>` (class `az-browse-child` only with a selection) `<Link href={browseHref(params, { category: slug })}>{name} (count)</Link>`.
    - `az-facet-brand`, `Marcas`, when `brands` is not empty. With a brand set, first `<Link class="az-browse-clear" href={browseHref(params, { brand: '' })}>‹ Limpar</Link>`. The first 8 brands in a `<ul>`; the others in `<details class="az-browse-more" open={one of them is selected}><summary>Ver mais {n} marcas</summary><ul>…</ul></details>`. Each brand: `<li><Link class="az-browse-check" href={browseHref(params, { brand: selected ? '' : key })} aria-current={selected ? 'true' : undefined}><span class="az-browse-check__box" aria-hidden="true">{selected ? '✓' : ''}</span>{name} (count)</Link></li>`.
    - `az-facet-price`, `Preço`: `facets.priceBuckets` with count > 0, as `{ min: minMinor, max: maxMinor }`; shown when any. With a price set, `<Link class="az-browse-clear" href={browseHref(params, { price: null })}>‹ Qualquer preço</Link>`. `<ul>` items keyed by priceParam: the selected range (same min and max) as `<span class="az-browse-selected" aria-current="true">{priceLabel}</span>`, others `<Link href={browseHref(params, { price: range })}>{priceLabel} (count)</Link>`.
    - `az-facet-stock`, `Disponibilidade`, shown when params.inStock or 0 < facets.inStock < facets.total: one check link like a brand's, href `browseHref(params, { inStock: !params.inStock })`, text `Em estoque (facets.inStock)`.

    Pagination: `<nav class="az-browse-pages" aria-label="Paginação"><ul>`: first `<li>`: `‹ Anterior`
    as `<Link rel="prev" href={browseHref(params, { page: page - 1 })}>` when page > 1, else
    `<span class="az-browse-pages__disabled" aria-disabled="true">`. Then per `pageWindow(page, last)`
    item: `'gap'` → `<li class="az-browse-pages__gap" aria-hidden="true">…</li>`; the current page →
    `<li><span class="az-browse-pages__current" aria-current="page">{n}</span></li>`; others →
    `<li><Link href={browseHref(params, { page: n })} aria-label="Página {n}">{n}</Link></li>`. Last
    `<li>`: `Próximo<span aria-hidden="true"> ›</span>`, a `rel="next"` link to page + 1 when
    page < last, else the disabled span.
