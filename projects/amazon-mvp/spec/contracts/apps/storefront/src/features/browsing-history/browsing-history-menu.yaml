  - sf.features.home.catalog-mock.ProductPhoto
  - sf.components.amazon.product-glyph.GlyphKind
  after:
  - sf.features.browsing-history.browsing-history-store.recordProductView
  imports:
  - '''use client'';'
  - import { useState, useRef, useEffect, PointerEvent } from 'react';
  - import Link from 'next/link';
  - import { HorizontalRail } from '@/components/amazon/horizontal-rail';
  - import { ProductImage } from '@/components/amazon/product-image';
  - import { useCart } from '@/features/cart/cart-provider';
  - import { useBrowsingHistory, clearBrowsingHistory, formatHistoryDay, removeProductView } from './browsing-history-store';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import type { GlyphKind } from '@/components/amazon/product-glyph';
  description: |-
    "Seu histórico de navegação" panel: the recently viewed products as a timeline rail, with an edit mode to remove entries or clear all.
    Uses `useBrowsingHistory()`, `useCart()` (only `cart`: an entry whose id is the `productId` of a cart
    line is "in the cart"), and state `editing` (false). `<section class="az-history" aria-labelledby="az-history-title">`:
    1. `<div class="az-history__header">`: `<h2 id="az-history-title" class="az-history__title">Seu histórico de navegação</h2>`;
       when the history is not empty, `<button type="button" class="az-history__edit" aria-pressed={editing}>`
       with text `Concluir` when editing, else `Exibir e editar` (toggles editing); when editing,
       `<button type="button" class="az-history__edit">Limpar histórico</button>` → `clearBrowsingHistory()`.
    2. Empty history: `<p class="az-history__empty">Os produtos que você visualizar aparecerão aqui. <Link href="/products">Explorar produtos</Link></p>`.
    3. Otherwise `<HorizontalRail label="Seu histórico de navegação" className="az-history__rail">` with,
       per entry in stored order, `<article class="az-history__item" key={id}>` containing:
       - `<Link href="/products/{id}" class="az-history__product" title={name}>` with
         `<span class="az-history__image"><ProductImage image={entry.image} />` and, when in the cart,
         `<span class="az-history__in-cart">No carrinho</span>`, then `</span>` and
         `<span class="az-history__name">{name}</span>`;
       - when editing, `<button type="button" class="az-history__remove">Remover</button>` → `removeProductView(id)`;
       - `<span class="az-history__timeline" aria-hidden="true"><span class="az-history__dot" /></span>`;
       - `<time class="az-history__date" dateTime={viewedAt}>` with `formatHistoryDay(viewedAt, now)` only
         for the first entry of its day: empty when the previous entry has the same label.
  tests:
  - tests/apps/storefront/test/browsing-history.BrowsingHistoryStrip.unit.spec.ts
  max_output_tokens: 1280
