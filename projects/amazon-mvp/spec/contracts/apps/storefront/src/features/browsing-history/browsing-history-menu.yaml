- id: sf.features.browsing-history.browsing-history-menu.BrowsingHistoryStrip
  type: implement
  kind: function
  target: apps/storefront/src/features/browsing-history/browsing-history-menu.tsx::BrowsingHistoryStrip
  signature: 'export function BrowsingHistoryStrip({ now = new Date() }: { now?: Date })'
  uses:
  - sf.features.browsing-history.browsing-history-store.useBrowsingHistory
