  type: implement
  kind: function
  target: apps/storefront/src/features/browsing-history/browsing-history-menu.tsx::BrowsingHistoryMenu
  signature: export function BrowsingHistoryMenu()
  uses:
  - sf.features.browsing-history.browsing-history-menu.BrowsingHistoryStrip
  imports:
  - '''use client'';'
  - import { useState, useRef, useEffect, PointerEvent } from 'react';
  - import Link from 'next/link';
  - import { HorizontalRail } from '@/components/amazon/horizontal-rail';
  - import { ProductImage } from '@/components/amazon/product-image';
  - import { useCart } from '@/features/cart/cart-provider';
  - import { useBrowsingHistory, clearBrowsingHistory, formatHistoryDay, removeProductView } from './browsing-history-store';
  description: |-
    Navbar item `Histórico de navegação` that opens the browsing-history flyout on mouse hover, or on click or tap.
    State `open` (false); refs: the wrapper div, a close timeout, and `openedByHover`.
    `<div class="az-history-menu" onPointerEnter onPointerLeave>` with:
    - `<button type="button">` with class `az-navbar__link az-history-menu__trigger` (plus ` is-open` when
      open), `aria-expanded={open}`, `aria-controls="az-history-flyout"`, the text
      `Histórico de navegação` and `<span class="az-history-menu__caret" aria-hidden="true" />`.
    - When open: `<div id="az-history-flyout" class="az-history-flyout"><BrowsingHistoryStrip /></div>`.
    Behavior:
    - Pointer enter and leave only react when `event.pointerType === 'mouse'`. Enter: clear the pending
      close timeout; when closed, set openedByHover; open. Leave: clear any timeout and close after 150 ms.
    - Click: when openedByHover is set, only reset it (the click right after a hover must not close the
      flyout); otherwise toggle `open`.
    - While open, listen on `document`: `keydown` with key `Escape` closes; `pointerdown` whose target is
      outside the wrapper closes. Remove both when it closes or unmounts. When closed, reset
      openedByHover. Clear the timeout on unmount.
  tests:
  - tests/apps/storefront/test/browsing-history.BrowsingHistoryMenu.unit.spec.ts
