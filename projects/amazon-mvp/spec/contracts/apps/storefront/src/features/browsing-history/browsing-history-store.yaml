- id: sf.features.browsing-history.browsing-history-store.getSnapshot
  type: implement
  kind: function
  target: apps/storefront/src/features/browsing-history/browsing-history-store.ts::getSnapshot
  signature: 'function getSnapshot(): BrowsingHistoryEntry[]'
  uses:
  - sf.features.browsing-history.browsing-history-store.BrowsingHistoryEntry
  - sf.features.browsing-history.browsing-history-store.STORAGE_KEY
  - sf.features.browsing-history.browsing-history-store.cache
  - sf.features.browsing-history.browsing-history-store.EMPTY
  - sf.features.home.catalog-mock.ProductPhoto
  imports:
  - '''use client'';'
  - import { useSyncExternalStore } from 'react';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import legacyImages from '../../../../../config/legacy-product-images.json';
  description: |-
    Read the browsing history from localStorage, returning the same array object until the stored string changes.
    Read `window.localStorage.getItem(STORAGE_KEY)` inside try/catch (an error counts as null). When
    the string equals `cache.raw`, return `cache.entries` as is: `useSyncExternalStore` needs a stable
    snapshot. Otherwise parse it (null or '' means `[]`). For an array, keep only valid entries: `id`,
    `name` and `viewedAt` are strings and `Date.parse(viewedAt)` is not NaN. When an entry's
    `image.src` is an own key of the imported `legacyImages` JSON (retired image src → ProductPhoto),
    use a copy of the entry whose `image` is that photo; storage is not rewritten. Invalid JSON or a
    non-array gives `EMPTY`. Store `cache = { raw, entries }` and return the entries.
  max_output_tokens: 512
