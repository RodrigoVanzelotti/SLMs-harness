  description: |-
    Timeline label of a visit date like Amazon's: `Hoje`, `Ontem`, or `{weekday}, {month} {day}` such as `Sáb, Set 26`.
    Compare local calendar days: days = Math.round((midnight of `now` − midnight of the date) / 86 400 000).
    0 → `Hoje`, 1 → `Ontem`, anything else → `${WEEKDAYS[date.getDay()]}, ${MONTHS[date.getMonth()]} ${date.getDate()}`
    (local time; the day is not zero-padded).
  examples:
  - formatHistoryDay(new Date(2026, 8, 26, 10).toISOString(), new Date(2026, 8, 29, 12)) == "Sáb, Set 26"
  - formatHistoryDay(new Date(2026, 8, 28, 10).toISOString(), new Date(2026, 8, 29, 12)) == "Ontem"
