    - `add(body)`: POST `CART_ROUTES.items` (`/api/v1/cart/items`) with the body.
    - `update(id, quantity)`: PATCH `${CART_ROUTES.items}/${encodeURIComponent(id)}` with `{ quantity }`.
    - `remove(id)`: DELETE the same path, no body.
    - `clear()`: DELETE `CART_ROUTES.items`, no body.
