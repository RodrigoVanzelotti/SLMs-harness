# Contracts for apps/storefront/src/features/cart/cart-content.tsx. Generated by tools/planner; edit descriptions, examples and notes only.
units:
- id: sf.features.cart.cart-content.CartContent
  type: implement
  kind: function
  target: apps/storefront/src/features/cart/cart-content.tsx::CartContent
  signature: |-
    export function CartContent({
      products,
      catalogFailed,
      checkoutEnabled,
      pixDiscountPercent = null,
    }: {
      products: RatedCatalogItem[];
      catalogFailed: boolean;
      checkoutEnabled: boolean;
      /** Rate from the API's checkout config (GET /orders/pricing); null = not advertised. */
      pixDiscountPercent?: number | null;
    })
  uses:
  - sf.features.product.reviews.ratings.RatedCatalogItem
  - sf.features.cart.cart-provider.useCart
  - sf.features.cart.money.formatCartMoney
  - sf.components.amazon.product-image.ProductImage
  - sf.features.product.product-presentation.productPresentation
  - contract.MAX_CART_QUANTITY
  - sf.features.checkout.pix-price.PixPrice
  - sf.components.amazon.horizontal-rail.HorizontalRail
  - sf.components.amazon.product-card.ProductCard
  - contract.CatalogItem
  - sf.features.product.reviews.ratings.CardRating
  - sf.features.home.catalog-mock.ProductPhoto
  - sf.components.amazon.product-glyph.GlyphKind
  - sf.features.home.catalog-mock.Product
  after:
  - sf.features.home.catalog-mock.varied
  - sf.features.home.catalog-mock.PRODUCTS
  - sf.features.home.catalog-mock.BEST_SELLERS
  - sf.features.home.catalog-mock.RECOMMENDED
  imports:
  - '''use client'';'
  - import Link from 'next/link';
  - import { MAX_CART_QUANTITY } from '@amazon-mvp/api-contract';
  - import { HorizontalRail } from '@/components/amazon/horizontal-rail';
  - import { ProductCard } from '@/components/amazon/product-card';
  - import { ProductImage } from '@/components/amazon/product-image';
  - import { productPresentation } from '@/features/product/product-presentation';
  - import { PixPrice } from '@/features/checkout/pix-price';
  - import type { RatedCatalogItem } from '@/features/product/reviews/ratings';
  - import { useCart } from './cart-provider';
  - import { formatCartMoney } from './money';
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  - import type { CardRating } from '@/features/product/reviews/ratings';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import type { GlyphKind } from '@/components/amazon/product-glyph';
  - import type { Product } from '@/features/home/catalog-mock';
  description: |-
    Body of the `/cart` page: notices and errors, the cart lines with quantity controls, the order summary, and a rail of products to add.
    Uses `useCart()`. hasItems = status `ready` and the cart has lines; count = `cart.itemCount` (0
    without cart); total = `formatCartMoney(subtotalMinor ?? 0, currency)`; unavailable = some line
    with `!product.active` or quantity > `product.availableQuantity`. "subtotal" below is
    `Subtotal ({count} item|itens): <strong>{total}</strong>` (`item` only for 1). Render a fragment:
    1. `<main class="az-cart-main" aria-label="Carrinho de compras">`:
       - always `<div class="az-cart-feedback" aria-live="polite" role="status">{notice}</div>`;
       - with an error, `<div class="az-cart-error" role="alert">{error} ` plus, unless status is
         `guest`, `<button type="button" disabled={pending}>Tentar novamente</button>` → `refresh()`;
       - `<div class="az-cart-layout">` (plus ` az-cart-layout--filled` when hasItems) holding
         `<div class="az-cart-primary">` with one panel, then always
         `<p class="az-cart-disclaimer">Os preços e a disponibilidade podem mudar. Adicionar um produto ao carrinho não reserva estoque.</p>`,
         and then the summary aside. Panels:
         - loading: `<section class="az-cart-panel" aria-busy="true"><h1>Seu carrinho</h1><p>Carregando seus produtos…</p></section>`.
         - error: `<section class="az-cart-panel"><h1>Seu carrinho</h1><p>Não foi possível carregar os itens. Tente novamente para consultar seu carrinho.</p></section>`.
         - no items: `<section class="az-cart-panel az-cart-empty">`: `<h1>Seu carrinho está vazio</h1>`,
           `<p>Encontre o que você precisa e adicione seus produtos ao carrinho.</p>`,
           `<p>Continue comprando na <Link href="/">página inicial</Link> ou explore os <a href="#cart-products">produtos disponíveis abaixo</a>.</p>`,
           and for guests `<div class="az-cart-signin">` with `<Link href="/login" class="az-cart-button">Entre na sua conta</Link>`,
           `<Link href="/register" class="az-cart-button az-cart-button--secondary">Crie sua conta</Link>` and
           `<p>Entre para consultar e salvar os itens do seu carrinho.</p>`.
         - items: `<section class="az-cart-panel az-cart-items" aria-busy={pending}>`:
           `<div class="az-cart-heading"><h1>Carrinho de compras</h1><button class="az-cart-text-button" type="button" disabled={pending}>Esvaziar carrinho</button></div>` (→ `clear()`),
           `<div class="az-cart-price-label">Preço</div>`, `<ul class="az-cart-list">` of lines, and
           `<div class="az-cart-subtotal">{subtotal}</div>`.
       - Line: `<li class="az-cart-item" aria-label={name}>` (key productId) with
         `<div class="az-cart-item__image"><ProductImage image={productPresentation(line.product).images[0]} /></div>`;
         `<div class="az-cart-item__details">`: `<h2><Link href="/products/{productId}">{name}</Link></h2>`;
         `<p>` with class `az-cart-stock` (plus ` az-cart-stock--unavailable` when `!inStock` or
         quantity > availableQuantity) and text `Indisponível no momento` (`!inStock`),
         `Quantidade selecionada indisponível` (over stock) or `Em estoque`;
         `<p class="az-cart-description">` when there is a description;
         `<div class="az-cart-item__actions">` with `<div class="az-cart-quantity" role="group" aria-label="Quantidade de {name}">`:
         button `−` (aria-label `Diminuir quantidade de {name}`, disabled when pending or quantity <= 1) → `update(id, quantity - 1)`;
         `<label><span class="visually-hidden">Quantidade de {name}</span><select value={quantity} disabled={pending}>`
         with options 1..max(quantity, min(MAX_CART_QUANTITY, availableQuantity)) → `update(id, Number(value))`;
         button `+` (aria-label `Aumentar quantidade de {name}`, disabled when pending or quantity >= min(MAX_CART_QUANTITY, availableQuantity)) → `update(id, quantity + 1)`;
         after the group, `<button type="button" class="az-cart-text-button" aria-label="Excluir {name}" disabled={pending}>Excluir</button>` → `remove(id)`.
         Then `<div class="az-cart-item__price"><strong>{unit price}</strong><span>Subtotal: {line total}</span></div>`
         (`formatCartMoney` with the product currency).
       - When hasItems: `<aside class="az-cart-summary" aria-label="Resumo da compra">`: `<h2>Resumo do pedido</h2>`,
         `<p>{subtotal}</p>`, when checkoutEnabled `<PixPrice amountMinor={cart.subtotalMinor} currency={cart.currency} percent={pixDiscountPercent} prefix="ou " />`;
         then, if checkoutEnabled and not unavailable, `<Link href="/checkout" class="az-cart-button">Continuar para finalizar a compra</Link>`;
         else `<button type="button" class="az-cart-button" disabled aria-describedby="cart-checkout-help">Finalizar compra</button>`
         and `<p id="cart-checkout-help" class="az-cart-summary__help">` with
         `Revise os itens indisponíveis antes de continuar.` when unavailable, else
         `A finalização de compras ainda não está disponível.`.
    2. `<section id="cart-products" class="az-cart-discover" aria-labelledby="cart-products-title">`:
       `<div class="az-cart-discover__heading"><h2 id="cart-products-title">Explore nossos produtos</h2><p>Escolha produtos para adicionar ao seu carrinho.</p></div>`, then:
       - catalogFailed: `<p role="status">Não foi possível carregar os produtos. Atualize a página para tentar novamente.</p>`;
       - products: `<HorizontalRail label="Produtos disponíveis" className="az-cart-product-rail">` with
         `<ProductCard key={id} product={product} action={…} />`. The action for guests is
         `<Link href="/login" class="az-cart-button">Entre para comprar</Link>`; otherwise
         `<button type="button" class="az-cart-button" aria-label="Adicionar {name} ao carrinho" disabled={pending || status !== 'ready' || !inStock}>`
         with text `Adicionar ao carrinho` (or `Indisponível` when out of stock) → `add(product.id)`;
       - no products: `<p>Nenhum produto disponível no momento.</p>`.
  tests:
  - tests/apps/storefront/test/pix-price.CartContent.unit.spec.ts
  max_output_tokens: 5120
