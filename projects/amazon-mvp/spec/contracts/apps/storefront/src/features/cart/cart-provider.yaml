  after:
  - sf.features.cart.cart-provider.useCart
  imports:
  - '''use client'';'
  - import { CartResponse } from '@amazon-mvp/api-contract';
  - import { createContext, ReactNode, useState, useRef, useEffect, useCallback, useContext } from 'react';
  - import { usePathname } from 'next/navigation';
  - import { CartRequestError, cartClient } from './cart-client';
  - import type { CartItemResponse } from '@amazon-mvp/api-contract';
  - import type { AddCartItemRequest } from '@amazon-mvp/api-contract';
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  description: |-
    Client context provider of the signed-in user's cart: loads it, keeps it fresh, and runs add, update, remove and clear one at a time through `cartClient`.
    Props: `userId` (null for a guest) and `enabled` (cart feature on). Provide a `CartState` through
    `<CartContext.Provider>` around `children`.
    State: `cart` null; `status` `loading` when enabled and userId, else `guest`; `pending` false;
    `error` null; `notice` ''. Refs: a `version` counter, `busy`, `refreshQueued`, `mounted`, and the
    BroadcastChannel.
    - Reporting an error: a `CartRequestError` with status 401 sets cart null, status `guest` and error
      `Sua sessão expirou. Entre na sua conta para acessar o carrinho.`; another CartRequestError sets
      error to its message; anything else sets `Não foi possível conectar. Tente novamente.`.
    - `refresh()` (useCallback on enabled, userId): do nothing when not enabled or no userId. While a
      mutation is running, only set refreshQueued. Else take `++version`, `await cartClient.get()`, and
      ignore the outcome when unmounted or `version` changed meanwhile. Success: cart, status `ready`,
      error null. Failure: status `error`, then report the error (so a 401 ends as `guest`).
    - Effects: refresh on mount and whenever `usePathname()` changes; refresh on window `focus` and on
      document `visibilitychange` when `document.visibilityState === 'visible'`; when
      `typeof BroadcastChannel !== 'undefined'`, enabled and userId, open
      `new BroadcastChannel('storefront-cart')` whose messages call refresh. Remove the listeners and
      close the channel on cleanup.
    - Mutations share one helper taking the request and a notice text. Resolve false without a request
      when busy, status `guest` or not enabled. Else set busy, pending true, error null, notice '',
      take `++version` and await the request. Success: when still mounted and the version is
      unchanged, set cart, status `ready`, the notice, and `postMessage('changed')` on the channel;
      resolve true (also when superseded). Failure: report it only when mounted and current; resolve
      false, keeping the last confirmed cart. Finally clear busy and, when mounted, set pending false
      and run a queued refresh.
    - `add(productId, quantity = 1)` → `cartClient.add({ productId, quantity })`, notice
      `Produto adicionado ao carrinho.`; `update(id, quantity)` → `Quantidade atualizada.`;
      `remove(id)` → `Produto removido do carrinho.`; `clear()` → `Seu carrinho foi esvaziado.`.
