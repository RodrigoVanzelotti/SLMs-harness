  description: |-
    Address form that creates or updates a delivery address through `checkoutClient.saveAddress` and passes the saved address to `onSave`.
    State: `values` (`AddressInput`), from `initial` (complement and phone default to '') or, without
    it, all fields '' except `recipient = name`; `saving`; `error`.
    `<form class="az-checkout-address-form" onSubmit>`:
    - with an error, `<p class="az-checkout-error" role="alert">{error}</p>`;
    - a `<div>` with one `<label>{label}<input … /></label>` per row of the provided `fields`
      ([field, label, maxLength, autoComplete]), in order. Input: `name={field}`,
      `value={values[field] ?? ''}`, `type="tel"` for phone, `required` unless the field is in
      `optional`, `maxLength`, `minLength={2}` for recipient, street, neighborhood, city and state,
      `pattern` `[0-9]{8}` for postalCode and `[A-Z]{2}` for state, `inputMode` `numeric` for postalCode
      and `tel` for phone, `autoComplete`, `disabled={saving}`. onChange stores the value, uppercased
      for `state`;
    - `<button class="az-cart-button" disabled={saving}>` (submit) with `Salvando…` while saving, else
      `Salvar endereço`; `<button type="button" class="az-checkout-link" disabled={saving}>Cancelar</button>` → `onCancel()`.
    Submit: `preventDefault()`; saving true, error ''; `onSave(await checkoutClient.saveAddress(values, initial?.id))`;
    on failure the error is the Error's message, else `Não foi possível salvar o endereço.`; finally
    saving false.
