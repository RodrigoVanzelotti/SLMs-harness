  description: |-
    "Adicionar cartão" form: checks the card number in the browser and saves only the brand, last four digits, holder and expiry.
    State: `number` (digits only), `holderName` (starts as `name`), `expMonth` and `expYear` (strings,
    '' until chosen), `saving`, `error`. brand = `detectCardBrand(number)`. Year options: the current
    year and the next 15.
    `<form class="az-checkout-address-form az-checkout-card-form" aria-label="Adicionar cartão" noValidate>`:
    - with an error, `<p class="az-checkout-error" role="alert">{error}</p>`;
    - a `<div>` with:
      - `<label>Número do cartão<input name="cardNumber" value={formatCardNumber(number)} inputMode="numeric" autoComplete="cc-number" maxLength={23} aria-describedby="card-brand-hint" disabled={saving} /></label>`;
        onChange stores `cardDigits(event.target.value)`;
      - `<span id="card-brand-hint" class="az-checkout-muted">` with `CARD_BRAND_LABELS[brand]`, or
        `Visa, Mastercard, Elo, American Express ou Hipercard` without a brand;
      - `<label>Nome no cartão<input name="holderName" value maxLength={CARD_HOLDER_MAX_LENGTH} autoComplete="cc-name" disabled={saving} /></label>`;
      - `<fieldset class="az-checkout-card-expiry" disabled={saving}><legend>Data de validade</legend>` with
        `<select aria-label="Mês de validade" autoComplete="cc-exp-month">` (`<option value="">Mês</option>`,
        then values 1 to 12 shown as `01` to `12`) and `<select aria-label="Ano de validade" autoComplete="cc-exp-year">`
        (`<option value="">Ano</option>`, then the years);
    - `<p class="az-checkout-muted">Simulação: guardamos apenas a bandeira, os 4 últimos dígitos, o nome e a validade. O número completo não é enviado e nenhum código de segurança é pedido.</p>`;
    - `<button class="az-cart-button" disabled={saving}>` with `Salvando…` or `Adicionar cartão`, and
      `<button type="button" class="az-checkout-link" disabled={saving}>Cancelar</button>` → `onCancel()`.
    Submit (`preventDefault()`): the error becomes the first failing check, or '' when all pass:
    `cardNumberError(number)`; trimmed holder shorter than 2 → `Informe o nome impresso no cartão.`;
    month or year missing → `Informe a validade do cartão.`; `isCardExpired({ expMonth, expYear })`
    (as numbers) → `Cartão vencido.`. When valid: saving true;
    `onSave(await checkoutClient.saveCard({ brand, last4: last 4 digits, holderName: trimmed, expMonth, expYear }))`;
    on failure the Error's message, else `Não foi possível salvar o cartão.`; finally saving false.
    There is no security-code field.
