- id: sf.features.checkout.card-number.formatCardNumber
  type: implement
  kind: function
  target: apps/storefront/src/features/checkout/card-number.ts::formatCardNumber
  signature: 'export function formatCardNumber(value: string): string'
  uses:
  - sf.features.checkout.card-number.cardDigits
  - sf.features.checkout.card-number.detectCardBrand
  - contract.CardBrand
  imports:
  - import { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Display a card number with spaces: groups of four digits, or 4-6-5 for American Express.
    Start from `cardDigits(value)`. When `detectCardBrand` gives `AMEX`, join the non-empty slices
    [0, 4), [4, 10) and [10, 15) with spaces (digits after the 15th are dropped). Otherwise put a space
    after every group of four digits that is followed by another digit (no trailing space).
  examples:
  - formatCardNumber("4111111111111111") == "4111 1111 1111 1111"
  - formatCardNumber("378282246310005") == "3782 822463 10005"
  - formatCardNumber("41111") == "4111 1"
  tests:
  - tests/apps/storefront/test/card-number.formatCardNumber.new.spec.ts
  max_output_tokens: 512
- id: sf.features.checkout.card-number.detectCardBrand
  type: implement
  kind: function
  target: apps/storefront/src/features/checkout/card-number.ts::detectCardBrand
  signature: 'export function detectCardBrand(value: string): CardBrand | null'
  uses:
  - contract.CardBrand
  - sf.features.checkout.card-number.cardDigits
  imports:
  - import { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Card brand from the number's prefix (simplified BIN ranges), or null when no accepted brand matches.
    Test `cardDigits(value)` against these patterns, in this order, and return the first match:
    1. `^(606282|3841)` → `HIPERCARD`
    2. `^(4011|4312|4389|4514|4576|5041|5066|5067|509|6277|6362|6363|650|6516|6550)` → `ELO`
    3. `^3[47]` → `AMEX`
    4. `^(5[1-5]|2[2-7])` → `MASTERCARD`
    5. `^4` → `VISA`
    The order matters: some Elo prefixes start with 4 or 5.
  examples:
  - detectCardBrand("5066991111111118") == "ELO"
  - detectCardBrand("2223003122003222") == "MASTERCARD"
  - detectCardBrand("6011111111111117") == null
  tests:
  - tests/apps/storefront/test/card-number.detectCardBrand.new.spec.ts
  max_output_tokens: 512
- id: sf.features.checkout.card-number.passesLuhn
  type: implement
  kind: function
  target: apps/storefront/src/features/checkout/card-number.ts::passesLuhn
  signature: 'export function passesLuhn(value: string): boolean'
  uses:
  - sf.features.checkout.card-number.cardDigits
  imports:
  - import { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Luhn checksum of the card's digits; false when there are no digits.
    From the rightmost digit of `cardDigits(value)`, double every second digit (subtracting 9 when the
    result is above 9) and add all digits. Valid when the sum is a multiple of 10 and there is at least
    one digit.
  examples:
  - passesLuhn("4111 1111 1111 1111") == true
  - passesLuhn("4111111111111112") == false
  - passesLuhn("") == false
  tests:
  - tests/apps/storefront/test/card-number.passesLuhn.new.spec.ts
  max_output_tokens: 512
- id: sf.features.checkout.card-number.cardNumberError
  type: implement
  kind: function
  target: apps/storefront/src/features/checkout/card-number.ts::cardNumberError
  signature: 'export function cardNumberError(value: string): string'
  uses:
  - sf.features.checkout.card-number.cardDigits
  - sf.features.checkout.card-number.detectCardBrand
  - sf.features.checkout.card-number.passesLuhn
  - contract.CardBrand
  imports:
  - import { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Error message for the card number field, or '' when the number is acceptable.
    Use `cardDigits(value)`. Without a brand (`detectCardBrand`), including an empty number, return
    `Bandeira não aceita. Use Visa, Mastercard, Elo, American Express ou Hipercard.` Then the number
    must have 15 digits for AMEX, or 16 or 19 digits for the other brands, and pass `passesLuhn`;
    otherwise return `Número de cartão inválido.`
  examples:
  - cardNumberError("4111 1111 1111 1111") == ""
  - cardNumberError("411111111111111") == "Número de cartão inválido."
  tests:
  - tests/apps/storefront/test/card-number.cardNumberError.new.spec.ts
  max_output_tokens: 512
