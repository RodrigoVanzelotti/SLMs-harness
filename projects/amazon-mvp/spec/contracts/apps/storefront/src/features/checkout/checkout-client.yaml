  imports:
  - import { isApiErrorBody, SavedAddress, CHECKOUT_ROUTES, AddressInput, SavedPaymentCard, PaymentCardInput, SimulatedPayment,
    CheckoutQuote, PlaceOrderRequest, OrderResponse, CartResponse } from '@amazon-mvp/api-contract';
  - import type { ApiErrorBody } from '@amazon-mvp/api-contract';
  - import type { CardBrand } from '@amazon-mvp/api-contract';
  - import type { InstallmentOption } from '@amazon-mvp/api-contract';
  - import type { OrderPaymentCard } from '@amazon-mvp/api-contract';
  - import type { OrderLineResponse } from '@amazon-mvp/api-contract';
  - import type { ErrorCode } from '@amazon-mvp/api-contract';
  - import type { CartItemResponse } from '@amazon-mvp/api-contract';
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  description: |-
    Browser client for addresses, saved cards, quotes and orders: each method resolves to the JSON body or rejects with a `CheckoutError`.
    A private helper sends `fetch(path, { method, credentials: 'same-origin', cache: 'no-store', headers, body })`;
    when a body is given, `headers` is `{ 'content-type': 'application/json' }` and `body` its JSON,
    else both are undefined. The method is always passed, `'GET'` included. Parse the body with
    `response.json()` (null when it fails). A non-2xx status throws `new CheckoutError(message, response.status)`:
    - an API error body (`isApiErrorBody`) with a non-empty `error.details`: `Confira os campos obrigatórios e seus formatos.`;
    - another API error body: its `error.message`;
    - anything else: `Não foi possível completar a solicitação.`.
    Methods (paths from `CHECKOUT_ROUTES`, ids through `encodeURIComponent`):
    - `addresses()`: GET `/api/v1/addresses` → `SavedAddress[]`.
    - `saveAddress(data, id?)`: POST `/api/v1/addresses`, or PUT `/api/v1/addresses/{id}` with an id → `SavedAddress`.
    - `cards()`: GET `/api/v1/payment-cards` → `SavedPaymentCard[]`.
    - `saveCard(data)`: POST `/api/v1/payment-cards` → `SavedPaymentCard`.
    - `deleteCard(id)`: DELETE `/api/v1/payment-cards/{id}` → the remaining `SavedPaymentCard[]`.
    - `quote(paymentMethod?)`: GET `/api/v1/orders/quote`, plus `?paymentMethod={method}` when given → `CheckoutQuote`.
    - `place(data)`: POST `/api/v1/orders` → `OrderResponse`.
  tests:
  - tests/apps/storefront/test/checkout-client.checkoutClient.new.spec.ts
  max_output_tokens: 1024
- id: sf.features.checkout.checkout-client.cartContentKey
  type: implement
  kind: function
  target: apps/storefront/src/features/checkout/checkout-client.ts::cartContentKey
  signature: 'export function cartContentKey(cart: CartResponse | null): string'
  uses:
  - contract.CartResponse
  - contract.CartItemResponse
  - contract.CatalogItem
  imports:
  - import { isApiErrorBody, SavedAddress, CHECKOUT_ROUTES, AddressInput, SavedPaymentCard, PaymentCardInput, SimulatedPayment,
    CheckoutQuote, PlaceOrderRequest, OrderResponse, CartResponse } from '@amazon-mvp/api-contract';
  - import type { CartItemResponse } from '@amazon-mvp/api-contract';
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  description: |-
    Fingerprint of a cart's content, used to tell whether a checkout quote still matches the cart in the provider.
    Return `JSON.stringify` of: `null` without a cart; else `[cart.id, cart.currency, ...lines]` with
    the lines sorted by `productId` (`localeCompare`, on a copy: never reorder the cart), each line as
    `[productId, quantity, unitPriceMinor, product.active, product.availableQuantity]`. Totals, item
    count and names are not part of the key. A cart `cart-1` in BRL with lines `b` (1 × 1099, 3
    available) and `a` (2 × 500, 5 available) gives `["cart-1","BRL",["a",2,500,true,5],["b",1,1099,true,3]]`.
  examples:
  - cartContentKey(null) == "null"
  tests:
  - tests/apps/storefront/test/checkout-client.cartContentKey.new.spec.ts
  max_output_tokens: 512
