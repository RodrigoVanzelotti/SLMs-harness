  description: |-
    Client checkout page: address, simulated payment (cards, Pix, installments), cart review and API-quoted summary; places the order.
    Uses `useRouter()`, `useCart()` (its `error` is cartError).
    Initial: payment `''`, cardId `DEMO_CARD_ID`, installments 1, addressLoading true, editor/uncertain null.
    locked = pending || submitting || uncertain. quoteMethod = payment || `DEFAULT_QUOTE_METHOD`. validQuote: `cartContentKey(quote.cart) === cartContentKey(cart)` and `quote.paymentMethod === quoteMethod`. plan (card, valid quote): option with count `installments`, else the first.

    Effects (ignore stale results):
    - [retry]: `checkoutClient.addresses()` (keep addressId if listed, else the first id or ''; failure → addressError: the message, or `Não foi possível carregar os endereços.`) and `checkoutClient.cards()` (failure → cardsError `Não foi possível carregar seus cartões salvos.`).
    - [cart key, status, pending, retry, uncertain, quoteMethod]: clear quote and quoteError; if `ready` with lines, not pending or uncertain: `checkoutClient.quote(quoteMethod)` (failure → quoteError, fallback `Não foi possível calcular o total.`).

    confirm(): return if busy (ref) or pending; clear error. Unless uncertain, the first failing check sets error and returns: `Selecione e salve um endereço de entrega.` (no addressId, or editing); `Selecione uma forma de pagamento simulada.`; `Seu carrinho está vazio.`; `Atualize e revise o resumo antes de confirmar.` (no valid quote); `Selecione um cartão e o número de parcelas.` (card while addingCard or no plan).
    Request: uncertain, else `{ cartId, revision: quote.revision, addressId, paymentMethod }` plus, for `SIMULATED_CARD` only, `cardId` (not for the demo card) and `installments: plan.count`. Set busy/submitting (cleared finally); `checkoutClient.place(request)`:
    - success: placed, uncertain null, `await refresh()`, `router.push('/checkout/success/' + order.id)`. Never `clear()`.
    - not a `CheckoutError`, or status >= 500: uncertain = request (resent unchanged, even if the cart empties), error `Não foi possível confirmar a resposta. Tente novamente para consultar o mesmo pedido com segurança.`, no refresh.
    - other CheckoutError: uncertain null, error = message; 401 → `router.push('/login?next=checkout')`, else `await refresh()` and retry + 1.

    Early returns in `<main class="az-checkout-main"><section class="az-checkout-panel">`: placed → role status `Pedido salvo. Abrindo confirmação…`; `guest` → `<h1>Entre para finalizar sua compra</h1>`, Link `Entrar na sua conta` → `/login?next=checkout`; `loading` → role status `Carregando seu carrinho…`; `error` → `<h1>Não foi possível carregar seu carrinho</h1>`, `<p role="alert">{cartError}</p>`, `<button class="az-cart-button">Tentar novamente</button>` → refresh(); no lines (not uncertain) → `<h1>Seu carrinho está vazio</h1>`, `<p>Adicione produtos antes de finalizar a compra.</p>`, Link `Voltar ao carrinho` → `/cart`.

    Page `<main class="az-checkout-main">`: `<h1 class="visually-hidden">Finalizar compra</h1>`, `<div class="az-checkout-error" role="alert">{error || cartError}</div>` (when set), `<div class="az-checkout-layout">` › primary `<div class="az-checkout-primary">` + aside.
    Confirm button (section 4 and aside): `<button type="button" class="az-cart-button">` `Confirmando…` / `Tentar confirmar novamente` (uncertain) / `Confirmar pedido`; disabled when (locked and not uncertain), submitting, or (not uncertain and (no valid quote or addressLoading)).
    Sections are `<section class="az-checkout-panel">`; "muted" is `<p class="az-checkout-muted">` (texts (a)-(g): notes); other buttons are `az-checkout-link`, disabled (like the selects) when locked.
    1. `aria-labelledby="delivery-title"`: `<div class="az-checkout-heading"><h2 id="delivery-title">` `Entrega para {recipient}` or `Endereço de entrega`, + `Alterar` (editor = selected) when selected, not editing. Then `<p role="status">Carregando endereços…</p>`, or `<p class="az-checkout-error" role="alert">{addressError} <button>Tentar novamente</button></p>` (retry + 1), or: `<label class="az-checkout-address-choice">Endereço salvo<select>` when any (options `{recipient} — {street}, {number}`; disabled also while editing); the selected address (f); not editing: `<p>Nenhum endereço cadastrado. Adicione um endereço para continuar.</p>` (none) and `Adicionar endereço` (editor 'new'); editing: `<AddressForm key initial name onCancel onSave>` (onSave upserts by id, selects, closes, clears error).
    2. `<h2>Forma de pagamento</h2>`, muted text (a), `<fieldset class="az-checkout-payment" disabled={locked || addingCard}>` with legend (g) and `name="payment"` radios in `<label>`s (checked by payment/cardId; change sets them): per saved card `{cardLabel(card)}<span class="az-checkout-muted"> · {holderName} · Validade MM/YYYY</span>` (`Vencido` when `isCardExpired`: radio disabled, label class `az-checkout-card-expired`); `Cartão fictício · {cardLabel(DEMO_CARD)}`; `Pix simulado` (with a rate, `aria-describedby="checkout-pix-hint"` and `<span id="checkout-pix-hint" class="az-checkout-pix-hint">{n}% de desconto à vista no Pix</span>`). Then cardsError `<p class="az-checkout-error">`; addingCard → `<CardForm name onCancel onSave>` (onSave appends, selects, closes, clears error), else, below `MAX_SAVED_CARDS`, `+ Adicionar cartão de crédito` (also `az-checkout-add-card`); card payment, not adding: `<label class="az-checkout-installments">Parcelamento<select value={plan?.count ?? installments}>` of installmentLabel options (no valid quote: disabled, one option `Calculando parcelas…`).
    3. `<h2>Revise os produtos</h2>`, muted text (b), `<ul class="az-checkout-items">` of `<li aria-label={name}>`: image Link (`az-checkout-product-image`) and `<h3>` name Link, both to `/products/{id}`, `<strong>` unit price, muted `Subtotal: {line total}`, `<p class="az-checkout-error">Quantidade indisponível</p>` (out of stock or over availableQuantity), `<div class="az-checkout-item-actions">`: `<label>Quantidade<select aria-label="Quantidade de {name}">` (options as in the cart) → update(id, n); `Remover` (aria-label `Remover {name}`) → remove(id).
    4. `az-checkout-panel az-checkout-bottom`: confirm button, `<div><strong>Total do pedido: {total}</strong>` + muted text (c) + `</div>`.
    5. Help links (e).
    Aside `<aside class="az-checkout-panel az-checkout-summary" aria-label="Resumo do pedido">`: confirm button; muted text (d); `<hr />`, quoteError `<p class="az-checkout-error" role="alert">`; no valid quote: `<p role="status">` `O resumo precisa ser atualizado.` (quoteError) or `Atualizando resumo…`, + `Atualizar resumo` (refresh(), retry + 1); `<dl>` of `<div><dt/><dd/></div>`: `Itens ({itemCount})` subtotal; `Frete` shipping; discountMinor > 0: `<div class="az-checkout-discount">` `Desconto Pix ({discountPercent}%)` (Pix) or `Descontos`, dd `− {discount}`; `<div class="az-checkout-total">` `Total do pedido`. Amounts: formatCartMoney of the valid quote, else `—`. Plan count > 1: `<p class="az-checkout-muted az-checkout-plan">No cartão: {installmentLabel}</p>`.
  notes: |-
    Static texts referenced above:
    (a) `Simulação acadêmica. Nenhuma cobrança será realizada.`
    (b) `Entrega gratuita nesta simulação. Prazo de entrega não calculado.`
    (c) `Pagamento simulado, sem cobrança real.`
    (d) `Revise o endereço, os produtos e a forma de pagamento antes de confirmar.`
    (e) `<p>Precisa de ajuda? <Link href="/help">Acesse a página de ajuda.</Link></p>` then `<Link href="/cart">Voltar ao carrinho</Link>`.
    (f) `<p>{street}, {number}` (+ `, {complement}` when set) `<br />{neighborhood}, {city} — {state}<br />CEP {postalCode} · Brasil</p>`.
    (g) `<legend class="visually-hidden">Pagamento simulado</legend>`.
    Each radio is followed by a space and then its text, e.g. `<label><input type="radio" name="payment" value="SIMULATED_PIX" … /> Pix simulado</label>`;
    the radio values are the card id, `SIMULATED_CARD` (demo card) and `SIMULATED_PIX`. In the summary
    each `<dt>` is directly followed by its `<dd>`, so the text reads `Total do pedidoR$ 10,45`.
