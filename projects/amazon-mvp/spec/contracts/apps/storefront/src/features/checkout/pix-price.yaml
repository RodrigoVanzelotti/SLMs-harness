# Contracts for apps/storefront/src/features/checkout/pix-price.tsx. Generated by tools/planner; edit descriptions, examples and notes only.
units:
- id: sf.features.checkout.pix-price.PixPrice
  type: implement
  kind: function
  target: apps/storefront/src/features/checkout/pix-price.tsx::PixPrice
  signature: |-
    export function PixPrice({
      amountMinor,
      currency,
      percent,
      prefix,
      className = '',
    }: {
      amountMinor: number;
      currency: string;
      percent: number | null | undefined;
      /** Leading text such as "ou ". */
      prefix?: string;
      className?: string;
    })
  uses:
  - contract.percentDiscountMinor
  - sf.features.cart.money.formatCartMoney
  imports:
  - import { percentDiscountMinor } from '@amazon-mvp/api-contract';
  - import { formatCartMoney } from '@/features/cart/money';
  - import './pix-price.css';
  description: |-
    "R$ X no Pix (5% de desconto)" line for an amount, with the checkout's rounding; renders nothing without a rate or a discount.
    Return null when `percent` is null, undefined or 0. discount = `percentDiscountMinor(amountMinor, percent)`
    (rounded down); return null when it is 0. Otherwise render
    `<p>` with class `az-pix-price`, plus ` {className}` when one is given (no trailing space), containing
    `{prefix}<strong>{formatCartMoney(amountMinor - discount, currency)}</strong> no Pix <span class="az-pix-price__rate">({percent}% de desconto)</span>`.
    The text is then, for example, `R$ 312,55 no Pix (5% de desconto)` for 32900 at 5%, or
    `ou R$ 35,17 no Pix (5% de desconto)` with prefix `ou ` for 3702. 20 at 5% gives `R$ 0,19`; 19 at
    5% renders nothing (the discount rounds to 0).
  tests:
  - tests/apps/storefront/test/pix-price.PixPrice.unit.spec.ts
  max_output_tokens: 512
