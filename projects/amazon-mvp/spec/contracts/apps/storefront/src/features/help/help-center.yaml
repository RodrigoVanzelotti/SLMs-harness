units:
- id: sf.features.help.help-center.CustomerServiceBar
  type: implement
  kind: function
  target: apps/storefront/src/features/help/help-center.tsx::CustomerServiceBar
  signature: 'export function CustomerServiceBar({ currentHref }: { currentHref: string })'
  uses:
  - sf.features.help.help-content.CS_NAV
  after:
  - sf.features.orders.order-presentation.dateFormat
  imports:
  - import Link from 'next/link';
  - import { ProductImage } from '@/components/amazon/product-image';
  - import { HelpTopics } from './help-topics';
  - import { CS_NAV, HERO_ACTIONS, QUICK_LINKS } from './help-content';
  - import { RecentProduct, formatOrderDate } from './recent-products';
  description: |-
    Render the "amazon customer service" navigation bar of the help area, marking the `CS_NAV` link whose href is `currentHref` as the current page.

    Markup, in order:
    - `<nav className="az-cs-bar" aria-label="Atendimento ao Cliente">`.
    - `<Link href="/help" className="az-cs-bar__logo" aria-label="amazon customer service">` holding the wordmark as HTML text (not one SVG):
      `<span className="az-cs-bar__brand" aria-hidden="true">` containing `<span className="az-cs-bar__amazon">amazon<svg viewBox="0 0 44 10" width="44" height="10">…</svg></span>`
      (a small white smile arrow: a curved stroke `stroke="#fff"` plus a white arrow head) followed by a space and the text `customer service`.
    - `<span className="az-cs-bar__divider" aria-hidden="true" />`.
    - `<ul className="az-cs-bar__links">` with one `<li key={link.href}>` per `CS_NAV` entry, in order, each holding
      `<Link href={link.href} className="az-cs-bar__link">{link.label}</Link>`.
      Give that link `aria-current="page"` when `link.href === currentHref`; otherwise pass `undefined` so the attribute is absent.

    With `currentHref="/help"`, "Página inicial" has `aria-current="page"` and "Suporte para dispositivos e serviços digitais" has no `aria-current`.
    Server component: no hooks.
  tests:
  - tests/apps/storefront/test/help.CustomerServiceBar.unit.spec.ts
  max_output_tokens: 768
- id: sf.features.help.help-center.HelpCenter
  type: implement
  kind: function
  target: apps/storefront/src/features/help/help-center.tsx::HelpCenter
  signature: |-
    export function HelpCenter({
      firstName,
      products,
    }: {
      firstName?: string;
      products: RecentProduct[];
    })
  uses:
  - sf.features.help.recent-products.RecentProduct
  - sf.components.amazon.product-image.ProductImage
  - sf.features.orders.order-presentation.formatOrderDate
  - sf.features.help.help-content.HERO_ACTIONS
  - sf.features.help.help-content.QUICK_LINKS
  - sf.features.help.help-topics.HelpTopics
  - sf.features.home.catalog-mock.ProductPhoto
  - sf.components.amazon.product-glyph.GlyphKind
  after:
  - sf.features.orders.order-presentation.dateFormat
  - sf.features.help.recent-products.recentProductsFromOrders
  imports:
  - import Link from 'next/link';
  - import { ProductImage } from '@/components/amazon/product-image';
  - import { HelpTopics } from './help-topics';
  - import { CS_NAV, HERO_ACTIONS, QUICK_LINKS } from './help-content';
  - import { RecentProduct, formatOrderDate } from './recent-products';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import type { GlyphKind } from '@/components/amazon/product-glyph';
  description: |-
    Render the "Atendimento ao Cliente" page body: a hero greeting with the user's recent products (when any), help shortcuts and quick links, then `<HelpTopics />`.

    Markup, in order:
    - `<main className="az-help">` > `<section className="az-help__hero" aria-labelledby="az-help-title">` > `<div className="az-help__inner">`.
    - When `products` is not empty:
      - `<h1 id="az-help-title" className="az-help__title">` reading `Você precisa de ajuda com um produto recente, {firstName}?`.
        Without `firstName` the `, {firstName}` part is dropped: `Você precisa de ajuda com um produto recente?`.
      - `<p className="az-help__subtitle">Selecione abaixo o produto com o qual você precisa de ajuda ou obtenha ajuda com outra coisa.</p>`
      - `<ul className="az-help__products" aria-label="Produtos recentes">`, one `<li key={product.key}>` per product in the given order, holding
        `<Link href={product.href} className="az-help__product">` with
        `<span className="az-help__product-media"><ProductImage image={product.image} /></span>` and
        `<span className="az-help__product-text">` containing `<span className="az-help__product-name">{product.name}</span>` and
        `<span className="az-help__product-date">Pedido em {formatOrderDate(product.orderedAt)}</span>` (e.g. `Pedido em 10 de ago. de 2026`).
    - When `products` is empty (signed out, or no orders): no product list and no placeholders.
      - `<h1 id="az-help-title" className="az-help__title">` reading `Bem-vindo ao Atendimento ao Cliente da Amazon, {firstName}`
        (no question mark; without `firstName`: `Bem-vindo ao Atendimento ao Cliente da Amazon`).
      - `<p className="az-help__subtitle">Como podemos ajudar? Escolha uma opção abaixo ou pesquise na biblioteca de ajuda.</p>`
    - Always, still inside `az-help__inner`:
      - `<div className="az-help__actions">` with `<Link key={action.label} href={action.href} className="az-help__action">{action.label}</Link>` per `HERO_ACTIONS` entry.
      - `<div className="az-help__quick">` containing, in order:
        - `<div className="az-help__quick-intro">` with `<p className="az-help__quick-heading">Tem dúvidas sobre suas compras?</p>` and
          `<Link href="/orders" className="az-help__quick-all">Revisar tudo <span aria-hidden="true">→</span></Link>`.
        - `<ul className="az-help__quick-links">` with one `<li key={link.title}>` per `QUICK_LINKS` entry holding
          `<Link href={link.href} className="az-help__quick-link">` with `<span className="az-help__quick-title">{link.title}</span>` and `<span className="az-help__quick-body">{link.body}</span>`.
        - A decorative `<span className="az-help__quick-art" aria-hidden="true">` with an 80×80 SVG of stacked parcels on a blue square.
    - After the `</section>`, still inside `<main>`: `<HelpTopics />`.

    Tests compare the `<h1>` `textContent` exactly. Server component: no hooks. `formatOrderDate` comes from `./recent-products`.
  tests:
  - tests/apps/storefront/test/help.HelpCenter.unit.spec.ts
  max_output_tokens: 1792
