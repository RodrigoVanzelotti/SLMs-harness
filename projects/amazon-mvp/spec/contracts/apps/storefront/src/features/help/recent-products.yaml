  - import type { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Turn the user's orders into at most six recent-product cards: each product once, from its newest order, newest order first.
    Take `distinctOrderedProducts(orders)`, keep the first `GRID_SIZE` (6), and map each `{ line, order }` to
    `{ key: line.productId, name: line.productName, orderedAt: order.placedAt, href: `/orders/${order.id}`, image: photoForSku(line.sku) }`.
    The order id is not URI-encoded here. `image` is `undefined` when the SKU has no demo photo. No orders gives `[]`.
  examples:
  - recentProductsFromOrders([]) == []
  - 'recentProductsFromOrders([{ id: "o1", placedAt: "2026-01-01T12:00:00Z", lines: [{ productId: "k", productName:
    "Kindle", sku: "DEMO-p3" }] }])[0] == { key: "k", name: "Kindle", orderedAt: "2026-01-01T12:00:00Z", href: "/orders/o1",
    image: { src: "/images/products/kindle.jpg", alt: "Kindle preto" } }'
