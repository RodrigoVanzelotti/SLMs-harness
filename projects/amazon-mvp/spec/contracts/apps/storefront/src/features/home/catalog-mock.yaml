- id: sf.features.home.catalog-mock.varied
  type: implement
  kind: function
  target: apps/storefront/src/features/home/catalog-mock.ts::varied
  signature: 'function varied(candidates: Product[], exclude: Product[] = []): Product[]'
  uses:
  - sf.features.home.catalog-mock.Product
  - sf.features.home.catalog-mock.RAIL_SIZE
  - sf.features.home.catalog-mock.ProductPhoto
  - sf.components.amazon.product-glyph.GlyphKind
  imports:
  - import demoProducts from '../../../../../config/demo-products.json';
  - import { GlyphKind } from '@/components/amazon/product-glyph';
  description: |-
    Pick at most `RAIL_SIZE` (10) products for a home rail, one product per `glyph` before any glyph repeats, leaving out `exclude`.
    1. `pool` = `candidates` without the products in `exclude` (object identity: `exclude.includes(product)`), keeping order.
    2. `first` = the first product of each glyph in `pool`, in pool order.
    3. Return `first` followed by the remaining pool products in pool order, cut to the first `RAIL_SIZE`.
    For glyphs `echo, echo, tv` the result is the first echo, the tv, then the second echo. Does not mutate its inputs; returns the same objects.
  max_output_tokens: 512
