- id: sf.features.home.catalog-mock.PRODUCTS
  type: implement
  kind: declaration
  target: apps/storefront/src/features/home/catalog-mock.ts::PRODUCTS
  signature: 'export const PRODUCTS: Product[]'
  uses:
  - sf.features.home.catalog-mock.Product
  - sf.components.amazon.product-glyph.GlyphKind
  - sf.features.home.catalog-mock.ProductPhoto
  after:
  - sf.features.home.catalog-mock.varied
  imports:
  - import demoProducts from '../../../../../config/demo-products.json';
  - import { GlyphKind } from '@/components/amazon/product-glyph';
  description: |-
    Home page product fixtures: one entry per product family of `demoProducts`, with prices converted from centavos to reais.
    `demoProducts` (config/demo-products.json) is an array of objects with `id` (a slug such as `"p1"`), `name`, `rating`, `reviewCount`,
    `image` (`{ src, alt }`), `glyph` (a `GlyphKind` name), `sku`, `priceMinor`, an optional `oldPriceMinor`, `inventoryQuantity`,
    and, only on colour/size siblings, `variantOf` (the id of the main product).
    - Drop every entry that has a `variantOf` key (`!('variantOf' in product)`); keep the JSON order.
    - Map each to `{ id, name, rating, reviewCount, image, glyph: glyph as GlyphKind, price: priceMinor / 100 }`, adding
      `oldPrice: oldPriceMinor / 100` only when `oldPriceMinor` is truthy (otherwise the key is absent). Copy nothing else.
    The result has 105 products. `PRODUCTS[0]` is `p1` with `price` 279 and `oldPrice` 349; `p6` has no `oldPrice`; `PRODUCTS[8]` is `p9`.
    Other declarations index into this array, so nothing may sort it in place.
  max_output_tokens: 512
