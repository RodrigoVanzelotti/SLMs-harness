  description: |-
    Format an amount in reais (not centavos) as Brazilian currency, e.g. `R$ 279,00`.
    Use `new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value)`; do not divide by 100.
    The space after `R$` is the non-breaking space U+00A0 that Intl produces.
  examples:
  - formatBRL(279) == "R$ 279,00"
  - formatBRL(1234.5) == "R$ 1.234,50"
