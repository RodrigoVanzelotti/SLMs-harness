  imports:
  - '''use client'';'
  - import Link from 'next/link';
  - import { useState } from 'react';
  - import { OrderResponse } from '@amazon-mvp/api-contract';
  - import { ProductImage } from '@/components/amazon/product-image';
  - import { useCart } from '@/features/cart/cart-provider';
  - import { formatCartMoney } from '@/features/cart/money';
  - import { formatLongDate, deliveryStatus, returnWindow, photoForSku } from './order-presentation';
  - import type { AddressInput } from '@amazon-mvp/api-contract';
  - import type { SimulatedPayment } from '@amazon-mvp/api-contract';
  - import type { OrderPaymentCard } from '@amazon-mvp/api-contract';
  - import type { OrderLineResponse } from '@amazon-mvp/api-contract';
  - import type { DeliveryStatus } from '@/features/orders/order-presentation';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import type { GlyphKind } from '@/components/amazon/product-glyph';
  - import type { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Render an order's delivery status, its items with per-item actions, and the order actions; reused by the order details page.
    Compute `status = deliveryStatus(order)` and `returns = returnWindow(order)` (current time).

    Markup, in order:
    - `<div className="az-order__body">` > `<div className="az-order__shipment">` containing:
      - `<h2 className="az-order__status">{status.headline}</h2>`, then `<p className="az-order__status-detail">{status.detail}</p>` only when `detail` is truthy.
      - `<ul className="az-order__items">` with one `<li key={line.productId} className="az-order__item">` per `order.lines` entry:
        - `<Link href={productHref(line.productId)} className="az-order__item-media" tabIndex={-1} aria-hidden="true"><ProductImage image={photoForSku(line.sku)} /></Link>`.
        - `<div className="az-order__item-info">` with `<Link href={productHref(line.productId)} className="az-order__item-name">{line.productName}</Link>`;
          `<p className="az-order__item-meta">Quantidade: {line.quantity}</p>` only when `quantity > 1`;
          `<p className="az-order__item-meta">{returns}</p>` only when `returns` is not null;
          and `<div className="az-order__item-actions">` with `<BuyAgainButton productId={line.productId} />` and
          `<Link href={productHref(line.productId)} className="az-order-btn">Ver o seu item</Link>`.
    - Then, inside `az-order__body`, `<div className="az-order__actions">` with:
      - `<Link href="/help" className="az-order-btn az-order-btn--primary">Obter suporte de produto</Link>` (always);
      - `<Link href={orderHref(order)} className="az-order-btn">Rastrear pacote</Link>` unless `order.status === 'CANCELLED'`;
      - `<Link href={productHref(order.lines[0].productId)} className="az-order-btn">Avaliar o produto</Link>` only when `order.deliveredAt`
        is set and the order has a first line.

    For a delivered single-line order of `product-o1`, the card has the links "Obter suporte de produto", "Rastrear pacote", "Avaliar o produto",
    "Ver o seu item" (`/products/product-o1`) and, for guests, "Comprar novamente".
  max_output_tokens: 1024
- id: sf.features.orders.order-card.BuyAgainButton
  type: implement
  kind: function
  target: apps/storefront/src/features/orders/order-card.tsx::BuyAgainButton
  signature: 'export function BuyAgainButton({ productId }: { productId: string })'
  uses:
  - sf.features.cart.cart-provider.useCart
  - sf.features.orders.order-card.productHref
  after:
  - sf.features.orders.order-presentation.dateFormat
  imports:
  - '''use client'';'
  - import Link from 'next/link';
  - import { useState } from 'react';
  - import { OrderResponse } from '@amazon-mvp/api-contract';
  - import { ProductImage } from '@/components/amazon/product-image';
  - import { useCart } from '@/features/cart/cart-provider';
  - import { formatCartMoney } from '@/features/cart/money';
  - import { formatLongDate, deliveryStatus, returnWindow, photoForSku } from './order-presentation';
  description: |-
    "Comprar novamente" control for one product: adds it to the persistent cart, or links to the product page when the visitor is a guest.
    Uses `useCart()` and local state `clicked` (starts false).
    Content: `<span className="az-order-btn__icon" aria-hidden="true">` with a decorative 22×22 SVG (a circular arrow around a small cart, stroke `#0f1111`),
    followed by the text `Comprar novamente`.
    - When `cart.status === 'guest'`: return `<Link href={productHref(productId)} className="az-order-btn az-order-btn--buy">{content}</Link>`.
    - Otherwise return a fragment:
      `<button type="button" className="az-order-btn az-order-btn--buy" disabled={cart.pending}>{content}</button>`, whose click sets `clicked` to true
      and calls `void cart.add(productId)`; then, only when `clicked && !cart.pending && (cart.error || cart.notice)`,
      `<span className="az-order__buy-status" role="status">{cart.error ?? cart.notice}</span>`.
  max_output_tokens: 768
