- id: sf.features.orders.order-presentation.deliveryStatus
  type: implement
  kind: function
  target: apps/storefront/src/features/orders/order-presentation.ts::deliveryStatus
  signature: 'export function deliveryStatus(order: OrderResponse): DeliveryStatus'
  uses:
  - sf.features.orders.order-presentation.dayMonth
  - contract.OrderResponse
  - sf.features.orders.order-presentation.DeliveryStatus-type
  - contract.AddressInput
  - contract.SimulatedPayment
  - contract.OrderPaymentCard
  - contract.OrderLineResponse
  - contract.CardBrand
  after:
  - sf.features.orders.order-presentation.dateFormat
  imports:
  - import { type OrderResponse, type OrderLineResponse, cardLabel, DEMO_CARD } from '@amazon-mvp/api-contract';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import demoProducts from '../../../../../config/demo-products.json';
  - import type { AddressInput } from '@amazon-mvp/api-contract';
  - import type { SimulatedPayment } from '@amazon-mvp/api-contract';
  - import type { OrderPaymentCard } from '@amazon-mvp/api-contract';
  - import type { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Derive the delivery headline and detail line of an order from its persisted status, delivery date and delivery note.
    Checked in this order:
    1. `status === 'CANCELLED'` → `{ headline: 'Cancelado', detail: order.deliveryNote }`, even when `deliveredAt` is set.
    2. `deliveredAt` set → `{ headline: `Entregue no dia ${dayAndMonth}`, detail: order.deliveryNote }`. `dayAndMonth` drops the "de" of pt-BR,
       e.g. `17 agosto`: take `dayMonth.formatToParts(new Date(deliveredAt))`, keep only the parts of type `day` and `month`, and join their values with one space.
       It is in São Paulo time: `2026-08-01T02:10:00Z` gives `31 julho`.
    3. `status === 'FULFILLED'` → `{ headline: 'Enviado', detail: order.deliveryNote }`.
    4. Otherwise (PENDING, PAID) → `{ headline: 'Pedido recebido', detail: order.deliveryNote ?? 'Ainda não enviado.' }`.
    In cases 1 to 3 `detail` is the note as stored, so it may be `null`.
  examples:
  - 'deliveryStatus({ ...order, status: "FULFILLED", deliveredAt: "2026-08-17T15:10:00Z", deliveryNote: null })
    == { headline: "Entregue no dia 17 agosto", detail: null }'
  - 'deliveryStatus({ ...order, status: "PAID", deliveredAt: null, deliveryNote: null }) == { headline: "Pedido
    recebido", detail: "Ainda não enviado." }'
  tests:
  - tests/apps/storefront/test/order-presentation.deliveryStatus.new.spec.ts
  max_output_tokens: 512
