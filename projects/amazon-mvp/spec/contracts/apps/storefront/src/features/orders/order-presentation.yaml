  max_output_tokens: 512
- id: sf.features.orders.order-presentation.searchOrders
  type: implement
  kind: function
  target: apps/storefront/src/features/orders/order-presentation.ts::searchOrders
  signature: 'export function searchOrders(orders: OrderResponse[], query: string): OrderResponse[]'
  uses:
  - contract.OrderResponse
  - contract.AddressInput
  - contract.SimulatedPayment
  - contract.OrderPaymentCard
  - contract.OrderLineResponse
  - contract.CardBrand
  after:
  - sf.features.orders.order-presentation.dateFormat
  imports:
  - import { type OrderResponse, type OrderLineResponse, cardLabel, DEMO_CARD } from '@amazon-mvp/api-contract';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import demoProducts from '../../../../../config/demo-products.json';
  - import type { AddressInput } from '@amazon-mvp/api-contract';
  - import type { SimulatedPayment } from '@amazon-mvp/api-contract';
  - import type { OrderPaymentCard } from '@amazon-mvp/api-contract';
  - import type { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Find orders by product name or order number, ignoring case, accents and surrounding spaces; a blank query returns `orders` unchanged.
    - normalize(text) = `text.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().trim()`.
    - `term = normalize(query)`; when it is empty return `orders` (the same array).
    - `digits`: when `term` matches `/^[\d\s-]+$/`, `term` with every non-digit removed; otherwise `''`.
    - Keep an order when some line's normalized `productName` includes `term`, or its normalized `orderNumber` includes `term`,
      or `digits` is not empty and `orderNumber` with its non-digits removed includes `digits`. Keep the input order.
    So `702-0000002-1234567` and `70200000021234567` both find order number `702-0000002-1234567`, and `eletrica` finds "Air Fryer Elétrica".
  tests:
  - tests/apps/storefront/test/orders.searchOrders.unit.spec.ts
  max_output_tokens: 512
