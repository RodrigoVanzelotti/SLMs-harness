- id: sf.features.orders.order-presentation.ordersInPeriod
  type: implement
  kind: function
  target: apps/storefront/src/features/orders/order-presentation.ts::ordersInPeriod
  signature: |-
    export function ordersInPeriod(
      orders: OrderResponse[],
      period: OrderPeriod,
      now = new Date(),
    ): OrderResponse[]
  uses:
  - contract.OrderResponse
  - sf.features.orders.order-presentation.OrderPeriod
  - sf.features.orders.order-presentation.orderYear
  - contract.AddressInput
  - contract.SimulatedPayment
  - contract.OrderPaymentCard
  - contract.OrderLineResponse
  - contract.CardBrand
  after:
  - sf.features.orders.order-presentation.dateFormat
  imports:
  - import { type OrderResponse, type OrderLineResponse, cardLabel, DEMO_CARD } from '@amazon-mvp/api-contract';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import demoProducts from '../../../../../config/demo-products.json';
  - import type { AddressInput } from '@amazon-mvp/api-contract';
  - import type { SimulatedPayment } from '@amazon-mvp/api-contract';
  - import type { OrderPaymentCard } from '@amazon-mvp/api-contract';
  - import type { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Keep the orders placed in a period from `periodOptions`, in their original order.
    - `'last30'`: orders with `new Date(placedAt) >= from`, where `from` is a copy of `now` moved back 30 days with `setDate(getDate() - 30)`.
    - `'months3'`: the same with `from` moved back three months with `setMonth(getMonth() - 3)`.
    - Any other value is a year: orders whose `String(orderYear(placedAt)) === period`; an unknown value matches nothing.
    Relative periods have no upper bound.
  examples:
  - 'ordersInPeriod([{ ...order, placedAt: "2026-08-10T13:32:00Z" }], "last30", new Date("2026-09-29T12:00:00Z"))
    == []'
  - 'ordersInPeriod([{ ...order, placedAt: "2026-08-10T13:32:00Z" }], "months3", new Date("2026-09-29T12:00:00Z")).length
    == 1'
  tests:
