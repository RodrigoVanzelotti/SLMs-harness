- id: sf.features.orders.order-presentation.paymentLabel
  type: implement
  kind: function
  target: apps/storefront/src/features/orders/order-presentation.ts::paymentLabel
  signature: |-
    export function paymentLabel(
      order: Pick<OrderResponse, 'paymentMethod' | 'paymentCard' | 'installments'>,
    ): string
  uses:
  - contract.OrderResponse
  - contract.cardLabel
  - contract.DEMO_CARD
  - contract.AddressInput
  - contract.SimulatedPayment
  - contract.OrderPaymentCard
  - contract.OrderLineResponse
  - contract.CardBrand
  after:
  - sf.features.orders.order-presentation.dateFormat
  imports:
  - import { type OrderResponse, type OrderLineResponse, cardLabel, DEMO_CARD } from '@amazon-mvp/api-contract';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import demoProducts from '../../../../../config/demo-products.json';
  - import type { AddressInput } from '@amazon-mvp/api-contract';
  - import type { SimulatedPayment } from '@amazon-mvp/api-contract';
  - import type { OrderPaymentCard } from '@amazon-mvp/api-contract';
  - import type { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Describe how an order was paid, e.g. `Cartão fictício · Mastercard final 5100 · 3x sem juros` or `Pix simulado`.
    - `paymentMethod === 'SIMULATED_PIX'` → `Pix simulado` (card and installments ignored).
    - Any other method except `SIMULATED_CARD` (e.g. `null`) → `Não informado`.
    - `SIMULATED_CARD` → `Cartão fictício · ${cardLabel(order.paymentCard ?? DEMO_CARD)}`; orders without a card snapshot were paid with the demo Visa,
      giving `Cartão fictício · Visa final 4242`. When `installments` is truthy, append ` · à vista` for 1 or ` · {n}x sem juros` for more;
      `null` or 0 appends nothing.
    The separator is ` · ` (a middle dot U+00B7 between spaces).
  examples:
  - 'paymentLabel({ paymentMethod: "SIMULATED_CARD", paymentCard: null, installments: null }) == "Cartão fictício
    · Visa final 4242"'
  - 'paymentLabel({ paymentMethod: "SIMULATED_CARD", paymentCard: { brand: "ELO", last4: "1234" }, installments:
    1 }) == "Cartão fictício · Elo final 1234 · à vista"'
  tests:
  - tests/apps/storefront/test/order-presentation.paymentLabel.new.spec.ts
  max_output_tokens: 512
