  description: |-
    Client component for the "Seus pedidos" page body: breadcrumbs, order search, the Pedidos / Compre Novamente / Ainda não enviado tabs and the tab panel.
    It shows only what `orders` contains, in the given order; it never invents orders.

    State: `tab` (`TabId`, starts `'orders'`), `period` (starts `DEFAULT_PERIOD`), `draft` (the search input) and `query` (the submitted search), both `''`.
    `options = useMemo(() => periodOptions(orders), [orders])`; `periodLabel` is the label of the option whose value is `period` (or `''`).

    Markup, in order:
    - `<main className="az-orders">`.
    - `<nav className="az-orders__crumbs" aria-label="Trilha de navegação">` > `<ol>` with `<li><Link href="/account">Sua conta</Link></li>` and `<li aria-current="page">Seus pedidos</li>`.
    - `<div className="az-orders__top">` with `<h1 className="az-orders__title">Seus pedidos</h1>` and `<form className="az-orders__search" role="search">` holding
      `<label className="az-orders__search-field">` (a decorative 20×20 magnifier SVG with `aria-hidden="true"`, `<span className="visually-hidden">Pesquisar todos os pedidos</span>`,
      and `<input type="search" placeholder="Pesquisar todos os pedidos" value={draft} />` whose change sets `draft`), then
      `<button type="submit" className="az-orders__search-button">Buscar pedidos</button>`.
      Submit: `preventDefault()`, set `query` to `draft.trim()`, switch to tab `'orders'`.
    - `<div className="az-orders__tabs" role="tablist" aria-label="Seus pedidos">` with one
      `<button type="button" role="tab" id={`az-orders-tab-${id}`} aria-controls="az-orders-panel" aria-selected={tab === id} className="az-orders__tab">{label}</button>`
      per `TABS` entry; click selects it.
    - `<div id="az-orders-panel" role="tabpanel" aria-labelledby={`az-orders-tab-${tab}`} className="az-orders__panel">` with the selected tab's content.

    Tab `'orders'` with a `query` (searches ALL orders, the period is ignored): `found = searchOrders(orders, query)`.
    - `<div className="az-orders__summary">` with a `<span>` holding `<strong>1 pedido</strong>` (or `<strong>{n} pedidos</strong>`) followed, as text directly in
      that span, by ` corresponde a “{query}”` (n = 1) or ` correspondem a “{query}”`; then `<button type="button" className="az-orders__clear">Limpar pesquisa</button>`,
      which empties `draft` and `query`.
    - Then `<OrderList orders={found} />`, or when empty `<p className="az-orders__empty">Nenhum pedido encontrado para “{query}”.</p>`.

    Tab `'orders'` without a query: `shown = ordersInPeriod(orders, period)`, `label = orderCountLabel(shown.length)`.
    - `<div className="az-orders__summary">` with `<span id="az-orders-count"><strong>{label.count}</strong> {label.verb}</span>` (text e.g. `1 pedido feito em`),
      then `<span className="az-orders__select">` with `<select aria-labelledby="az-orders-count" value={period}>` (one `<option value={value}>{label}</option>` per option;
      change sets `period`) and a decorative 14×14 chevron SVG (`aria-hidden="true"`).
    - Then `<OrderList orders={shown} />`, or when empty `<p className="az-orders__empty">` with `Parece que você não fez nenhum pedido ` + the period
      (`nos últimos 30 dias` for `last30`, `periodLabel` for `months3`, `em {periodLabel}` for a year) + `. ` + `Escolha outro período para ver pedidos anteriores.`,
      that last sentence only when `options.length > 2`.

    Tab `'buy-again'`: `products = distinctOrderedProducts(orders)`. Empty → `<p className="az-orders__empty">Os produtos que você comprar aparecerão aqui.</p>`.
    Otherwise `<ul className="az-orders__buy-again" aria-label="Compre novamente">` with, per `{ line, order }`, `<li key={line.productId} className="az-orders__buy-card">` holding
    `<Link href={`/products/${encodeURIComponent(line.productId)}`} className="az-orders__buy-link">` (with `<span className="az-orders__buy-media"><ProductImage image={photoForSku(line.sku)} /></span>`
    and `<span className="az-orders__buy-name">{line.productName}</span>`), then `<span className="az-orders__buy-date">Pedido em {formatOrderDate(order.placedAt)}</span>`
    and `<BuyAgainButton productId={line.productId} />`.

    Tab `'not-shipped'`: `pending = orders.filter(isNotYetShipped)`. Empty → `<p className="az-orders__empty">Todos os seus pedidos já foram enviados.</p>`.
    Otherwise `<div className="az-orders__summary"><span><strong>1 pedido</strong> ainda não enviado</span></div>`
    (plural: `<strong>{n} pedidos</strong> ainda não enviados`) followed by `<OrderList orders={pending} />`.
  notes: Private helpers for the three panels and the icons are fine; `OrderList` is a separate unit in this file.
