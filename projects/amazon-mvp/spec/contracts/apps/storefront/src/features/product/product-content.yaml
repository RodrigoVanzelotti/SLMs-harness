- id: sf.features.product.product-content.productContent
  type: implement
  kind: function
  target: apps/storefront/src/features/product/product-content.ts::productContent
  signature: 'export function productContent(product: CatalogItem): ProductContent'
  uses:
  - contract.CatalogItem
  - sf.features.product.product-content.fixtures
  - sf.features.product.product-content.ProductContent-type
  - sf.features.product.product-presentation.productPresentation
  - sf.features.product.product-content.ContentFixture
  - sf.features.home.catalog-mock.ProductPhoto
  - sf.features.product.product-content.Labelled
  - sf.features.product.product-content.VariantOption
  - sf.components.amazon.product-glyph.GlyphKind
  imports:
  - import 'server-only';
  - import { CatalogItem } from '@amazon-mvp/api-contract';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import contentFixtures from '../../../../../config/demo-product-content.json';
  - import brandFixtures from '../../../../../config/demo-brands.json';
  - import { productPresentation } from './product-presentation';
  - import { brandKey } from '@/features/browse/browse-params';
  - import type { GlyphKind } from '@/components/amazon/product-glyph';
  description: |-
    Merchandising content of a catalog record (gallery, brand, specs, badges, variant, fulfillment), from the demo fixtures, matched by slug AND SKU.
    - `presentation = productPresentation(product)`.
    - `fixture` = the first entry of `fixtures` with `id === product.slug && sku === product.sku`. Any other record has no fixture, even one with the same slug.
    - Return a `ProductContent`:
      - `images`: `fixture.gallery` when it is non-empty, else `presentation.images`.
      - `oldPriceMinor`: `presentation.oldPriceMinor`.
      - `brand`, `installments`, `variant`, `fulfillment`: from the fixture, else `undefined`.
      - `attributes`, `bullets`, `details`, `bestSellerRanks`: from the fixture, else `[]`.
      - `badges`: `{ amazonChoice: fixture?.badges?.amazonChoice ?? false, boughtLastMonth: fixture?.badges?.boughtLastMonth }`. Both keys are always present.
      - `demo`: `presentation.demo || Boolean(fixture)`.
    - Add no other keys. There is no `rating`: ratings come from the reviews API. Never copy the name, price, stock, description or categories from the fixture.
  tests:
  - tests/apps/storefront/test/product-content.productContent.unit.spec.ts
  max_output_tokens: 512
