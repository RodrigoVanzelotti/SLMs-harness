  imports:
  - '''use client'';'
  - import { useState, useRef, useEffect } from 'react';
  - import Image from 'next/image';
  - import { ProductImage } from '@/components/amazon/product-image';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import type { GlyphKind } from '@/components/amazon/product-glyph';
  description: |-
    Product photo gallery: up to six thumbnails plus an `N+` button, a main image that opens a full-screen viewer, a share button and a placeholder.
    State:
    - `selected` (0); `active = images[selected] ?? images[0]`.
    - `failed`: a Set of srcs whose image errored.
    - `viewer` (false).
    - `shared` ('').
    `overflow = images.length > VISIBLE_THUMBNAILS + 1`: seven images show seven thumbnails; eight or more show six plus the button. Every picture is the `next/image` `Image`.
    Markup: `<section className="az-pdp-gallery" aria-label={`Imagens de ${name}`}>`:
    1. Only when `images.length > 1`: `<div className="az-pdp-thumbs" role="group" aria-label="Escolher imagem do produto">`.
       - One `<button type="button">` per thumbnail (the first 6 when `overflow`, else all), with `aria-label={`Ver imagem ${i + 1} de ${name}`}` and `aria-pressed={i === selected}`. Both `onClick` and `onMouseEnter` select it. Content: `<Image src={image.src} alt="" width={40} height={40} />`.
       - When `overflow`: `<button type="button" className="az-pdp-thumbs__more" aria-label={`Ver todas as ${images.length} imagens`}>{images.length - 6}+</button>`. It opens the viewer.
    2. `<div className="az-pdp-gallery__stage">`:
       - `<button type="button" className="az-pdp-gallery__share">`: an aria-hidden 18×18 share svg, and `<span className="visually-hidden">Compartilhar</span>`. Click: use `navigator.share({ title: name, url: window.location.href })` when it exists. Otherwise `await navigator.clipboard.writeText(url)` and set `shared` to `Link copiado`. Swallow errors.
       - `<span className="az-pdp-gallery__shared" role="status">{shared}</span>`.
       - When `active` exists and its src is not in `failed`:
         - `<button type="button" className="az-pdp-gallery__main" aria-label={`Ampliar imagem: ${active.alt || name}`}>`, which opens the viewer. It contains `<Image src={active.src} alt={active.alt || name} width={600} height={600} sizes="(max-width: 600px) 90vw, (max-width: 1100px) 45vw, 560px" priority={selected === 0} onError={() => add active.src to failed} />`.
         - Then `<p className="az-pdp-gallery__hint">Clique para ver a imagem completa</p>`.
       - Otherwise `<div className="az-pdp-gallery__main az-pdp-gallery__main--empty"><ProductImage /></div>` (it shows "Imagem indisponível"), and no hint.
    3. When `viewer && active`: the viewer.
    The viewer is a private component sharing `selected` with the gallery:
    - On mount:
      - Remember `document.activeElement` and focus the viewer's close button.
      - Add a `keydown` listener on `document` that reads the latest props through a ref: `Escape` closes, `ArrowRight` selects `(i + 1) % n`, `ArrowLeft` selects `(i - 1 + n) % n`.
      - Set `document.body.style.overflow = 'hidden'`.
    - On unmount: remove the listener, set overflow back to `''` and refocus the remembered element.
    - Markup: `<div className="az-pdp-viewer" role="presentation">` (click closes) wraps `<div className="az-pdp-viewer__panel" role="dialog" aria-modal="true" aria-label={`Imagens de ${name}`}>`. A click on the panel stops propagation. The panel contains:
      - `<button type="button" className="az-pdp-viewer__close" aria-label="Fechar">×</button>`.
      - `<div className="az-pdp-viewer__image">` with `<Image src={active.src} alt={active.alt || name} width={1000} height={1000} sizes="80vw" />` of the selected image.
      - `<div className="az-pdp-viewer__side">` with `<p className="az-pdp-viewer__title">{name}</p>`. When there is more than one image, it also has `<div className="az-pdp-viewer__thumbs" role="group" aria-label="Escolher imagem">` with one button per image: `aria-label={`Imagem ${i + 1} de ${images.length}`}`, `aria-pressed={i === selected}`, click selects, content `<Image src={image.src} alt="" width={64} height={64} />`.
