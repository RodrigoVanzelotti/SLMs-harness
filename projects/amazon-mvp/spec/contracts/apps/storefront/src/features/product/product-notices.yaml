  type: implement
  kind: function
  target: apps/storefront/src/features/product/product-notices.tsx::PurchaseNotice
  signature: |-
    export function PurchaseNotice({
      purchase,
      options,
      reviewHref,
    }: {
      purchase: PreviousPurchase;
      /** Variant options of the purchased catalog record (may be another color). */
      options: Array<{ name: string; value: string }>;
      reviewHref: string;
    })
  uses:
  - sf.features.product.product-rules.PreviousPurchase
  - sf.features.product.product-rules.formatPurchaseDate
  - contract.OrderResponse
  - contract.OrderLineResponse
  - contract.AddressInput
  - contract.SimulatedPayment
  - contract.OrderPaymentCard
  - contract.CardBrand
  imports:
  - import Link from 'next/link';
  - import { type PreviousPurchase, formatPurchaseDate } from './product-rules';
  - import type { OrderResponse } from '@amazon-mvp/api-contract';
  - import type { OrderLineResponse } from '@amazon-mvp/api-contract';
  - import type { AddressInput } from '@amazon-mvp/api-contract';
  - import type { SimulatedPayment } from '@amazon-mvp/api-contract';
  - import type { OrderPaymentCard } from '@amazon-mvp/api-contract';
  - import type { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    "You bought this before" banner on the product page, linking to the order, to writing a review and to product support.
    `<section className="az-pdp-bought" aria-label="Compra anterior">` contains, in order:
    1. A `<div>` with two paragraphs:
       - `<p className="az-pdp-bought__title">`: `<span className="az-pdp-bought__icon" aria-hidden="true">i</span>`, then the text `Você comprou este produto pela última vez em {formatPurchaseDate(purchase.order.placedAt)}`.
       - `<p className="az-pdp-bought__meta">`: one `<span key={option.name}>{option.name}: <strong>{option.value}</strong></span>` per entry of `options`, then `<Link href={`/orders/${encodeURIComponent(purchase.order.id)}`}>Ver pedido</Link>`.
    2. `<nav aria-label="Ações da compra anterior">` with `<Link href={reviewHref}>Incluir avaliação</Link>` and `<Link href="/help">Suporte ao produto</Link>`.
  max_output_tokens: 512
- id: sf.features.product.product-notices.ProductBreadcrumb
  type: implement
  kind: function
  target: apps/storefront/src/features/product/product-notices.tsx::ProductBreadcrumb
  signature: |-
    export function ProductBreadcrumb({
      path,
      hrefFor,
    }: {
      path: Array<{ slug: string; name: string }>;
      hrefFor?: (slug: string) => string;
    })
  imports:
  - import Link from 'next/link';
  - import { type PreviousPurchase, formatPurchaseDate } from './product-rules';
  description: |-
    Category trail of the product page; each level is a link when `hrefFor` is given, plain text otherwise.
    - An empty `path` → render `null`.
    - Otherwise render `<nav className="az-pdp-breadcrumb" aria-label="Categorias do produto"><ol>` with one `<li key={slug}>` per level, in order.
    - From the second level on, the `li` starts with `<span className="az-pdp-breadcrumb__sep" aria-hidden="true">›</span>`.
    - Then `<Link href={hrefFor(slug)}>{name}</Link>` when `hrefFor` is given, else `<span>{name}</span>`.
  max_output_tokens: 512
