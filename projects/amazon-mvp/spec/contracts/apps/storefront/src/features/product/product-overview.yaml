# Contracts for apps/storefront/src/features/product/product-overview.tsx. Generated by tools/planner; edit descriptions, examples and notes only.
units:
- id: sf.features.product.product-overview.ProductOverview
  type: implement
  kind: function
  target: apps/storefront/src/features/product/product-overview.tsx::ProductOverview
  signature: |-
    export function ProductOverview({
      product,
      content,
      rating,
      dimensions,
      brandHref,
      pixDiscountPercent = null,
    }: {
      product: CatalogItem;
      content: ProductContent;
      /** From the reviews API; absent when the product has no ratings yet. */
      rating?: CardRating;
      dimensions: VariantDimension[];
      brandHref?: string;
      /** Rate from the API's checkout config (GET /orders/pricing); null = not advertised. */
      pixDiscountPercent?: number | null;
    })
  uses:
  - contract.CatalogItem
  - sf.features.product.product-content.ProductContent-type
  - sf.features.product.reviews.ratings.CardRating
  - sf.features.product.product-rules.VariantDimension
  - sf.features.product.product-rules.discountPercent
  - sf.features.product.product-rules.installmentPlan
  - sf.features.product.product-rules.formatRating
  - sf.features.product.product-stars.ProductStars
  - sf.features.product.product-price.ProductPrice
  - sf.features.checkout.pix-price.PixPrice
  - sf.features.cart.money.formatCartMoney
  - sf.features.home.catalog-mock.ProductPhoto
  - sf.features.product.product-content.Labelled
  - sf.features.product.product-content.VariantOption
  - sf.features.product.product-rules.VariantChoice
  - sf.features.product.product-rules.VariantMember
  imports:
  - import Image from 'next/image';
  - import Link from 'next/link';
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  - import { formatCartMoney } from '@/features/cart/money';
  - import { PixPrice } from '@/features/checkout/pix-price';
  - import type { ProductContent } from './product-content';
  - import type { CardRating } from './reviews/ratings';
  - import { ProductPrice } from './product-price';
  - import { ProductStars } from './product-stars';
  - import { type VariantDimension, discountPercent, installmentPlan, formatRating } from './product-rules';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import type { Labelled } from '@/features/product/product-content';
  - import type { VariantOption } from '@/features/product/product-content';
  - import type { VariantChoice } from '@/features/product/product-rules';
  - import type { VariantMember } from '@/features/product/product-rules';
  description: |-
    Middle column of the product page: title, brand, attributes, rating, badges, prices with Pix and installments, benefits, variant swatches and bullets.
    - `discount = discountPercent(product.priceMinor, content.oldPriceMinor)`.
    - `plan = content.installments && installmentPlan(product.priceMinor, content.installments.count)`.
    It is a server component with no state.
    Elements, in order, inside `<section className="az-pdp-info" aria-label="Informações do produto">`:
    1. `<h1 id="product-title">{product.name}</h1>`.
    2. When `content.brand`: `<p className="az-pdp-brand">`. With `brandHref` it holds `<Link href={brandHref}>Marca: {brand}</Link>`; without it, the plain text `Marca: {brand}`.
    3. One `<p key={label} className="az-pdp-attribute"><strong>{label}</strong> : {value}</p>` per entry of `content.attributes`.
    4. When `rating`: `<p className="az-pdp-rating">` holding:
       - `<span aria-hidden="true">{formatRating(rating.average)}</span>`.
       - `<ProductStars rating={rating.average} />`.
       - A plain `<a href="#customer-reviews" aria-label={`${count} avaliações de clientes`}>({count})</a>`, where `count` is `rating.count.toLocaleString('pt-BR')` (`5.512`).
    5. When `content.badges.amazonChoice`: `<p className="az-pdp-choice">Escolha da Amazon</p>`.
    6. When `content.badges.boughtLastMonth`: `<p className="az-pdp-bought-count"><strong>{boughtLastMonth}</strong> no mês passado</p>`.
    7. `<div className="az-pdp-pricing">`:
       - `<p className="az-pdp-pricing__main">`: when `discount` is truthy, `<span className="az-pdp-discount">-{discount}%</span>`; then `<ProductPrice amount={product.priceMinor} currency={product.currency} />`.
       - When `product.active` (even when out of stock): `<PixPrice amountMinor={product.priceMinor} currency={product.currency} percent={pixDiscountPercent} />`.
       - When `content.oldPriceMinor && discount`: `<p className="az-pdp-muted">De: <del>{formatCartMoney(oldPriceMinor, currency)}</del></p>`.
       - When `plan`: `<p className="az-pdp-installments">ou em até <strong>{plan.count}x de {formatCartMoney(plan.eachMinor, currency)} sem juros</strong></p>`.
       - `<p><Link className="az-pdp-link" href="/payment-methods">Ver opções de pagamento</Link></p>`.
    8. `<div className="az-pdp-benefits">`:
       - `<p><Link href="/credit-card">Ganhe pontos nesta compra com o cartão Amazon: peça o seu com anuidade zero e vantagens exclusivas.</Link></p>`.
       - `<ul aria-label="Benefícios">`, whose items are:
         - Always: `<li><Link href="/payment-methods">[icon] Pagamentos e Segurança</Link></li>`.
         - When `content.fulfillment?.shippedBy === 'Amazon'`: `/shipping`, `Enviado pela Amazon`.
         - When `content.fulfillment?.returns`: `/returns`, `Política de devolução`.
         Each icon is `<span className="az-pdp-benefit-icon" aria-hidden="true">` holding a 22×22 stroke svg (lock, truck, return arrow).
    9. When `dimensions.length > 0`: `<div className="az-pdp-variants">`, with one `<div key={name} className="az-pdp-variant">` per dimension:
       - `<p>{name}: <strong>{selected}</strong></p>`.
       - When the dimension has more than one choice: `<ul aria-label={`Escolher ${name.toLowerCase()}`}>`, with one `<li key={value}>` per choice holding a `Link`. Using the choice's `member.product` and `member.image`, the Link has:
         - `href={`/products/${encodeURIComponent(product.slug)}`}` and `scroll={false}`.
         - `className`: `az-pdp-swatch`, plus ` az-pdp-swatch--selected` when selected, plus ` az-pdp-swatch--unavailable` when `!product.inStock`, plus ` az-pdp-swatch--text` when there is no image.
         - `aria-label={`${name} ${value}, ${formatCartMoney(product.priceMinor, product.currency)}`}`, followed by `, indisponível` when out of stock. Example: `Cor Verde, R$ 200,10, indisponível`.
         - `aria-current="true"` only on the selected choice, and `title={value}`.
         - Content: `<Image src={image.src} alt="" width={64} height={64} />`, or `<span>{value}</span>` without an image.
    10. When `content.bullets.length > 0`: `<div className="az-pdp-about"><h2>Sobre este item</h2><ul>` with one `<li>` per bullet.
    11. When `content.details.length > 0 || product.description`: `<a className="az-pdp-link az-pdp-more" href="#product-details">› Ver mais detalhes do produto</a>`.
  notes: 'Text that tests look up must be a direct text node of its element. For example, `Marca: Amazon` is the
    text of the `p`, and `-20%` is the text of the span.'
  max_output_tokens: 3072
