# Contracts for apps/storefront/src/features/product/product-presentation.ts. Generated by tools/planner; edit descriptions, examples and notes only.
units:
- id: sf.features.product.product-presentation.productPresentation
  type: implement
  kind: function
  target: apps/storefront/src/features/product/product-presentation.ts::productPresentation
  signature: 'export function productPresentation(product: CatalogItem): { images: { src: string; alt: string; }[];
    demo: boolean; oldPriceMinor: number; glyph: GlyphKind | undefined; }'
  uses:
  - contract.CatalogItem
  - sf.components.amazon.product-glyph.GlyphKind
  imports:
  - import { CatalogItem, CatalogProductDetails } from '@amazon-mvp/api-contract';
  - import type { GlyphKind } from '@/components/amazon/product-glyph';
  - import demoProducts from '../../../../../config/demo-products.json';
  - import productImages from '../../../../../config/product-images.json';
  description: |-
    Local photo, demo flag, previous price and card glyph for a catalog record, matched by slug AND SKU so no other product inherits them.
    - `demo` = the entry of `demoProducts` (config/demo-products.json; fields `id`, `sku`, `image?`, `oldPriceMinor?`, `glyph?`, ...) with `id === product.slug && sku === product.sku`.
    - `image` = `demo?.image`. Otherwise it is the `image` of the `productImages` entry (config/product-images.json; fields `slug`, `sku`, `image`) with `slug === product.slug && sku === product.sku`.
    - Return exactly `{ images, demo, oldPriceMinor, glyph }`:
      - `images`: `image ? [image] : []`.
      - `demo`: `Boolean(demo)`.
      - `oldPriceMinor`: the demo's `oldPriceMinor` only when it is strictly greater than `product.priceMinor`, else `undefined`.
      - `glyph`: `demo?.glyph as GlyphKind | undefined`.
    A matching id or slug alone is never enough. Never return the fixture's name, price, stock or rating.
  tests:
  - tests/apps/storefront/test/product-presentation.productPresentation.unit.spec.ts
  max_output_tokens: 512
- id: sf.features.product.product-presentation.normalizeProductDetails
  type: implement
  kind: function
  target: apps/storefront/src/features/product/product-presentation.ts::normalizeProductDetails
  signature: |-
    export function normalizeProductDetails(
      product: CatalogItem & Partial<CatalogProductDetails>,
    ): CatalogProductDetails
  uses:
  - contract.CatalogItem
  - contract.CatalogProductDetails
  after:
  - sf.features.product.product-presentation.productPresentation
  imports:
  - import { CatalogItem, CatalogProductDetails } from '@amazon-mvp/api-contract';
  - import type { GlyphKind } from '@/components/amazon/product-glyph';
  - import demoProducts from '../../../../../config/demo-products.json';
  - import productImages from '../../../../../config/product-images.json';
  description: |-
    Give a catalog product payload safe defaults: a trimmed-or-null description, category lists, non-negative stock and a strict `inStock`.
    Return `{ ...product }` with these overrides:
    - `description`: `product.description?.trim() || null` (blank → `null`).
    - `categories`: `product.categories ?? []`.
    - `categoryPath`: `product.categoryPath ?? []`.
    - `availableQuantity`: `Math.max(0, product.availableQuantity ?? 0)`.
    - `inStock`: `product.active && product.inStock && product.availableQuantity > 0`.
    Every other field (id, name, price, ...) is kept as received.
  tests:
  - tests/apps/storefront/test/product-presentation.normalizeProductDetails.unit.spec.ts
  max_output_tokens: 512
