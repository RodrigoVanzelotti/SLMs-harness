- id: sf.features.product.product-rules.variantDimensions
  type: implement
  kind: function
  target: apps/storefront/src/features/product/product-rules.ts::variantDimensions
  signature: |-
    export function variantDimensions(
      current: VariantMember,
      members: VariantMember[],
    ): VariantDimension[]
  uses:
  - sf.features.product.product-rules.VariantMember
  - sf.features.product.product-rules.VariantDimension
  - contract.CatalogItem
  - sf.features.home.catalog-mock.ProductPhoto
  - sf.features.product.product-rules.VariantChoice
  imports:
  - import { type CatalogItem, type OrderResponse, type OrderLineResponse, type SavedPaymentCard, isCardExpired
    } from '@amazon-mvp/api-contract';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  description: |-
    Build a product page's variation matrix: one dimension per option of `current`, each value found in `members` linked to its best-matching record.
    - For each `{ name, value }` of `current.options`, in that order, return `{ name, selected: value, choices }`.
    - `choices`: the distinct values that `members` have for option `name`, in first-seen order (members without that option are skipped).
    - For each value: `selected` is `value === selected`. `member` is the first member with that value whose every other option equals `current`'s value for that option name. If none matches, it is the first member with that value.
    Example: current Preto/M, members [Preto/M, Preto/G, Branco/P, Branco/M]. The `Cor` choice `Branco` links to Branco/M (keeps size M). The `Tamanho` choice `P` links to Branco/P (there is no Preto/P).
  notes: Pure; do not mutate the inputs. `current` is normally one of `members`.
  tests:
  - tests/apps/storefront/test/product-rules.variantDimensions.unit.spec.ts
  max_output_tokens: 512
