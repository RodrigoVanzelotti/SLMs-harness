- id: sf.features.product.product-rules.installmentPlan
  type: implement
  kind: function
  target: apps/storefront/src/features/product/product-rules.ts::installmentPlan
  signature: 'export function installmentPlan(totalMinor: number, count: number): { count: number; eachMinor: number;
    lastMinor: number; totalMinor: number; }'
  imports:
  - import { type CatalogItem, type OrderResponse, type OrderLineResponse, type SavedPaymentCard, isCardExpired
    } from '@amazon-mvp/api-contract';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  description: |-
    Split a total into `count` interest-free installments that add back up to the total; the last installment absorbs the rounding.
    Return `{ count, eachMinor, lastMinor, totalMinor }`:
    - `eachMinor = Math.floor(totalMinor / count)`.
    - `lastMinor = totalMinor - eachMinor * (count - 1)`.
    - `totalMinor` is the input total.
  examples:
  - 'installmentPlan(20520, 6) == { count: 6, eachMinor: 3420, lastMinor: 3420, totalMinor: 20520 }'
  - 'installmentPlan(1000, 3) == { count: 3, eachMinor: 333, lastMinor: 334, totalMinor: 1000 }'
  tests:
  - tests/apps/storefront/test/product-rules.installmentPlan.unit.spec.ts
  max_output_tokens: 512
