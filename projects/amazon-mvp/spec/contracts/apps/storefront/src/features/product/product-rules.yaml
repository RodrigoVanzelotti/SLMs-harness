- id: sf.features.product.product-rules.showPrimeNotice
  type: implement
  kind: function
  target: apps/storefront/src/features/product/product-rules.ts::showPrimeNotice
  signature: |-
    export function showPrimeNotice(
      cards: SavedPaymentCard[] | null,
      dismissedBy: string | undefined,
      userId: string,
      now = new Date(),
    ): boolean
  uses:
  - contract.SavedPaymentCard
  - contract.isCardExpired
  - contract.PaymentCardInput
  - contract.CardBrand
  imports:
  - import { type CatalogItem, type OrderResponse, type OrderLineResponse, type SavedPaymentCard, isCardExpired
    } from '@amazon-mvp/api-contract';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import type { PaymentCardInput } from '@amazon-mvp/api-contract';
  - import type { CardBrand } from '@amazon-mvp/api-contract';
  description: |-
    Decide whether the product page shows the simulated Prime banner. It is hidden once this user dismissed it, or once they have a non-expired saved card.
    - `dismissedBy === userId` → `false`. A dismissal stored for another user id does not count.
    - Otherwise return `true` unless `cards` contains a card for which `isCardExpired(card, now)` is false.
    - `null` cards (unknown, e.g. the API is down) → `true`. `[]` → `true`.
  examples:
  - showPrimeNotice(null, undefined, "u") == true
  - showPrimeNotice([], "u", "u") == false
  - showPrimeNotice([], "other", "u") == true
  tests:
  - tests/apps/storefront/test/prime-payment-notice.showPrimeNotice.unit.spec.ts
