  description: |-
    Format an ISO instant as its calendar day in São Paulo, Amazon style: `10 de Ago de 2026`.
    Call `monthDate.formatToParts(new Date(iso))` (the provided pt-BR formatter, short month, `America/Sao_Paulo`). Take the `day`, `month` and `year` parts (empty string when missing). Remove the `.` from the month and upper-case its first letter. Return `${day} de ${Month} de ${year}`. The day is not zero-padded.
  examples:
  - formatPurchaseDate("2026-08-10T13:32:00.000Z") == "10 de Ago de 2026"
  - formatPurchaseDate("2026-08-11T01:00:00.000Z") == "10 de Ago de 2026"
