- id: sf.features.product.product-sections.ProductDetailsSection
  type: implement
  kind: function
  target: apps/storefront/src/features/product/product-sections.tsx::ProductDetailsSection
  signature: |-
    export function ProductDetailsSection({
      content,
      rating,
    }: {
      content: ProductContent;
      /** From the reviews API; absent when the product has no ratings yet. */
      rating?: CardRating;
    })
  uses:
  - sf.features.product.product-content.ProductContent-type
  - sf.features.product.reviews.ratings.CardRating
  - sf.features.product.product-rules.formatRating
  - sf.features.product.product-stars.ProductStars
  - sf.features.home.catalog-mock.ProductPhoto
  - sf.features.product.product-content.Labelled
  - sf.features.product.product-content.VariantOption
  imports:
  - import Image from 'next/image';
  - import Link from 'next/link';
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  - import { HorizontalRail } from '@/components/amazon/horizontal-rail';
  - import type { ProductPhoto } from '@/features/home/catalog-mock';
  - import type { ProductContent, BrandStory } from './product-content';
  - import { ProductStars } from './product-stars';
  - import type { CardRating } from './reviews/ratings';
  - import { formatRating } from './product-rules';
  - import type { Labelled } from '@/features/product/product-content';
  - import type { VariantOption } from '@/features/product/product-content';
  description: |-
    "Detalhes do produto" section with the product's spec rows, best-seller ranks and rating; omitted when it has none of them.
    - Render `null` when `content.details` and `content.bestSellerRanks` are both empty and there is no `rating`.
    - Otherwise render `<section className="az-pdp-section" id="product-details" aria-labelledby="product-details-title">`, with `<h2 id="product-details-title">Detalhes do produto</h2>` and `<ul className="az-pdp-details">`, whose items are, in order:
      - Per detail: `<li key={label}><strong>{label} :</strong> {value}</li>`. The value is a direct text node of the `li`.
      - When there are ranks: `<li><strong>Ranking dos mais vendidos:</strong> ` followed by one `<span key={category}>Nº {rank} em {category}</span>` per rank. The span's className is `az-pdp-details__subrank` from the second rank on, and `''` for the first.
      - When `rating`: `<li><strong>Avaliações dos clientes:</strong> {formatRating(rating.average)} <ProductStars rating={rating.average} /> <a href="#customer-reviews">({rating.count.toLocaleString('pt-BR')})</a></li>`.
  max_output_tokens: 768
