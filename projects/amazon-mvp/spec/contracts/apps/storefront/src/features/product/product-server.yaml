- id: sf.features.product.product-server.listBySlugs
  type: integrate
  kind: function
  target: apps/storefront/src/features/product/product-server.ts::listBySlugs
  signature: 'export async function listBySlugs(slugs: string[]): Promise<CatalogItem[]>'
  uses:
  - contract.CatalogItem
  - sf.features.product.product-server.apiBase
  - contract.CatalogPage
  imports:
  - import 'server-only';
  - import { cache } from 'react';
  - import { cookies } from 'next/headers';
  - import { CatalogProductDetails, CatalogItem, CatalogPage, SavedAddress } from '@amazon-mvp/api-contract';
  - import { getConfig } from '@/config/storefront-config';
  - import { productContent, variantGroupSlugs } from './product-content';
  - import { normalizeProductDetails } from './product-presentation';
  - import { type RelatedFacts, type RelatedCandidate, distinctCards, rankRelated } from './related-products';
  description: |-
    Fetch the catalog records for a list of slugs, one request per 48 slugs (the API page limit), in the API's order. Failed chunks contribute nothing.
    - Split `slugs` into consecutive chunks of 48.
    - Request all chunks in parallel (`Promise.all`): `fetch(`${apiBase()}/catalog/products?pageSize=48&slugs=${chunk.map(encodeURIComponent).join(',')}`, { cache: 'no-store' })`. The commas between slugs stay literal.
    - Ok → the page's `items`; non-ok or thrown → `[]`.
    - Return the results flattened in chunk order. No slugs → no request, `[]`.
    - Do not de-duplicate, filter or re-order: callers pick records by slug.
