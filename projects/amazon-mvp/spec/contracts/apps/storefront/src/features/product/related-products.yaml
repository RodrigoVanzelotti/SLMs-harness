- id: sf.features.product.related-products.rankRelated
  type: implement
  kind: function
  target: apps/storefront/src/features/product/related-products.ts::rankRelated
  signature: |-
    export function rankRelated(
      target: { item: CatalogItem; facts: RelatedFacts },
      candidates: RelatedCandidate[],
      limit: number,
    ): CatalogItem[]
  uses:
  - sf.features.product.related-products.RelatedFacts
  - sf.features.product.related-products.RelatedCandidate
  - sf.features.product.related-products.PRICE_RANGE
  - contract.CatalogItem
  imports:
  - import type { CatalogItem } from '@amazon-mvp/api-contract';
  description: |-
    Order related-product candidates by category distance, shared categories, stock and affinity, keeping one card per variant family, up to `limit`.
    Drop a candidate when any of these holds:
    - `item.active` is false.
    - `item.id === target.item.id`.
    - The target has a `facts.family` and the candidate has the same family.
    Affinity score:
    - `(sameBrand ? 4 : 0) + Math.min(3, sharedAttributes) + 3 * priceCloseness`.
    - `sameBrand`: the target's `facts.brand` is defined and equals the candidate's.
    - `sharedAttributes`: the number of candidate attributes whose `label` AND `value` equal one of the target's attributes.
    - `priceCloseness = 1 - Math.min(1, ratio / PRICE_RANGE)`, where `ratio = Math.abs(Math.log(Math.max(1, candidate.item.priceMinor) / Math.max(1, target.item.priceMinor)))`.
    Sort by these keys, in order:
    1. `distance` ascending.
    2. `sharedCategories` descending (missing counts as 1).
    3. In stock before sold out.
    4. Score descending.
    5. `facts.familyHead` true first.
    6. `item.name.localeCompare(other.item.name, 'pt-BR')`.
    Then walk the sorted list. The key is `facts.family ?? item.id`. Skip a candidate whose key or item id was already used; otherwise mark both as used and keep its `item`. Stop as soon as `limit` items are kept. Return the kept `CatalogItem`s.
    Effects: a family shows its best-ranked member (e.g. the one sharing the target's colour), else its head. Duplicates of one record keep only the closest one.
  tests:
  - tests/apps/storefront/test/related-products.rankRelated.unit.spec.ts
  max_output_tokens: 1024
