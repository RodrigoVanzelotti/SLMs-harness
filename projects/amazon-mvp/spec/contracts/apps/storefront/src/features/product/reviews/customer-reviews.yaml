  type: implement
  kind: function
  target: apps/storefront/src/features/product/reviews/customer-reviews.tsx::ReviewItem
  signature: |-
    export function ReviewItem({
      review,
      signedIn = false,
      loginHref = '/login',
    }: {
      review: CustomerReview;
      signedIn?: boolean;
      loginHref?: string;
    })
  uses:
