- id: sf.features.product.reviews.product-reviews.parseReviewQuery
  type: implement
  kind: function
  target: apps/storefront/src/features/product/reviews/product-reviews.ts::parseReviewQuery
  signature: |-
    export function parseReviewQuery(
      searchParams: Record<string, string | string[] | undefined> = {},
    ): ReviewQuery
  uses:
  - sf.features.product.reviews.product-reviews.ReviewQuery
  - contract.ReviewSort
  imports:
  - import 'server-only';
  - import { cookies } from 'next/headers';
  - import type { ReviewSort, RatingSummary, ReviewPage, ReviewViewerState, ReviewResponse, OwnReviewResponse, CatalogItem
    } from '@amazon-mvp/api-contract';
  - import { getConfig } from '@/config/storefront-config';
  - import { attachRatings, fetchRatingSummaries } from './ratings';
  description: |-
    Read the reviews sort, star filter and page from the product URL's search params; anything invalid falls back to the defaults.
    For an array value, use its first element.
    - `sort`: `'recent'` when `reviewSort` is exactly `recent`, else `'helpful'`.
    - `stars`: present only when `Number(reviewStars)` is an integer from 1 to 5. Omit the key otherwise.
    - `page`: `Number(reviewPage)` when it is an integer from 1 to 1000, else 1.
  examples:
  - 'parseReviewQuery({}) == { sort: "helpful", page: 1 }'
  - 'parseReviewQuery({ reviewSort: "recent", reviewStars: "4", reviewPage: "3" }) == { sort: "recent", stars: 4,
    page: 3 }'
  - 'parseReviewQuery({ reviewSort: "x", reviewStars: "9", reviewPage: "-1" }) == { sort: "helpful", page: 1 }'
  tests:
  - tests/apps/storefront/test/product-reviews.parseReviewQuery.unit.spec.ts
  max_output_tokens: 512
