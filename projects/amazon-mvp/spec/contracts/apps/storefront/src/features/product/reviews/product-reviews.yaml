- id: sf.features.product.reviews.product-reviews.productReviews
  type: implement
  kind: function
  target: apps/storefront/src/features/product/reviews/product-reviews.ts::productReviews
  signature: |-
    export async function productReviews(input: {
      productId: string;
      familyIds: string[];
      variantOptions?: Map<string, Array<{ name: string; value: string }>>;
      /** Catalog slug per family member, for the own review's edit link. */
      productSlugs?: Map<string, string>;
      query: ReviewQuery;
      signedIn: boolean;
    }): Promise<ProductReviews>
  uses:
  - sf.features.product.reviews.product-reviews.apiBase
  - contract.RatingSummary
  - sf.features.product.reviews.product-reviews.ProductReviews-type
  - sf.features.product.reviews.product-reviews.ReviewQuery
  - sf.features.product.reviews.product-reviews.REVIEWS_PAGE_SIZE
  - contract.ReviewPage
  - contract.ReviewViewerState
  - contract.ReviewResponse
  - sf.features.product.reviews.product-reviews.CustomerReview
  - sf.features.product.reviews.product-reviews.brasiliaDay
  - contract.RatingBucket
  - sf.features.product.reviews.product-reviews.ReviewMedia
  - contract.ReviewSort
  imports:
  - import 'server-only';
  - import { cookies } from 'next/headers';
  - import type { ReviewSort, RatingSummary, ReviewPage, ReviewViewerState, ReviewResponse, OwnReviewResponse, CatalogItem
    } from '@amazon-mvp/api-contract';
  - import { getConfig } from '@/config/storefront-config';
  - import { attachRatings, fetchRatingSummaries } from './ratings';
  - import type { RatingBucket } from '@amazon-mvp/api-contract';
  description: |-
    Load a product's reviews from the reviews API: summary, one page pooled across the variant family, and the viewer's own reviews and votes.
    - `ids = [...new Set([productId, ...familyIds])].join(',')`.
    - Make three GET requests in parallel (`Promise.all`) through a private helper. The helper calls `fetch(`${apiBase()}${path}`, { cache: 'no-store' })` and returns the parsed JSON when the response is ok. It returns `null` when the response is not ok or the fetch throws. With a session, it also sends `headers: { cookie: cookies().toString() }`. The requests:
      1. Summary: `/reviews/summary?productIds=${ids}`.
      2. List: `/reviews?${query}`, where `query` is `new URLSearchParams({ productIds: ids, sort, page: String(page), pageSize: String(REVIEWS_PAGE_SIZE) })`, plus `stars: String(stars)` when set, turned into a string with `.toString().replace(/%2C/g, ',')` so the URL contains `productIds=a,b`.
      3. Viewer: `/reviews/viewer?productIds=${ids}`, with the session cookie, only when `signedIn`. Otherwise it is `null`, with no request.
    - The viewer's `ownReviews` ids mark reviews as `own`, and its `helpfulReviewIds` mark them as `votedHelpful`.
    - Map each `ReviewResponse` to a `CustomerReview`:
      - `id`, `productId`, `rating`, `title`, `body`, `helpfulCount` unchanged.
      - `author`: `authorName`; `verified`: `verifiedPurchase`; `country`: `'Brasil'`.
      - `date`: `brasiliaDay.format(new Date(createdAt))` (`YYYY-MM-DD` in São Paulo).
      - `variant`: `variantOptions?.get(productId) ?? []`.
      - `own`, `votedHelpful`: as above.
      - Only for own reviews: `editHref` = `/products/${encodeURIComponent(slug)}/review` when `productSlugs` has a slug for that productId, else `undefined`.
    - Return a `ProductReviews`:
      - `summary`: `null` when the summary request failed, or `count` is 0, or `average` is null. Otherwise `{ average, count }`, plus `distribution: buckets.map(b => b.percent)` only when the API's `distribution` has exactly 5 buckets (5 stars first).
      - `media`: `[]`.
      - `reviews`: the mapped list items, or `[]`.
      - `total`: the list's `total`, or 0.
      - `pageSize`: `REVIEWS_PAGE_SIZE`.
      - `query`, `signedIn`: as received.
      - `hasOwnReview`: true only when an own review has `productId === input.productId` (not a sibling variant).
      - `unavailable`: true when the summary or the list request failed.
  tests:
  - tests/apps/storefront/test/product-reviews.productReviews.unit.spec.ts
  max_output_tokens: 1280
- id: sf.features.product.reviews.product-reviews.fetchOwnReview
  type: implement
  kind: function
  target: apps/storefront/src/features/product/reviews/product-reviews.ts::fetchOwnReview
  signature: |-
    export async function fetchOwnReview(
      productId: string,
    ): Promise<OwnReviewResponse | 'not-found' | 'signed-out' | null>
  uses:
  - contract.OwnReviewResponse
  - sf.features.product.reviews.product-reviews.apiBase
  - contract.ReviewResponse
  imports:
  - import 'server-only';
  - import { cookies } from 'next/headers';
  - import type { ReviewSort, RatingSummary, ReviewPage, ReviewViewerState, ReviewResponse, OwnReviewResponse, CatalogItem
    } from '@amazon-mvp/api-contract';
  - import { getConfig } from '@/config/storefront-config';
  - import { attachRatings, fetchRatingSummaries } from './ratings';
  description: |-
    Fetch the signed-in user's review of a product for the write-review page; it tells an unknown product, a lost session and an API failure apart.
    - `fetch(`${apiBase()}/reviews/mine?productId=${encodeURIComponent(productId)}`, { headers: { cookie: cookies().toString() }, cache: 'no-store' })`.
    - Status 404 → `'not-found'`.
    - Status 401 → `'signed-out'`.
    - Ok → the `OwnReviewResponse` JSON.
    - Any other status, or a thrown fetch → `null`.
  tests:
  - tests/apps/storefront/test/product-reviews.fetchOwnReview.unit.spec.ts
  max_output_tokens: 512
