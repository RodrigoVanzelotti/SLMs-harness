  description: |-
    "Fotos e vídeos de clientes" block: a rail of photo and video tiles that "Veja tudo" expands into a grid with playable videos.
    State: `expanded` (false).
    `<div className="az-pdp-media">` contains, in order:
    1. `<div className="az-pdp-media__header">`, with `<h3>Fotos e vídeos de clientes</h3>` and `<button type="button" aria-expanded={expanded}>`. The button text is `Mostrar menos` when expanded, else `Veja tudo ›`, and a click toggles `expanded`.
    2. When expanded: `<ul className="az-pdp-media__grid">` with one `<li key={id}>` per item. A video is `<video src={item.src} poster={item.poster} controls preload="none" aria-label={item.alt} />`; an image is `<Image src={item.src} alt={item.alt} width={200} height={200} />`.
    3. Collapsed: `<HorizontalRail label="Fotos e vídeos de clientes" className="az-pdp-media__rail">` with one tile per item. The tile is `<button type="button" className="az-pdp-media__tile">`, and a click expands. It has:
       - `aria-label`: `Vídeo: ${alt}` for videos, else `alt`.
       - `<Image src={item.kind === 'video' ? (item.poster ?? item.src) : item.src} alt="" width={140} height={140} />`.
       - For videos only: `<span className="az-pdp-media__play" aria-hidden="true">▶</span>`. When `durationSeconds` is defined, also `<span className="az-pdp-media__duration">{`${m}:${ss}`}</span>`, where `m = floor(s / 60)` and `ss = round(s % 60)` padded to 2 digits.
