  description: |-
    Next.js middleware that passes the request path to server components as the `x-pathname` request header.

    Copy the incoming headers (`new Headers(request.headers)`), set `x-pathname` to
    `request.nextUrl.pathname` (the path only, no query string), and return
    `NextResponse.next({ request: { headers } })`. Nothing else: no redirects and no response headers.
    The root layout reads this header to decide which routes render without the generic site chrome.
