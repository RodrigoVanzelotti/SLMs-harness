# Contracts for database/seeds/demo-reviews.ts. Generated by tools/planner; edit descriptions, examples and notes only.
units:
- id: db.seeds.demo-reviews.seedDemoReviews
  type: integrate
  kind: function
  target: database/seeds/demo-reviews.ts::seedDemoReviews
  signature: 'export async function seedDemoReviews(prisma: PrismaClient): Promise<{ baselines: number; texts: number;
    }>'
  imports:
  - import { PrismaClient } from '@prisma/client';
  - import products from '../../config/demo-products.json';
  - import content from '../../config/demo-product-content.json';
  - import reviews from '../../config/demo-reviews.json';
  description: |-
    Idempotently create demo rating aggregates and demo review texts for the demo products; returns `{ baselines, texts }` counts.
    1. For each `products` entry with a truthy `reviewCount`: `saved = await prisma.product.findUnique({ where: { slug: product.id } })`;
       skip unless found and `saved.sku === product.sku`. `extra` = the `content` entry with the same `id`
       and `sku`. `distribution` = `extra.ratingDistribution` when it has exactly 5 values, else `[]`.
       `prisma.reviewRatingBaseline.upsert({ where: { productId: saved.id }, update: {}, create: { productId: saved.id,
       listingKey: extra?.variant?.group ?? product.id, ratingCount: product.reviewCount,
       ratingSum: Math.round(product.rating * product.reviewCount), distribution } })`; `baselines++`.
    2. For each `reviews` entry `{ fixtureKey, productSlug, author, rating, title, body, date, helpfulCount }`:
       skip when no product has slug `productSlug`; else `prisma.review.upsert({ where: { fixtureKey }, update: {},
       create: { productId, userId: null, authorName: author, rating, title, body, verifiedPurchase: false,
       helpfulCount, source: 'DEMO', fixtureKey, createdAt: new Date(date + 'T12:00:00Z') } })`; `texts++`.
    Return `{ baselines, texts }`.
  max_output_tokens: 768
