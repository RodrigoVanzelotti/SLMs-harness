# Contracts for database/seeds/seed.ts. Generated by tools/planner; edit descriptions, examples and notes only.
units:
- id: db.seeds.seed
  type: integrate
  kind: file
  target: database/seeds/seed.ts
  uses:
  - db.seeds.demo-products.seedDemoProducts
  - db.seeds.demo-reviews.seedDemoReviews
  description: |-
    CLI script `database/seeds/seed.ts` (`pnpm seed`): upserts a few base development categories and products, then runs the demo seeds.
    Write the whole file. Imports: `PrismaClient` from `@prisma/client`, `seedDemoProducts` from
    `./demo-products`, `seedDemoReviews` from `./demo-reviews`. `const prisma = new PrismaClient()` at top level.
    Data, verbatim. Categories (slug, name): `electronics` `Electronics`; `books` `Books`; `home-kitchen` `Home & Kitchen`.
    Products (sku, slug, name, description, priceMinor, category slugs, stock quantity):
    - `ELEC-0001`, `usb-c-charger-65w`, `65W USB-C Charger`, `Compact GaN charger with two USB-C ports.`, 24990, [electronics], 120
    - `ELEC-0002`, `wireless-mouse-quiet`, `Quiet Wireless Mouse`, `Silent-click mouse with a 12-month battery.`, 13500, [electronics], 64
    - `BOOK-0001`, `designing-data-intensive-systems`, `Designing Data-Intensive Systems`, `Reference on storage, replication and consistency.`, 18900, [books], 30
    - `HOME-0001`, `pour-over-coffee-kettle`, `Pour-Over Coffee Kettle`, `Gooseneck kettle, 1L, variable temperature.`, 32900, [home-kitchen, electronics], 18
    `async function main()`, sequentially:
    1. Each category: `prisma.category.upsert({ where: { slug }, update: { name }, create: { slug, name } })`.
    2. Each product: `saved = prisma.product.upsert({ where: { sku }, update: data, create: data })` with
       `data = { sku, slug, name, description, priceMinor }`; `prisma.inventory.upsert({ where: { productId: saved.id },
       update: { quantity }, create: { productId: saved.id, quantity } })`; for each category slug,
       `prisma.category.findUniqueOrThrow({ where: { slug } })` and `prisma.productCategory.upsert({ where:
       { productId_categoryId: { productId, categoryId } }, update: {}, create: { productId, categoryId } })`.
    3. `await seedDemoProducts(prisma)`; `await seedDemoReviews(prisma)`.
    4. Count categories and products (`Promise.all`) and `` console.log(`seed complete: ${categoryCount} categories, ${productCount} products`) ``.
    `main().catch((error) => { console.error('seed failed:', error); process.exitCode = 1; }).finally(() => prisma.$disconnect())`.
  max_output_tokens: 1280
