- id: contract.installmentOptions
  type: implement
  kind: function
  target: packages/api-contract/src/index.ts::installmentOptions
  signature: |-
    export function installmentOptions(
      totalMinor: number,
      pricing: Pick<CheckoutPricing, 'maxInstallments' | 'minInstallmentMinor'>,
    ): InstallmentOption[]
  uses:
  - contract.CheckoutPricing
  - contract.InstallmentOption
  description: |-
    Interest-free card plans for a total: 1x always, then more installments while each one stays at or above `minInstallmentMinor`.
    For `count` from 1 to `Math.max(1, maxInstallments)`: `installmentMinor = Math.floor(totalMinor / count)`;
    at the first `count > 1` with `installmentMinor < minInstallmentMinor` stop (no later counts);
    otherwise push `{ count, installmentMinor, firstInstallmentMinor: totalMinor - installmentMinor * (count - 1) }`.
    The first installment carries the remainder, so the installments add up to the total exactly.
  examples:
  - 'installmentOptions(10000, { maxInstallments: 10, minInstallmentMinor: 500 })[2] == { count: 3, installmentMinor:
    3333, firstInstallmentMinor: 3334 }'
  - 'installmentOptions(1999, { maxInstallments: 10, minInstallmentMinor: 500 }).map((o) => o.count) == [1, 2, 3]'
  - 'installmentOptions(499, { maxInstallments: 10, minInstallmentMinor: 500 }) == [{ count: 1, installmentMinor:
    499, firstInstallmentMinor: 499 }]'
  tests:
  - tests/apps/api/src/modules/orders/checkout-quote.installmentOptions.unit.spec.ts
  max_output_tokens: 512
