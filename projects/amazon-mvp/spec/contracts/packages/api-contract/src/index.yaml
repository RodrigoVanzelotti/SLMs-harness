- id: contract.percentDiscountMinor
  type: implement
  kind: function
  target: packages/api-contract/src/index.ts::percentDiscountMinor
  signature: 'export function percentDiscountMinor(amountMinor: number, percent: number): number'
  description: |-
    The one rounding rule for percentage discounts: `floor(amountMinor * percent / 100)` in exact integer math, with input checks.
    Throws `RangeError` (exact messages):
    - `amountMinor` not a safe integer (NaN, 1.5) or negative → `'amountMinor must be a non-negative safe integer'`;
    - `percent` not an integer or outside 0..100 → `'percent must be a whole number between 0 and 100'`;
    - `amountMinor * percent` not a safe integer → `'amountMinor is too large'`.
    Compute `scaled = amountMinor * percent` and return `(scaled - (scaled % 100)) / 100` (no float division
    of the result).
  examples:
  - percentDiscountMinor(19, 5) == 0
  - percentDiscountMinor(20, 5) == 1
  - percentDiscountMinor(2147483647, 5) == 107374182
  tests:
  - tests/apps/api/src/modules/orders/checkout-quote.percentDiscountMinor.unit.spec.ts
  max_output_tokens: 512
