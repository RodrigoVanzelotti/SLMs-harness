- id: contract.isApiErrorBody
  type: implement
  kind: function
  target: packages/api-contract/src/index.ts::isApiErrorBody
  signature: 'export function isApiErrorBody(value: unknown): value is ApiErrorBody'
  uses:
  - contract.ApiErrorBody
  - contract.ErrorCode
  description: |-
    Type guard for the API error envelope: true when `value` is a non-null object whose `error` is a non-null object with a string `code`.
    Nothing else is checked (`message` and `requestId` may be missing). Arrays, `null`, primitives,
    `{ error: null }` and `{ error: 'text' }` are false.
  examples:
  - 'isApiErrorBody({ error: { code: ''RESOURCE_NOT_FOUND'', message: ''Order not found'', requestId: ''r'' } })
    == true'
  - 'isApiErrorBody({ error: { code: 404 } }) == false'
  - isApiErrorBody(null) == false
  tests:
  - tests/apps/storefront/test/api-contract.isApiErrorBody.new.spec.ts
  max_output_tokens: 512
