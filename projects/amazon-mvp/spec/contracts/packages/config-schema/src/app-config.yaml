- id: config.app-config.ApiConfigSchema
  type: provided
  kind: declaration
  target: packages/config-schema/src/app-config.ts::ApiConfigSchema
  signature: |-
    export const ApiConfigSchema = z.object({
      app: z.object({
        name: z.string().min(1),
        environment: z.enum(['local', 'development', 'production', 'test']),
        port: z.number().int().min(1).max(65535),
        logLevel: LogLevelSchema,
      }),
      database: z.object({
        url: z.string().min(1, 'database.url is required (set DATABASE_URL)'),
      }),
      session: z.object({
        cookieName: z.string().min(1),
        ttlHours: z.number().int().positive(),
        secureCookie: z.boolean(),
        sameSite: z.enum(['lax', 'strict', 'none']),
      }),
      openapi: z.object({
        enabled: z.boolean(),
        path: z.string().startsWith('/'),
      }),
      /**
       * Checkout pricing rules. The API is their only owner: the storefront reads them
       * through GET /api/v1/orders/pricing, never from this file.
       */
      checkout: z
        .object({
          /** "X% de desconto à vista no Pix". Whole percent so money math stays integer. */
          pixDiscountPercent: z.number().int().min(0).max(100).default(5),
          /** Interest-free card installments ("em até 10x sem juros"). 1 disables them. */
          maxInstallments: z.number().int().min(1).max(24).default(10),
          /** Smallest installment in minor units (R$ 5,00), so small totals get fewer plans. */
          minInstallmentMinor: z.number().int().min(1).default(500),
        })
        .default({}),
    });
