- id: config.features.FeatureConfigSchema
  type: provided
  kind: declaration
  target: packages/config-schema/src/features.ts::FeatureConfigSchema
  signature: |-
    export const FeatureConfigSchema = z
      .object({
        features: z.record(z.string().min(1), FeatureSchema),
        routes: z.record(z.string().min(1), RouteBindingSchema).default({}),
      })
      .superRefine((config, ctx) => {
        // Fail fast on routes pointing at features that do not exist. Without this
        // check a typo silently degrades to "feature missing => treated as off".
        for (const [routeKey, binding] of Object.entries(config.routes)) {
          if (!config.features[binding.feature]) {
            ctx.addIssue({
              code: z.ZodIssueCode.custom,
              path: ['routes', routeKey, 'feature'],
              message: `Route "${routeKey}" references unknown feature "${binding.feature}"`,
            });
          }
        }
      });
  uses:
  - config.features.FeatureSchema
  - config.features.RouteBindingSchema
  imports:
  - import { z } from 'zod';
  description: |-
    Zod schema for `config/features.yaml`: a `features` map of flags and a `routes` map binding route keys to features, rejecting bindings to unknown features.
    Declare it as `z.object({ features: z.record(z.string().min(1), FeatureSchema),
    routes: z.record(z.string().min(1), RouteBindingSchema).default({}) }).superRefine((config, ctx) => ...)`.
    In the refinement, for every `[routeKey, binding]` of `config.routes` whose `binding.feature` is not a
    key of `config.features`, call `ctx.addIssue({ code: z.ZodIssueCode.custom, path: ['routes', routeKey, 'feature'], message })`
    with `` message = `Route "${routeKey}" references unknown feature "${binding.feature}"` ``.
  code: |-
    export const FeatureConfigSchema = z
      .object({
        features: z.record(z.string().min(1), FeatureSchema),
        routes: z.record(z.string().min(1), RouteBindingSchema).default({}),
      })
      .superRefine((config, ctx) => {
        // Fail fast on routes pointing at features that do not exist. Without this
        // check a typo silently degrades to "feature missing => treated as off".
        for (const [routeKey, binding] of Object.entries(config.routes)) {
          if (!config.features[binding.feature]) {
            ctx.addIssue({
              code: z.ZodIssueCode.custom,
              path: ['routes', routeKey, 'feature'],
              message: `Route "${routeKey}" references unknown feature "${binding.feature}"`,
            });
          }
        }
      });
