- id: config.loader.applyEnvOverrides
  type: implement
  kind: function
  target: packages/config-schema/src/loader.ts::applyEnvOverrides
  signature: |-
    export function applyEnvOverrides(
      base: Plain,
      envMap: EnvMap,
      env: NodeJS.ProcessEnv = process.env,
    ): Plain
  uses:
  - config.loader.Plain
  - config.loader.EnvMap
  - config.loader.isPlainObject
  imports:
  - import { existsSync, readFileSync } from 'node:fs';
  - import { join } from 'node:path';
  - import { parse as parseYaml } from 'yaml';
  - import { z } from 'zod';
  description: |-
    Return a deep copy of `base` (`structuredClone`) with environment values written at the dotted paths of `envMap`, coerced to booleans or numbers.
    For each `[path, envVar]` of `envMap`: `raw = env[envVar]`; skip when undefined or `''`. Walk the
    path segments, replacing any missing or non-object intermediate with `{}`, and set the last segment
    to the coerced value: `'true'` → `true`, `'false'` → `false`, a string for which
    `Number(raw)` is not NaN → that number (`'8080'` → 8080, `'2.5'` → 2.5), anything else the string
    itself (`'five'`). `base` is not mutated.
  examples:
  - 'applyEnvOverrides({ app: { port: 3000, logLevel: ''info'' }, openapi: { enabled: true } }, { ''app.port'':
    ''PORT'', ''openapi.enabled'': ''OPENAPI_ENABLED'' }, { PORT: ''8080'', OPENAPI_ENABLED: ''false'' }) == { app:
    { port: 8080, logLevel: ''info'' }, openapi: { enabled: false } }'
  - 'applyEnvOverrides({ app: { port: 3000 } }, { ''app.port'': ''PORT'' }, { PORT: '''' }) == { app: { port: 3000
    } }'
  tests:
  - tests/packages/config-schema/src/config.applyEnvOverrides.unit.spec.ts
  max_output_tokens: 512
