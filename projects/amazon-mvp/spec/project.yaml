# Spec bundle for a clean-room rebuild of github.com/Alles725/amazon (commit 44e776b).
# Contracts are generated by tools/planner/; milestones below are regenerated too.
# Edit name/digest/imports here; see docs/plan.md for how the cut was made.
name: amazon-mvp
language: typescript
digest: 'A simplified e-commerce MVP whose storefront text is Brazilian Portuguese: a NestJS REST API (auth, users,
  catalog, cart, orders, reviews, lists) on PostgreSQL via Prisma, and a Next.js App Router storefront, in a pnpm
  TypeScript monorepo. Money is integer minor units (centavos).'
conventions: conventions.md
tests_in_workspace: true
allow_stdlib: true
packages:
- '@amazon-mvp/api-contract'
- '@amazon-mvp/config-schema'
- '@amazon-mvp/database'
- '@/'
allowed_imports:
- '@nestjs/common'
- '@nestjs/core'
- '@nestjs/swagger'
- '@node-rs/argon2'
- '@prisma/client'
- class-transformer
- class-validator
- cookie-parser
- express
- next
- react
- reflect-metadata
- server-only
- yaml
- zod
