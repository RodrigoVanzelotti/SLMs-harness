# Descriptions for the Next.js route files under apps/storefront/src/app (group sf-app).
# Route keys and their features come from config/features.yaml; FeatureRoute shows
# Coming Soon (h1 = its `title`) or 404s when the bound feature is off.

# ---------------------------------------------------------------------------
# Corporate footer pages (features/corporate). Tests import each page module and
# render the default export synchronously, and call generateMetadata() directly.
# ---------------------------------------------------------------------------

sf.app.about.page.generateMetadata:
  description: |
    Metadata for `/about`: return `corporateMetadata('about')`.
    Synchronous, no arguments. The helper returns `{}` while the page's flag is off.

sf.app.about.page.AboutPage:
  description: |
    Route `/about`: renders the "Sobre a Amazon" corporate page through `CorporatePageShell`, behind route key `about`.
    Return `<CorporatePageShell pageKey="about" />` wrapped in `FeatureRoute` with `routeKey="about"` and `title="Sobre a Amazon"`.
    The shell brings the Amazon header, the page body and the footer. When the `about` feature is off, `FeatureRoute` shows Coming Soon with that title as its `h1`.
    This is a plain synchronous component with no props and no data loading, because tests render it directly.

