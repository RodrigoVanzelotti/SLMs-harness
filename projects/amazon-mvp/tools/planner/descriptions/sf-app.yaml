# ---------------------------------------------------------------------------
# Account area ("Sua conta") destinations (features/account).
# ---------------------------------------------------------------------------

sf.app.account.page.AccountPage:
  description: |
    Route `/account` ("Sua conta"): the signed-in hub, with one link card per account area. Guests are redirected to `/login`.
    It is not wrapped in `FeatureRoute`, because the hub belongs to the always-on authentication slice.
    - `session = await getServerSession()`. When it is null, `redirect('/login')`.
    - Markup: `<div className="amazon-account-page">` containing `<AmazonHeader />` (no props), `<main className="az-account-main">` and `<AmazonFooter />`.
    - Inside main: `<h1 className="az-account-main__title">Sua conta</h1>`, then `<div className="az-account-grid">` with one entry per item of the provided `CARDS` array, in array order.
    - Each entry is a `Link` with key = title, `href` = the card's href and `className="az-account-card"`. It contains `<span className="az-account-card__icon"><AccountIcon type={icon} /></span>`, followed by a plain `<span>` holding `<span className="az-account-card__title">{title}</span>` and `<span className="az-account-card__desc">{description}</span>`.

sf.app.addresses.page.AddressesPage:
  description: |
    Route `/addresses` ("Seus endereços"): the signed-in address book, where `?add=1` opens the new-address form straight away.
    - `adding` is true only when `searchParams[ADD_ADDRESS_PARAM] === '1'`, so an array value or any other string means false.
    - Return `FeatureRoute` with `routeKey="addresses"` and `title="Seus endereços"`. Its only child is a separate async server component that you write in this file and give `adding`. This keeps the session and address lookups from running when the route is disabled.
    That component does this:
    1. `session = await requireAccountSession(adding ? ADD_ADDRESS_HREF : '/addresses')`. Guests go to login and come back to that path.
    2. `addresses = await fetchAddresses()`.
    3. It renders `AccountShell` with `title="Seus endereços"` and `wide`. Inside the shell:
       - When `addresses` is non-null, `<AddressesManager initial={addresses} name={session.user.displayName} startAdding={adding} />`.
       - When it is null, `<p className="az-acct-error" role="alert">Não foi possível carregar seus endereços agora. Tente novamente em instantes.</p>`.

sf.app.lists.page.ListsPage:
  description: |
    Route `/lists` ("Suas listas"): the signed-in shopping and wish lists, showing the list chosen by `?list=<id>`, or the first list.
    Return `FeatureRoute` with `routeKey="lists"` and `title="Suas listas"`. Its only child is a separate async server component that you write in this file and give `searchParams`. That component does this:
    1. `requested` = `searchParams.list` when it is a string, else undefined.
    2. `await requireAccountSession(requested ? listHref(requested) : '/lists')`.
    3. `lists = await fetchLists()`. The API also creates the default list on the first visit.
    4. `selectedId = requested ?? lists?.[0]?.id`.
    5. `selected = lists && selectedId ? await fetchList(selectedId) : null`.
    6. When `selected === 'not-found'` (the list was deleted or belongs to someone else), `redirect('/lists')`.
    7. It renders `AccountShell` with `title="Suas listas"` and `wide`. Inside the shell:
       - When both `lists` and `selected` are present, `<ListsView key={selected.id} lists={lists} initial={selected} />`.
       - Otherwise `<p className="az-acct-error" role="alert">Não foi possível carregar suas listas agora. Tente novamente em instantes.</p>`.

sf.app.security.page.SecurityPage:
  description: |
    Route `/security` ("Acesso e segurança"): the signed-in profile, e-mail and password settings, with a "Concluído" link back to the account hub.
    Return `FeatureRoute` with `routeKey="security"` and `title="Acesso e segurança"`. Its only child is a separate async server component that you write in this file. That component does this:
    1. `session = await requireAccountSession('/security')`.
    2. It renders `AccountShell` with `title="Acesso e segurança"`, containing `<SecuritySettings user={session.user} />` and then `<Link href="/account" className="az-acct-button az-acct-button--primary az-acct-done">Concluído</Link>`.

sf.app.gift-cards.page.GiftCardsPage:
  description: |
    Route `/gift-cards` ("Vales-presente"): an informational account page with empty panels, because the store has no gift cards.
    Return `FeatureRoute` with `routeKey="giftCards"` and `title="Vales-presente"`. Its only child is a separate async server component that you write in this file, so the session check runs only when the route is enabled. That component does this:
    1. `await requireAccountSession('/gift-cards')`.
    2. It renders `AccountShell` with `title="Vales-presente"`, containing in order:
       - `AcademicNotice` with two paragraphs: `<p><strong>Vales-presente não estão disponíveis nesta loja acadêmica.</strong></p>` and `<p>Não é possível comprar, resgatar ou usar códigos de vale-presente aqui. Por isso esta página não oferece campo de resgate nem exibe saldo.</p>`.
       - `EmptyPanel` with heading `Saldo do vale-presente` and message `Você não tem vales-presente.`
       - `EmptyPanel` with heading `Resgatar um vale-presente` and message `O resgate de códigos não está disponível.` Its child is `<p className="az-acct-muted">Nenhum código pode ser aplicado à sua conta nesta loja.</p>`.
       - `EmptyPanel` with heading `Atividade do vale-presente` and message `Nenhuma atividade de vale-presente.`

sf.app.messages.page.MessagesPage:
  description: |
    Route `/messages` ("Suas mensagens"): an informational account page whose three mailboxes are empty, because the store sends no messages.
    Return `FeatureRoute` with `routeKey="messages"` and `title="Suas mensagens"`. Its only child is a separate async server component that you write in this file. That component does this:
    1. `await requireAccountSession('/messages')`.
    2. It renders `AccountShell` with `title="Suas mensagens"`, containing in order:
       - `AcademicNotice` with two paragraphs. The first is `<p><strong>A central de mensagens não está disponível nesta loja acadêmica.</strong></p>`. The second is `<p>` with `Esta loja não envia notificações nem tem troca de mensagens com vendedores ou compradores. O andamento de cada compra aparece em `, then `<Link href="/orders">Seus pedidos</Link>`, then `.`.
       - Three `EmptyPanel`s, each with the message `Nenhuma mensagem.` Their headings are `Mensagens da Amazon`, `Mensagens de vendedores` and `Mensagens de compradores`, in that order.

sf.app.prime.page.PrimePage:
  description: |
    Route `/prime` ("Sua assinatura Prime"): an informational account page with empty panels, because the store sells no memberships.
    Return `FeatureRoute` with `routeKey="prime"` and `title="Sua assinatura Prime"`. Its only child is a separate async server component that you write in this file. That component does this:
    1. `await requireAccountSession('/prime')`.
    2. It renders `AccountShell` with `title="Sua assinatura Prime"`, containing in order:
       - `AcademicNotice` with two paragraphs: `<p><strong>O Amazon Prime não está disponível nesta loja acadêmica.</strong></p>` and `<p>Aqui não é possível assinar, renovar ou cancelar o Prime, e nenhuma cobrança de assinatura é feita. Frete e prazos exibidos nos pedidos seguem as regras do checkout acadêmico.</p>`.
       - `EmptyPanel` with heading `Sua assinatura` and message `Você não é membro Prime.` Its child is `<p className="az-acct-muted">Não há plano, data de renovação ou forma de pagamento associados.</p>`.
       - `EmptyPanel` with heading `Benefícios Prime` and message `Nenhum benefício Prime está ativo na sua conta.`
       - `EmptyPanel` with heading `Configurações de pagamento da assinatura` and message `Nenhuma forma de pagamento está vinculada a uma assinatura.` Its child is `<p className="az-acct-muted">` with `Consulte o que você já comprou em `, then `<Link href="/orders">Seus pedidos</Link>`, then `.`.

sf.app.refunds.page.RefundsPage:
  description: |
    Route `/refunds` ("Reembolsos Boleto/Pix"): an informational account page with empty panels, because simulated payments are never refunded.
    Return `FeatureRoute` with `routeKey="refunds"` and `title="Reembolsos Boleto/Pix"`. Its only child is a separate async server component that you write in this file. That component does this:
    1. `await requireAccountSession('/refunds')`.
    2. It renders `AccountShell` with `title="Reembolsos Boleto/Pix"`, containing in order:
       - `AcademicNotice` with two paragraphs: `<p><strong>Reembolsos não são processados nesta loja acadêmica.</strong></p>` and `<p>Os pagamentos do checkout (cartão ou Pix) são simulados: nenhum dinheiro é cobrado e, por isso, nenhum valor é devolvido. Boleto não é oferecido.</p>`.
       - `EmptyPanel` with heading `Saldo de reembolsos` and message `Você não tem reembolsos de Boleto ou Pix.`
       - `EmptyPanel` with heading `Histórico de reembolsos` and message `Nenhum reembolso foi solicitado.` Its child is `<p className="az-acct-muted">` with `Para ver o que você comprou, acesse `, then `<Link href="/orders">Seus pedidos</Link>`, then `.`.

sf.app.subscribe-and-save.page.SubscribeAndSavePage:
  description: |
    Route `/subscribe-and-save` ("Programe e Poupe"): an informational account page with empty panels, because there are no recurring deliveries.
    Return `FeatureRoute` with `routeKey="subscribeAndSave"` and `title="Programe e Poupe"`. Its only child is a separate async server component that you write in this file. That component does this:
