sf.app.payment-methods.page.PaymentMethodsPage:
  description: |
    Route `/payment-methods`: the "Meios de pagamento" help article, with the visitor's recent payment transactions filled into its `transactions` slot.
    Return `FeatureRoute` with `routeKey="paymentMethods"` and `title="Meios de pagamento"`. Its only child is a separate async server component that you write in this file, so the lookups run only when the route is enabled. That component does this:
    1. `session = await getServerSession()`.
    2. `orders = session ? await fetchOrders() : null`.
    3. It renders `CustomerPageLayout` with `page={CUSTOMER_PAGES.paymentMethods}` and `slots={{ transactions: <PaymentTransactions signedIn={Boolean(session)} orders={orders} /> }}`.
    Guests are not redirected. The provided `metadata` export already calls `customerPageMetadata('paymentMethods')`.
    Write the attribute literally as `routeKey="paymentMethods"`, because a test searches the page source for that exact text.

