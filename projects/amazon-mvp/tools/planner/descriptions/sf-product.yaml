    "Da marca" section: a horizontal rail with the brand banner, logo and story, followed by cards of the brand's other products.
    `<section className="az-pdp-section" id="brand-story" aria-labelledby="brand-story-title">` contains, in order:
    1. `<h2 id="brand-story-title">Da marca</h2>`.
    2. When `listingHref`: `<p className="az-pdp-brand-listing"><Link href={listingHref}>Ver todos os produtos da marca {story.name}</Link></p>`.
    3. `<div className="az-pdp-brand-story">`, wrapping `<HorizontalRail label={`Conteúdo da marca ${story.name}`} className="az-pdp-brand-rail">` with:
       - When `story.banner`: `<div className="az-pdp-brand-card az-pdp-brand-card--banner">` with `<Image src={story.banner.src} alt={story.banner.alt} width={1464} height={625} sizes="(max-width: 600px) 90vw, 700px" />`.
       - `<div className="az-pdp-brand-card az-pdp-brand-card--story">`: when `story.logo`, `<Image src={story.logo.src} alt={story.logo.alt} width={315} height={145} />`; then one `<p key={paragraph}>` per entry of `story.story`.
       - One card per entry of `products`: `<Link key={product.id} href={`/products/${encodeURIComponent(product.slug)}`} className="az-pdp-brand-card az-pdp-brand-card--product" title={product.name}>`. It holds, when `image`, `<Image src={image.src} alt={image.alt} width={260} height={260} />`, then `<span>{product.name}</span>`.

# ---------------------------------------------------------------- prime-payment-notice.tsx

sf.features.product.prime-payment-notice.PrimePaymentNotice:
  description: |
    Simulated "Prime paused" banner for a signed-in user. It can be dismissed per user, and its dialog lists the saved cards and adds a valid one with `CardForm`.
    Hooks: `useRouter()`, and state `hidden` (false) and `editing` (false). After the hooks, when `hidden`, render `null`.
    Banner elements, in order, inside `<section className="az-pdp-alert" aria-labelledby="prime-alert-title">`:
    1. A `<div>` with:
       - `<h2 id="prime-alert-title">`, holding `<span className="az-pdp-alert__icon" aria-hidden="true">!</span>` and the text `Sua assinatura Prime está pausada devido a um problema no meio de pagamento`.
       - `<p>Adicione um meio de pagamento válido para assinar o Amazon Prime novamente e recuperar o acesso aos seus benefícios.</p>`.
    2. `<button type="button" className="az-pdp-pill">Atualizar meio de pagamento</button>`. It sets `editing`.
    3. `<button type="button" className="az-pdp-alert__close" aria-label="Dispensar aviso">×</button>`. It sets `document.cookie = `${PRIME_NOTICE_COOKIE}=${encodeURIComponent(userId)}; Max-Age=${ONE_YEAR}; Path=/; SameSite=Lax``, then sets `hidden`.
    4. When `editing`: the dialog below.
    Dialog (a private component in this file):
    - Props:
      - `userName`.
      - `onClose`: clears `editing`.
      - `onValidCard`: clears `editing`, sets `hidden`, then calls `router.refresh()`.
    - State: `cards: SavedPaymentCard[] | null` (null while loading), `error` (''), `removing` ('' or a card id).
    - Effects on mount:
      - Remember `document.activeElement` and focus the close button.
      - Add a `document` `keydown` listener: `Escape` calls the latest `onClose`.
      - Set `document.body.style.overflow = 'hidden'`.
      - On unmount, undo the listener and the overflow (`''`) and refocus the remembered element.
    - Load the cards on mount with `checkoutClient.cards()` → `setCards`. On failure, `setCards([])` and set `error` to `Não foi possível carregar seus cartões salvos.`. Ignore results that arrive after unmount.
    - Markup: `<div className="az-pdp-viewer" role="presentation" onClick={onClose}>` wraps `<div className="az-prime-card-dialog" role="dialog" aria-modal="true" aria-labelledby="prime-card-title">`. A click on the inner div stops propagation. It contains, in order:
      1. `<button type="button" className="az-pdp-viewer__close" aria-label="Fechar">×</button>`, which calls `onClose`.
      2. `<h2 id="prime-card-title">Atualizar meio de pagamento</h2>`.
      3. When `error`: `<p className="az-checkout-error" role="alert">{error}</p>`.
      4. While `cards === null`: `<p className="az-checkout-muted">Carregando seus cartões…</p>`. Otherwise:
         - When there are cards: `<ul className="az-prime-card-list" aria-label="Cartões salvos">`, one `<li key={id}>` per card. The `li` has className `az-checkout-card-expired` when `isCardExpired(card)`. It contains:
           - `<span>{cardLabel(card)} · {holderName} · {status}</span>`, where `status` is `Vencido` or `Validade ${String(card.expMonth).padStart(2, '0')}/${card.expYear}`.
           - Only for expired cards: `<button type="button" className="az-checkout-link" aria-label={`Remover ${cardLabel(card)}`} disabled={removing === card.id}>Remover</button>`. Click: set `removing` and clear `error`, then `setCards(await checkoutClient.deleteCard(card.id))` (it resolves to the remaining cards). On failure, show the Error's `message`, else `Não foi possível remover o cartão.`. Finally clear `removing`.
         - When `cards.length < MAX_SAVED_CARDS`: `<CardForm name={userName} onCancel={onClose} onSave={…} />`. `CardForm` saves the card itself. In `onSave`, an expired card is appended to `cards`; a valid one calls `onValidCard()`.
         - Otherwise: `<p className="az-checkout-muted">Você atingiu o limite de {MAX_SAVED_CARDS} cartões salvos. Remova um cartão vencido para adicionar outro.</p>`.

# ---------------------------------------------------------------- reviews/ratings.ts

sf.features.product.reviews.ratings.attachRatings:
  description: |
    Add `rating: { average, count }` from the reviews API summaries to the catalog records that have one. The other records come back unchanged, without a `rating` key.
    - A summary counts only when `count > 0` and `average !== null`. Match it to an item by `productId === item.id`.
    - Keep the order and length of `items`. Return `{ ...item, rating }` for rated items and the item itself otherwise. Never mutate the input.
    - Summaries for unknown ids are ignored.

sf.features.product.reviews.ratings.fetchRatingSummaries:
  description: |
    Fetch per-product rating summaries from `endpoint` in batches of `REVIEW_LIMITS.summariesMax`; a failing batch counts as "no ratings".
    - Remove duplicate ids (keep the first-seen order) and split them into chunks of `REVIEW_LIMITS.summariesMax` (48).
    - Request all chunks in parallel: `fetch(`${endpoint}?productIds=${chunk.join(',')}`, { cache: 'no-store' })`. The ids are joined by literal commas, not encoded.
    - Ok → the `items` of the `ProductRatingSummaries` body. Non-ok or thrown → `[]`.
    - Return everything flattened in chunk order. No ids → no request, `[]`.

# ---------------------------------------------------------------- reviews/product-reviews.ts

sf.features.product.reviews.product-reviews.apiBase:
  description: |
    Base URL of the API for server-side reviews requests, e.g. `http://api/api/v1`.
    Read `getConfig().api` and return `${api.internalBaseUrl}${api.publicBasePath}`.

sf.features.product.reviews.product-reviews.parseReviewQuery:
  description: |
    Read the reviews sort, star filter and page from the product URL's search params; anything invalid falls back to the defaults.
    For an array value, use its first element.
    - `sort`: `'recent'` when `reviewSort` is exactly `recent`, else `'helpful'`.
    - `stars`: present only when `Number(reviewStars)` is an integer from 1 to 5. Omit the key otherwise.
    - `page`: `Number(reviewPage)` when it is an integer from 1 to 1000, else 1.
  examples:
    - 'parseReviewQuery({}) == { sort: "helpful", page: 1 }'
    - 'parseReviewQuery({ reviewSort: "recent", reviewStars: "4", reviewPage: "3" }) == { sort: "recent", stars: 4, page: 3 }'
    - 'parseReviewQuery({ reviewSort: "x", reviewStars: "9", reviewPage: "-1" }) == { sort: "helpful", page: 1 }'

sf.features.product.reviews.product-reviews.productReviews:
  description: |
    Load a product's reviews from the reviews API: summary, one page pooled across the variant family, and the viewer's own reviews and votes.
    - `ids = [...new Set([productId, ...familyIds])].join(',')`.
    - Make three GET requests in parallel (`Promise.all`) through a private helper. The helper calls `fetch(`${apiBase()}${path}`, { cache: 'no-store' })` and returns the parsed JSON when the response is ok. It returns `null` when the response is not ok or the fetch throws. With a session, it also sends `headers: { cookie: cookies().toString() }`. The requests:
      1. Summary: `/reviews/summary?productIds=${ids}`.
      2. List: `/reviews?${query}`, where `query` is `new URLSearchParams({ productIds: ids, sort, page: String(page), pageSize: String(REVIEWS_PAGE_SIZE) })`, plus `stars: String(stars)` when set, turned into a string with `.toString().replace(/%2C/g, ',')` so the URL contains `productIds=a,b`.
      3. Viewer: `/reviews/viewer?productIds=${ids}`, with the session cookie, only when `signedIn`. Otherwise it is `null`, with no request.
    - The viewer's `ownReviews` ids mark reviews as `own`, and its `helpfulReviewIds` mark them as `votedHelpful`.
    - Map each `ReviewResponse` to a `CustomerReview`:
      - `id`, `productId`, `rating`, `title`, `body`, `helpfulCount` unchanged.
      - `author`: `authorName`; `verified`: `verifiedPurchase`; `country`: `'Brasil'`.
      - `date`: `brasiliaDay.format(new Date(createdAt))` (`YYYY-MM-DD` in São Paulo).
      - `variant`: `variantOptions?.get(productId) ?? []`.
      - `own`, `votedHelpful`: as above.
      - Only for own reviews: `editHref` = `/products/${encodeURIComponent(slug)}/review` when `productSlugs` has a slug for that productId, else `undefined`.
    - Return a `ProductReviews`:
      - `summary`: `null` when the summary request failed, or `count` is 0, or `average` is null. Otherwise `{ average, count }`, plus `distribution: buckets.map(b => b.percent)` only when the API's `distribution` has exactly 5 buckets (5 stars first).
      - `media`: `[]`.
      - `reviews`: the mapped list items, or `[]`.
      - `total`: the list's `total`, or 0.
      - `pageSize`: `REVIEWS_PAGE_SIZE`.
      - `query`, `signedIn`: as received.
      - `hasOwnReview`: true only when an own review has `productId === input.productId` (not a sibling variant).
      - `unavailable`: true when the summary or the list request failed.

sf.features.product.reviews.product-reviews.fetchOwnReview:
  description: |
    Fetch the signed-in user's review of a product for the write-review page; it tells an unknown product, a lost session and an API failure apart.
    - `fetch(`${apiBase()}/reviews/mine?productId=${encodeURIComponent(productId)}`, { headers: { cookie: cookies().toString() }, cache: 'no-store' })`.
    - Status 404 → `'not-found'`.
    - Status 401 → `'signed-out'`.
    - Ok → the `OwnReviewResponse` JSON.
    - Any other status, or a thrown fetch → `null`.

sf.features.product.reviews.product-reviews.withRatings:
  description: |
    Attach each catalog record's rating from the reviews API, for product cards; a record without ratings, or a failed request, leaves it bare.
    - An empty `items` → return it as is, with no request.
    - Otherwise return `attachRatings(items, await fetchRatingSummaries(items.map((item) => item.id), `${apiBase()}/reviews/summaries`))`.

# ---------------------------------------------------------------- reviews/customer-reviews.tsx

sf.features.product.reviews.customer-reviews.CustomerReviews:
  description: |
    Product page reviews section: summary and histogram, the write/edit call to action, sort and star-filter links, the review list and pagination.
    Write two private helpers:
    - `starLabel(n) = STAR_LABELS[5 - n]`.
    - `href(q)`: build `URLSearchParams` in this order. Add `reviewSort` = `recent` only when `q.sort === 'recent'`, `reviewStars` = `String(q.stars)` when set, and `reviewPage` = `String(q.page)` only when `q.page > 1`. Return `${productPath}?${params}#customer-reviews`, or `${productPath}#customer-reviews` when the params are empty. Example: the next-page link for `{ sort: 'recent', stars: 4, page: 2 }` and `/products/p6` is `/products/p6?reviewSort=recent&reviewStars=4&reviewPage=3#customer-reviews`.
    `link(change) = href({ sort: query.sort, stars: query.stars, ...change })`: the current sort and stars are kept, and the page is kept only when `change` sets it. `pages = max(1, ceil(total / pageSize))`.
    `<section className="az-pdp-section az-pdp-reviews" id="customer-reviews" aria-labelledby="customer-reviews-title">`:
    A. `<div className="az-pdp-reviews__summary">`, containing:
    1. `<h2 id="customer-reviews-title">Avaliações de clientes</h2>`.
    2. When `notice`: `<p className="az-review-notice" role="status">`, with `Obrigado! Sua avaliação foi publicada.` for `published` and `Sua avaliação foi atualizada.` for `updated`.
    3. When there is a summary:
       - `<p className="az-pdp-reviews__average"><ProductStars rating={average} className="az-pdp-stars--large" /><span>{formatRating(average)} de 5</span></p>`.
       - `<p className="az-pdp-muted">{count.toLocaleString('pt-BR')} avaliações globais</p>` (`avaliação global` when the count is 1).
       - When `distribution`: `<table className="az-pdp-histogram">` with `<caption className="visually-hidden">Distribuição das avaliações por estrelas</caption>`, then a `<tbody>` row per entry. Index `i` is `5 - i` stars, labelled `STAR_LABELS[i]`, and `active = query.stars === stars`. Each row is `<tr className={active ? 'az-review-bucket--active' : ''}>`, holding:
         - `<th scope="row">`, with a `Link` whose text is the label:
           - `href={link({ stars: active ? undefined : stars, page: 1 })}` and `aria-current="true"` when active.
           - `aria-label`: `Remover o filtro de ${label}` when active, else `Ver avaliações com ${label}`.
         - `<td><span className="az-pdp-histogram__bar" role="img" aria-label={`${percent}% das avaliações têm ${label}`}><span style={{ width: `${percent}%` }} /></span></td>`.
         - `<td className="az-pdp-histogram__percent">{percent}%</td>`.
       Otherwise, when `reviews.unavailable`: `<p className="az-pdp-muted" role="status">Não foi possível carregar as avaliações agora. Atualize a página para tentar novamente.</p>`. Otherwise: `<p className="az-pdp-muted">Ainda não há avaliações de clientes para este produto.</p>`.
    4. `<details className="az-pdp-reviews__how">` holding `<summary>Como as avaliações e classificações de clientes funcionam</summary>` and `<p>As avaliações de clientes, incluindo as classificações por estrelas de produtos, ajudam os clientes a saber mais sobre o produto e decidir se ele é o produto certo para eles. O selo "Compra verificada" aparece quando quem avaliou tem um pedido deste produto na loja. Cada cliente pode avaliar um produto uma vez e editar a própria avaliação depois.</p>`.
    5. `<hr />`.
    6. `<h3>`: `Você avaliou este produto` when `hasOwnReview`, else `Avalie este produto`.
    7. `<p>`: `Mudou de ideia? Você pode editar sua avaliação.` when `hasOwnReview`; else `Compartilhe seus pensamentos com outros clientes` when there is a summary; else `Seja o primeiro a compartilhar sua opinião com outros clientes`.
    8. `<Link className="az-pdp-pill az-pdp-pill--wide" href={writeReviewHref}>`: `Editar sua avaliação` when `hasOwnReview`, else `Escreva uma avaliação`.
    B. `<div className="az-pdp-reviews__content">`, containing:
    1. When `media.length > 0`: `<CustomerMedia media={media} />`.
    2. `<h3 className="az-pdp-reviews__top">`: `Avaliações com ${starLabel(query.stars)}` when there is a star filter; else `Avaliações mais recentes` for `recent`; else `Melhores avaliações do Brasil`.
    3. When `total > 0 || query.stars`: `<nav className="az-review-controls" aria-label="Organizar avaliações">`, holding:
       - `<span>Classificar por:</span>`.
       - `Link` `Mais úteis` to `link({ sort: 'helpful', page: 1 })`, with `aria-current="true"` when that is the current sort.
       - `Link` `Mais recentes` to `link({ sort: 'recent', page: 1 })`, with the same `aria-current` rule.
       - With a star filter: `<Link className="az-review-controls__clear" href={link({ stars: undefined, page: 1 })}>Limpar filtro ({starLabel(query.stars)})</Link>`.
    4. When there are reviews: `<ul className="az-pdp-review-list">` with `<ReviewItem key={review.id} review={review} signedIn={reviews.signedIn} loginHref={loginHref} />` per review. Otherwise `<p className="az-pdp-muted">`: `Nenhuma avaliação escrita com ${starLabel(query.stars)}.` with a filter, else `Nenhuma avaliação escrita para exibir.`.
    5. When `pages > 1`: `<nav className="az-review-pagination" aria-label="Páginas de avaliações">`, holding:
       - When `query.page > 1`: `<Link href={link({ page: query.page - 1 })} rel="prev">‹ Anterior</Link>`.
       - `<span aria-current="page">Página {Math.min(query.page, pages)} de {pages}</span>`.
       - When `query.page < pages`: `<Link href={link({ page: query.page + 1 })} rel="next">Próxima ›</Link>`.
  notes: |
    In JSX text, write the quotes around Compra verificada as `&quot;` (the build's lint rejects raw `"` in text). Only the notice and the "unavailable" message have `role="status"`.

sf.features.product.reviews.customer-reviews.ReviewItem:
  description: |
    One customer review in the list: author, stars and title, date and country, variant and "Compra verificada", body, the helpful vote and the edit link.
    Elements, in order, inside `<li className="az-pdp-review">`:
    1. `<p className="az-pdp-review__author">`, holding:
       - `<span className="az-pdp-review__avatar" aria-hidden="true">` with a 22×22 person svg.
       - `{author}`.
       - When `own`: `<span className="az-review-own">Sua avaliação</span>`.
    2. `<p className="az-pdp-review__headline"><ProductStars rating={review.rating} /><strong>{title}</strong></p>`.
    3. `<p className="az-pdp-muted">Avaliado no {country} em {formatReviewDate(date)}</p>`.
    4. When `variant.length > 0 || verified`: `<p className="az-pdp-review__meta">`, with one `<span key={name}>{name}: {value}</span>` per variant option. When `verified`, it ends with `<span className="az-pdp-review__verified">Compra verificada</span>`.
    5. `<p className="az-pdp-review__body az-review-body">{body}</p>`.
    6. When `images` is non-empty: `<div className="az-pdp-review__images">`, with one `<Image key={image.src} src={image.src} alt={image.alt} width={88} height={88} />` per image.
    7. `<ReviewFeedback reviewId={review.id} helpfulCount={review.helpfulCount} votedHelpful={review.votedHelpful} own={review.own} signedIn={signedIn} loginHref={loginHref} />`.
    8. When `editHref`: `<p><Link className="az-pdp-link" href={editHref}>Editar sua avaliação</Link></p>`.

# ---------------------------------------------------------------- reviews/review-interactions.tsx

sf.features.product.reviews.review-interactions.CustomerMedia:
  description: |
    "Fotos e vídeos de clientes" block: a rail of photo and video tiles that "Veja tudo" expands into a grid with playable videos.
    State: `expanded` (false).
    `<div className="az-pdp-media">` contains, in order:
    1. `<div className="az-pdp-media__header">`, with `<h3>Fotos e vídeos de clientes</h3>` and `<button type="button" aria-expanded={expanded}>`. The button text is `Mostrar menos` when expanded, else `Veja tudo ›`, and a click toggles `expanded`.
    2. When expanded: `<ul className="az-pdp-media__grid">` with one `<li key={id}>` per item. A video is `<video src={item.src} poster={item.poster} controls preload="none" aria-label={item.alt} />`; an image is `<Image src={item.src} alt={item.alt} width={200} height={200} />`.
    3. Collapsed: `<HorizontalRail label="Fotos e vídeos de clientes" className="az-pdp-media__rail">` with one tile per item. The tile is `<button type="button" className="az-pdp-media__tile">`, and a click expands. It has:
       - `aria-label`: `Vídeo: ${alt}` for videos, else `alt`.
       - `<Image src={item.kind === 'video' ? (item.poster ?? item.src) : item.src} alt="" width={140} height={140} />`.
       - For videos only: `<span className="az-pdp-media__play" aria-hidden="true">▶</span>`. When `durationSeconds` is defined, also `<span className="az-pdp-media__duration">{`${m}:${ss}`}</span>`, where `m = floor(s / 60)` and `ss = round(s % 60)` padded to 2 digits.

sf.features.product.reviews.review-interactions.ReviewFeedback:
  description: |
    Helpful-vote control of a review: the helpful count, an "Útil" button that saves one vote per customer, and a "Relatório" link.
    Hooks: `useRouter()`, and state `count` (`helpfulCount`), `voted` (`votedHelpful`) and `error` ('').
    Count text: none when `count <= 0`; `Uma pessoa achou isso útil` for 1; else `${count} pessoas acharam isso útil`.
    Vote (async):
    1. Not `signedIn` → `router.push(loginHref)`. Stop, with no request.
    2. Clear `error`. Optimistically set `voted` and `count + 1`.
    3. Call `fetch(REVIEW_ROUTES.helpful(reviewId), { method: 'PUT', credentials: 'same-origin', cache: 'no-store' })`. Read the body with `response.json().catch(() => null)`.
    4. Ok → set `count` to the body's `helpfulCount` (`HelpfulVoteResponse`).
    5. Otherwise roll back `voted` (false) and `count` (`helpfulCount`). Status 401 → `router.push(loginHref)`. Status 403 with an `isApiErrorBody` body → show `body.error.message`. Anything else → `Não foi possível registrar seu voto. Tente novamente.`.
    6. A thrown fetch rolls back the same way and shows that message.
    Markup, a fragment:
    1. When there is count text: `<p className="az-pdp-muted">{text}</p>`.
    2. `<p className="az-pdp-review__actions">`, containing:
       - For `own` reviews: nothing (authors cannot vote).
       - Else when `voted`: `<span className="az-pdp-review__thanks" role="status">Obrigado pelo seu feedback.</span>`.
       - Else: `<button type="button" className="az-pdp-pill">Útil</button>`.
       - In every case, then `<Link href="/help">Relatório</Link>`.
    3. When `error`: `<p className="az-review-error" role="alert">{error}</p>`.

# ---------------------------------------------------------------- reviews/review-form.tsx

sf.features.product.reviews.review-form.validateReview:
  description: |
    Check a review draft against `REVIEW_LIMITS`, as the API does; return a message per invalid field (`{}` when valid).
    Lengths are measured after `trim()`.
    - `rating` must be an integer from 1 to 5. Otherwise: `Selecione uma classificação por estrelas.`.
    - Title shorter than `titleMin`: `Escreva um título com pelo menos ${REVIEW_LIMITS.titleMin} caracteres.`. Longer than `titleMax`: `O título pode ter até ${REVIEW_LIMITS.titleMax} caracteres.`.
    - Body shorter than `bodyMin`: `Escreva uma avaliação com pelo menos ${REVIEW_LIMITS.bodyMin} caracteres.`. Longer than `bodyMax`: `A avaliação pode ter até ${REVIEW_LIMITS.bodyMax.toLocaleString('pt-BR')} caracteres.` (`5.000`).
    Only invalid fields get a key.
  examples:
    - 'validateReview({ rating: 5, title: "Bom", body: "Dez letras" }) == {}'

sf.features.product.reviews.review-form.ReviewForm:
  description: |
    Create/edit form for the signed-in customer's review (star radios, title, text), checked by `validateReview` and saved with PUT `REVIEW_ROUTES.mine`.
    State:
    - `rating`, `title`, `body` (from `initial`, else 0 / '' / '').
    - `hovered` (0); `shown = hovered || rating`.
    - `errors` ({}), `submitError` (''), `pending` (false).
    - Refs for the rating input, the title and the body.
    Submit:
    1. `preventDefault`.
    2. `errors = validateReview(...)`. Clear `submitError`.
    3. If a field is invalid, focus the first one in the order rating, title, body, and stop. The rating ref is on the radio with `value === (rating || 1)`.
    4. Set `pending`, then call `fetch(REVIEW_ROUTES.mine, { method: 'PUT', credentials: 'same-origin', cache: 'no-store', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ productId, rating, title: title.trim(), body: body.trim() }) })`.
    5. Status 401 → `router.push(loginHref)`.
    6. Other non-ok statuses read the body with `json().catch(() => null)`, set the message below and clear `pending`:
       - Status 400: `Revise os campos da avaliação e tente novamente.`.
       - Status 404 with an `isApiErrorBody` body: `Este produto não está mais disponível para avaliação.`.
       - Anything else: `Não foi possível enviar sua avaliação. Tente novamente.`.
    7. Ok → `router.push(`${productHref}?review=${initial ? 'updated' : 'published'}#customer-reviews`)`, then `router.refresh()`.
    8. A thrown fetch shows the last message and clears `pending`.
    `describedBy(field, hint?)` joins with spaces the hint id (if any) and, when the field has an error, `review-${field}-error`; it returns `undefined` when there is neither.
    `<form className="az-review-form" onSubmit={(event) => void submit(event)} noValidate>` contains, in order:
    1. `<fieldset className="az-review-form__group" aria-describedby={describedBy('rating')} aria-invalid={errors.rating ? true : undefined}>`, with:
       - `<legend>Classificação geral</legend>`.
       - `<div className="az-review-stars" onMouseLeave={() => setHovered(0)}>`. For each v in 1..5 it has a `<span className="az-review-stars__option">` with:
         - `<input type="radio" id={`review-rating-${v}`} name="rating" value={v} checked={rating === v} onChange={() => setRating(v)} className="az-review-stars__input" />`.
         - `<label htmlFor={`review-rating-${v}`} title={word} onMouseEnter={() => setHovered(v)}>`, containing an aria-hidden 32×32 star svg (filled `#ffa41c` with stroke `#de7921` when `v <= shown`, else `#fff` with `#8d9096`) and `<span className="visually-hidden">{v} {v === 1 ? 'estrela' : 'estrelas'}: {word}</span>` (e.g. `4 estrelas: Gostei`), where `word = RATING_WORDS[v - 1]`.
         After the options: `<span className="az-review-stars__word" aria-hidden="true">{shown ? RATING_WORDS[shown - 1] : ''}</span>`.
       - When there is a rating error: `<p className="az-review-error" id="review-rating-error">`.
    2. `<div className="az-review-form__group">`, with:
       - `<label htmlFor="review-title" className="az-review-form__label">Adicione um título</label>`.
       - `<input id="review-title" name="title" type="text" maxLength={REVIEW_LIMITS.titleMax} placeholder="O que é mais importante saber?" className="az-review-form__input" value={title} onChange={(event) => setTitle(event.target.value)} aria-invalid={errors.title ? true : undefined} aria-describedby={describedBy('title')} />`.
       - When there is a title error: `<p className="az-review-error" id="review-title-error">`.
    3. `<div className="az-review-form__group">`, with:
       - `<label htmlFor="review-body" className="az-review-form__label">Adicione uma avaliação escrita</label>`.
       - `<textarea id="review-body" name="body" rows={7} maxLength={REVIEW_LIMITS.bodyMax} placeholder="Do que você gostou ou não gostou? Como você usou este produto?" className="az-review-form__input" value={body} onChange={(event) => setBody(event.target.value)} aria-invalid={errors.body ? true : undefined} aria-describedby={describedBy('body', 'review-body-count')} />`.
       - `<p className="az-review-form__hint" id="review-body-count">{body.trim().length.toLocaleString('pt-BR')} de {REVIEW_LIMITS.bodyMax.toLocaleString('pt-BR')} caracteres (mínimo {REVIEW_LIMITS.bodyMin})</p>`.
       - When there is a body error: `<p className="az-review-error" id="review-body-error">`.
    4. When `submitError`: `<p className="az-review-error" role="alert">`.
    5. `<div className="az-review-form__actions"><button type="submit" className="az-review-form__submit" disabled={pending}>`. The button text is `Enviando…` while pending, else `Salvar alterações` with `initial`, else `Enviar`.
    The form renders nothing with role `img`.
