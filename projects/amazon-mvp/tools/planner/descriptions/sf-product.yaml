    - Otherwise render `<section className="az-pdp-section" aria-labelledby="product-description-title">` with `<h2 id="product-description-title">Descrição do produto</h2>` and `<p className="az-pdp-description">{description}</p>`.

sf.features.product.product-sections.BrandStorySection:
