# Planner-written behavior for apps/storefront/src/features/product (group sf-product).

# ---------------------------------------------------------------- product-rules.ts

sf.features.product.product-rules.variantDimensions:
  description: |
    Build a product page's variation matrix: one dimension per option of `current`, each value found in `members` linked to its best-matching record.
    - For each `{ name, value }` of `current.options`, in that order, return `{ name, selected: value, choices }`.
    - `choices`: the distinct values that `members` have for option `name`, in first-seen order (members without that option are skipped).
    - For each value: `selected` is `value === selected`. `member` is the first member with that value whose every other option equals `current`'s value for that option name. If none matches, it is the first member with that value.
    Example: current Preto/M, members [Preto/M, Preto/G, Branco/P, Branco/M]. The `Cor` choice `Branco` links to Branco/M (keeps size M). The `Tamanho` choice `P` links to Branco/P (there is no Preto/P).
  notes: |
    Pure; do not mutate the inputs. `current` is normally one of `members`.

sf.features.product.product-rules.lastPurchase:
  description: |
    Find the newest non-cancelled order that contains any of `productIds`, with its matching line; null when there is none.
    - Ignore orders with `status === 'CANCELLED'`. Sort the rest by `placedAt` descending (compare the ISO strings with `localeCompare`), without mutating the input array.
    - Return `{ order, line }` for the first order that has a line whose `productId` is in `productIds`; `line` is the first such line of that order.
    - No match, or no orders → `null`. Never build a purchase that is not in `orders`.

sf.features.product.product-rules.formatPurchaseDate:
  description: |
    Format an ISO instant as its calendar day in São Paulo, Amazon style: `10 de Ago de 2026`.
    Call `monthDate.formatToParts(new Date(iso))` (the provided pt-BR formatter, short month, `America/Sao_Paulo`). Take the `day`, `month` and `year` parts (empty string when missing). Remove the `.` from the month and upper-case its first letter. Return `${day} de ${Month} de ${year}`. The day is not zero-padded.
  examples:
    - 'formatPurchaseDate("2026-08-10T13:32:00.000Z") == "10 de Ago de 2026"'
    - 'formatPurchaseDate("2026-08-11T01:00:00.000Z") == "10 de Ago de 2026"'

sf.features.product.product-rules.formatReviewDate:
  description: |
    Format a calendar day `YYYY-MM-DD` in long Brazilian Portuguese, e.g. `18 de julho de 2026`.
    Return `reviewDate.format(new Date(isoDay + 'T12:00:00Z'))`, using the provided `reviewDate` formatter (UTC). Noon UTC keeps the day from shifting.
  examples:
    - 'formatReviewDate("2026-07-18") == "18 de julho de 2026"'

sf.features.product.product-rules.installmentPlan:
  description: |
    Split a total into `count` interest-free installments that add back up to the total; the last installment absorbs the rounding.
    Return `{ count, eachMinor, lastMinor, totalMinor }`:
    - `eachMinor = Math.floor(totalMinor / count)`.
    - `lastMinor = totalMinor - eachMinor * (count - 1)`.
    - `totalMinor` is the input total.
  examples:
    - 'installmentPlan(20520, 6) == { count: 6, eachMinor: 3420, lastMinor: 3420, totalMinor: 20520 }'
    - 'installmentPlan(1000, 3) == { count: 3, eachMinor: 333, lastMinor: 334, totalMinor: 1000 }'

sf.features.product.product-rules.discountPercent:
  description: |
    Whole-number discount percentage of `priceMinor` against a higher previous price; undefined when there is no real discount.
    When `oldPriceMinor` is truthy and greater than `priceMinor`, return `Math.round((1 - priceMinor / oldPriceMinor) * 100)`. This can be `0` for a tiny discount. Otherwise (missing, 0, equal or lower) return `undefined`.
  examples:
    - 'discountPercent(27900, 34900) == 20'
    - 'discountPercent(27900, 27900) == undefined'
    - 'discountPercent(999, 1000) == 0'

sf.features.product.product-rules.formatRating:
  description: |
    Format a rating with exactly one decimal, in Brazilian Portuguese (`4,8`, `5,0`).
    Use `value.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })`. It rounds half away from zero and groups thousands with `.`.
  examples:
    - 'formatRating(5) == "5,0"'
    - 'formatRating(4.25) == "4,3"'

sf.features.product.product-rules.showPrimeNotice:
  description: |
    Decide whether the product page shows the simulated Prime banner. It is hidden once this user dismissed it, or once they have a non-expired saved card.
    - `dismissedBy === userId` → `false`. A dismissal stored for another user id does not count.
    - Otherwise return `true` unless `cards` contains a card for which `isCardExpired(card, now)` is false.
    - `null` cards (unknown, e.g. the API is down) → `true`. `[]` → `true`.
  examples:
    - 'showPrimeNotice(null, undefined, "u") == true'
    - 'showPrimeNotice([], "u", "u") == false'
    - 'showPrimeNotice([], "other", "u") == true'

# ---------------------------------------------------------------- product-content.ts

sf.features.product.product-content.productContent:
  description: |
    Merchandising content of a catalog record (gallery, brand, specs, badges, variant, fulfillment), from the demo fixtures, matched by slug AND SKU.
    - `presentation = productPresentation(product)`.
    - `fixture` = the first entry of `fixtures` with `id === product.slug && sku === product.sku`. Any other record has no fixture, even one with the same slug.
    - Return a `ProductContent`:
      - `images`: `fixture.gallery` when it is non-empty, else `presentation.images`.
      - `oldPriceMinor`: `presentation.oldPriceMinor`.
      - `brand`, `installments`, `variant`, `fulfillment`: from the fixture, else `undefined`.
      - `attributes`, `bullets`, `details`, `bestSellerRanks`: from the fixture, else `[]`.
      - `badges`: `{ amazonChoice: fixture?.badges?.amazonChoice ?? false, boughtLastMonth: fixture?.badges?.boughtLastMonth }`. Both keys are always present.
      - `demo`: `presentation.demo || Boolean(fixture)`.
    - Add no other keys. There is no `rating`: ratings come from the reviews API. Never copy the name, price, stock, description or categories from the fixture.

sf.features.product.product-content.variantGroupSlugs:
  description: |
    Catalog slugs of every product in a variant group, the current one included, in fixture order.
    Return the `id` of every entry of `fixtures` whose `variant?.group === group`. An unknown group → `[]`.
  examples:
    - 'variantGroupSlugs("8bitdo-ultimate-2c") == ["p6", "p21", "p22", "p23"]'

sf.features.product.product-content.brandSlugs:
  description: |
    Catalog slugs of every fixture of a brand, for the "Da marca" section and brand listings, in fixture order.
    Return the `id` of every entry of `fixtures` whose `brand === brand` (exact, case-sensitive). No match → `[]`.
  examples:
    - 'brandSlugs("8BitDo") == ["p6", "p21", "p22", "p23"]'

sf.features.product.product-content.brandByKey:
  description: |
    Brand name for a listing URL key such as `letra-viva`; undefined when no fixture's brand has that key.
    Find the first entry of `fixtures` that has a `brand` and whose `brandKey(brand) === key`, and return its `brand`.
  examples:
    - 'brandByKey("letra-viva") == "Letra Viva"'
    - 'brandByKey("generico") == "Genérico"'
    - 'brandByKey("nope") == undefined'

sf.features.product.product-content.brandOfSlug:
  description: |
    Brand of a catalog slug, from the fixture whose `id` equals `slug` (the SKU is not checked). Undefined when there is no such fixture, or it has no brand.
  examples:
    - 'brandOfSlug("p6") == "8BitDo"'
    - 'brandOfSlug("p4") == undefined'

sf.features.product.product-content.brandStory:
  description: |
    Registered brand story (logo, banner, paragraphs) for a brand name; undefined for brands without one.
    - A falsy `brand` → `undefined`.
    - Otherwise return the entry of `brandFixtures` (config/demo-brands.json, cast to `BrandStory[]`) whose `name === brand` (exact, case-sensitive), or `undefined`.
  examples:
    - 'brandStory("Amazon") == undefined'
    - 'brandStory("8BitDo")?.story.length == 3'

# ---------------------------------------------------------------- product-presentation.ts

sf.features.product.product-presentation.productPresentation:
  description: |
    Local photo, demo flag, previous price and card glyph for a catalog record, matched by slug AND SKU so no other product inherits them.
    - `demo` = the entry of `demoProducts` (config/demo-products.json; fields `id`, `sku`, `image?`, `oldPriceMinor?`, `glyph?`, ...) with `id === product.slug && sku === product.sku`.
    - `image` = `demo?.image`. Otherwise it is the `image` of the `productImages` entry (config/product-images.json; fields `slug`, `sku`, `image`) with `slug === product.slug && sku === product.sku`.
    - Return exactly `{ images, demo, oldPriceMinor, glyph }`:
      - `images`: `image ? [image] : []`.
      - `demo`: `Boolean(demo)`.
      - `oldPriceMinor`: the demo's `oldPriceMinor` only when it is strictly greater than `product.priceMinor`, else `undefined`.
      - `glyph`: `demo?.glyph as GlyphKind | undefined`.
    A matching id or slug alone is never enough. Never return the fixture's name, price, stock or rating.

sf.features.product.product-presentation.normalizeProductDetails:
  description: |
    Give a catalog product payload safe defaults: a trimmed-or-null description, category lists, non-negative stock and a strict `inStock`.
    Return `{ ...product }` with these overrides:
    - `description`: `product.description?.trim() || null` (blank → `null`).
    - `categories`: `product.categories ?? []`.
    - `categoryPath`: `product.categoryPath ?? []`.
    - `availableQuantity`: `Math.max(0, product.availableQuantity ?? 0)`.
    - `inStock`: `product.active && product.inStock && product.availableQuantity > 0`.
    Every other field (id, name, price, ...) is kept as received.

# ---------------------------------------------------------------- related-products.ts

sf.features.product.related-products.rankRelated:
  description: |
    Order related-product candidates by category distance, shared categories, stock and affinity, keeping one card per variant family, up to `limit`.
    Drop a candidate when any of these holds:
    - `item.active` is false.
    - `item.id === target.item.id`.
    - The target has a `facts.family` and the candidate has the same family.
    Affinity score:
    - `(sameBrand ? 4 : 0) + Math.min(3, sharedAttributes) + 3 * priceCloseness`.
    - `sameBrand`: the target's `facts.brand` is defined and equals the candidate's.
    - `sharedAttributes`: the number of candidate attributes whose `label` AND `value` equal one of the target's attributes.
    - `priceCloseness = 1 - Math.min(1, ratio / PRICE_RANGE)`, where `ratio = Math.abs(Math.log(Math.max(1, candidate.item.priceMinor) / Math.max(1, target.item.priceMinor)))`.
    Sort by these keys, in order:
    1. `distance` ascending.
    2. `sharedCategories` descending (missing counts as 1).
    3. In stock before sold out.
    4. Score descending.
    5. `facts.familyHead` true first.
    6. `item.name.localeCompare(other.item.name, 'pt-BR')`.
    Then walk the sorted list. The key is `facts.family ?? item.id`. Skip a candidate whose key or item id was already used; otherwise mark both as used and keep its `item`. Stop as soon as `limit` items are kept. Return the kept `CatalogItem`s.
    Effects: a family shows its best-ranked member (e.g. the one sharing the target's colour), else its head. Duplicates of one record keep only the closest one.

sf.features.product.related-products.distinctCards:
  description: |
    Count the cards a candidate list can produce, a variant family counting once: the number of distinct `facts.family ?? item.id` keys.
    No other filtering: inactive or sold-out candidates count too.
  examples:
    - 'distinctCards([]) == 0'

# ---------------------------------------------------------------- product-server.ts

sf.features.product.product-server.apiBase:
  description: |
    Base URL of the API for server-side requests, e.g. `http://api/api/v1`.
    Read `getConfig().api` and return `${api.internalBaseUrl}${api.publicBasePath}`.

sf.features.product.product-server.getCatalogProduct:
  description: |
    Load one catalog product by slug or id, memoised per request with React `cache`. Null when the API answers 404; throws when it is unavailable.
    Declare it as `export const getCatalogProduct = cache(async (identifier: string): Promise<CatalogProductDetails | null> => …)`. The handler:
    - `fetch(`${apiBase()}/catalog/products/${encodeURIComponent(identifier)}`, { cache: 'no-store' })`.
    - Status 404 → `null`.
    - Any other non-ok status → `throw new Error('Product catalog unavailable')`.
    - Network errors propagate.
    - Ok → `normalizeProductDetails(await response.json())`.

sf.features.product.product-server.findCatalogProduct:
  description: |
    Like `getCatalogProduct(slug)`, but resolves `null` instead of throwing, so a secondary page section degrades to "absent". Await the call inside try/catch.

sf.features.product.product-server.listCategory:
  description: |
    Fetch the active products of a category subtree from the catalog API, or `[]` on any failure.
    - `fetch(`${apiBase()}/catalog/products?pageSize=${pageSize}&category=${encodeURIComponent(slug)}`, { cache: 'no-store' })`. The query parameters are in that order.
    - Ok → the `items` of the `CatalogPage`.
    - Non-ok or thrown → `[]`.

sf.features.product.product-server.getDeliveryAddress:
  description: |
    Fetch the signed-in user's first saved address; null when signed out, when there is none, or on any failure.
    - `fetch(`${apiBase()}/addresses`, { headers: { cookie: cookies().toString() }, cache: 'no-store' })`. `cookies()` comes from `next/headers`, to forward the session.
    - Non-ok → `null`.
    - Ok → the first element of the `SavedAddress[]` body, or `null` when it is empty.
    - Thrown → `null`.

sf.features.product.product-server.listBySlugs:
  description: |
    Fetch the catalog records for a list of slugs, one request per 48 slugs (the API page limit), in the API's order. Failed chunks contribute nothing.
    - Split `slugs` into consecutive chunks of 48.
    - Request all chunks in parallel (`Promise.all`): `fetch(`${apiBase()}/catalog/products?pageSize=48&slugs=${chunk.map(encodeURIComponent).join(',')}`, { cache: 'no-store' })`. The commas between slugs stay literal.
    - Ok → the page's `items`; non-ok or thrown → `[]`.
    - Return the results flattened in chunk order. No slugs → no request, `[]`.
    - Do not de-duplicate, filter or re-order: callers pick records by slug.

sf.features.product.product-server.relatedProducts:
  description: |
    Related-products rail of a product page: candidates from its own categories, widened up the breadcrumb only until the rail can fill, ranked by `rankRelated`.
    1. Levels:
       - Every `product.categories[].slug` at distance 0.
       - Then `product.categoryPath` from the deepest level upward, skipping the deepest entry, at distances 1, 2, ….
       - Drop a slug already listed (keep its first occurrence).
    2. Visit the levels one at a time, in order, with `await listCategory(slug)` (default page size). For each returned item:
       - If it is already a candidate and both the candidate and this level are at distance 0, increment its `sharedCategories`.
       - Skip known items and ids in `exclude`.
       - Otherwise add `{ item, distance, sharedCategories: 1, facts }`.
       Candidates are kept in a Map keyed by `item.id`, in insertion order.
    3. After each level, stop when both hold: the next level's distance differs from this one (or there is no next level), and `distinctCards(candidates) >= limit`. All levels of one distance are always fetched together, and no further level is requested once the rail is full.
    4. Return `rankRelated({ item: product, facts: factsOf(product) }, [...candidates.values()], limit)`.
    `factsOf(item): RelatedFacts` is a private helper, called once per new candidate. It takes `content = productContent(item)` and `family = content.variant?.group`, and returns:
    - `brand`: `content.brand`.
    - `family`.
    - `familyHead`: `family !== undefined && variantGroupSlugs(family)[0] === item.slug`.
    - `attributes`: `content.attributes`.
    Example: a running shoe whose path is moda › calcados › tenis › tenis-corrida requests the categories `tenis-corrida`, `tenis`, then `calcados`. It stops there once 12 cards exist, so `moda` is never requested.

# ---------------------------------------------------------------- product-notices.tsx

sf.features.product.product-notices.PurchaseNotice:
  description: |
    "You bought this before" banner on the product page, linking to the order, to writing a review and to product support.
    `<section className="az-pdp-bought" aria-label="Compra anterior">` contains, in order:
    1. A `<div>` with two paragraphs:
       - `<p className="az-pdp-bought__title">`: `<span className="az-pdp-bought__icon" aria-hidden="true">i</span>`, then the text `Você comprou este produto pela última vez em {formatPurchaseDate(purchase.order.placedAt)}`.
       - `<p className="az-pdp-bought__meta">`: one `<span key={option.name}>{option.name}: <strong>{option.value}</strong></span>` per entry of `options`, then `<Link href={`/orders/${encodeURIComponent(purchase.order.id)}`}>Ver pedido</Link>`.
    2. `<nav aria-label="Ações da compra anterior">` with `<Link href={reviewHref}>Incluir avaliação</Link>` and `<Link href="/help">Suporte ao produto</Link>`.

sf.features.product.product-notices.ProductBreadcrumb:
  description: |
    Category trail of the product page; each level is a link when `hrefFor` is given, plain text otherwise.
    - An empty `path` → render `null`.
    - Otherwise render `<nav className="az-pdp-breadcrumb" aria-label="Categorias do produto"><ol>` with one `<li key={slug}>` per level, in order.
    - From the second level on, the `li` starts with `<span className="az-pdp-breadcrumb__sep" aria-hidden="true">›</span>`.
    - Then `<Link href={hrefFor(slug)}>{name}</Link>` when `hrefFor` is given, else `<span>{name}</span>`.

sf.features.product.product-notices.PrimeUpsell:
  description: |
    Static Amazon Prime advertisement box that links to the `/prime` placeholder page.
    `<section className="az-pdp-prime" aria-label="Amazon Prime">` containing, in order:
    - `<p className="az-pdp-prime__logo" aria-hidden="true">prime</p>`.
    - `<p>Aproveite frete GRÁTIS e rápido, ofertas exclusivas, Prime Video e muito mais.</p>`.
    - `<Link href="/prime">Assine o Amazon Prime</Link>`.

# ---------------------------------------------------------------- product-price.tsx / product-stars.tsx

sf.features.product.product-price.ProductPrice:
  description: |
    Amazon-style split price (currency symbol, integer part, cents), with the full formatted amount as its accessible label.
    Get the parts from `new Intl.NumberFormat('pt-BR', { style: 'currency', currency }).formatToParts(amount / 100)`. Render `<span className="az-pdp-price" aria-label={formatCartMoney(amount, currency)}>` containing three `aria-hidden="true"` spans:
    - `<span className="az-pdp-price__currency">`: the `currency` part (`R$`).
    - `<span>`: the `integer` and `group` parts joined in order (`1.234`).
    - `<span className="az-pdp-price__fraction">`: the `fraction` part (`56`).

sf.features.product.product-stars.ProductStars:
  description: |
    Five-star graphic filled to the nearest half star, exposed as an image labelled like `4,3 de 5 estrelas`.
    - Compute `rounded = Math.round(rating * 2) / 2`.
    - Render `<span className={"az-pdp-stars " + className} role="img" aria-label={`${formatRating(rating)} de 5 estrelas`} style={{ ['--fill' as string]: `${(rounded / 5) * 100}%` }}>`, containing `<span aria-hidden="true">★★★★★</span>`.
    - The label uses the unrounded rating: 4.3 → `4,3 de 5 estrelas` with `--fill: 90%`.

# ---------------------------------------------------------------- product-gallery.tsx

sf.features.product.product-gallery.ProductGallery:
  description: |
    Product photo gallery: up to six thumbnails plus an `N+` button, a main image that opens a full-screen viewer, a share button and a placeholder.
    State:
    - `selected` (0); `active = images[selected] ?? images[0]`.
    - `failed`: a Set of srcs whose image errored.
    - `viewer` (false).
    - `shared` ('').
    `overflow = images.length > VISIBLE_THUMBNAILS + 1`: seven images show seven thumbnails; eight or more show six plus the button. Every picture is the `next/image` `Image`.
    Markup: `<section className="az-pdp-gallery" aria-label={`Imagens de ${name}`}>`:
    1. Only when `images.length > 1`: `<div className="az-pdp-thumbs" role="group" aria-label="Escolher imagem do produto">`.
       - One `<button type="button">` per thumbnail (the first 6 when `overflow`, else all), with `aria-label={`Ver imagem ${i + 1} de ${name}`}` and `aria-pressed={i === selected}`. Both `onClick` and `onMouseEnter` select it. Content: `<Image src={image.src} alt="" width={40} height={40} />`.
       - When `overflow`: `<button type="button" className="az-pdp-thumbs__more" aria-label={`Ver todas as ${images.length} imagens`}>{images.length - 6}+</button>`. It opens the viewer.
    2. `<div className="az-pdp-gallery__stage">`:
       - `<button type="button" className="az-pdp-gallery__share">`: an aria-hidden 18×18 share svg, and `<span className="visually-hidden">Compartilhar</span>`. Click: use `navigator.share({ title: name, url: window.location.href })` when it exists. Otherwise `await navigator.clipboard.writeText(url)` and set `shared` to `Link copiado`. Swallow errors.
       - `<span className="az-pdp-gallery__shared" role="status">{shared}</span>`.
       - When `active` exists and its src is not in `failed`:
         - `<button type="button" className="az-pdp-gallery__main" aria-label={`Ampliar imagem: ${active.alt || name}`}>`, which opens the viewer. It contains `<Image src={active.src} alt={active.alt || name} width={600} height={600} sizes="(max-width: 600px) 90vw, (max-width: 1100px) 45vw, 560px" priority={selected === 0} onError={() => add active.src to failed} />`.
         - Then `<p className="az-pdp-gallery__hint">Clique para ver a imagem completa</p>`.
       - Otherwise `<div className="az-pdp-gallery__main az-pdp-gallery__main--empty"><ProductImage /></div>` (it shows "Imagem indisponível"), and no hint.
    3. When `viewer && active`: the viewer.
    The viewer is a private component sharing `selected` with the gallery:
    - On mount:
      - Remember `document.activeElement` and focus the viewer's close button.
      - Add a `keydown` listener on `document` that reads the latest props through a ref: `Escape` closes, `ArrowRight` selects `(i + 1) % n`, `ArrowLeft` selects `(i - 1 + n) % n`.
      - Set `document.body.style.overflow = 'hidden'`.
    - On unmount: remove the listener, set overflow back to `''` and refocus the remembered element.
    - Markup: `<div className="az-pdp-viewer" role="presentation">` (click closes) wraps `<div className="az-pdp-viewer__panel" role="dialog" aria-modal="true" aria-label={`Imagens de ${name}`}>`. A click on the panel stops propagation. The panel contains:
      - `<button type="button" className="az-pdp-viewer__close" aria-label="Fechar">×</button>`.
      - `<div className="az-pdp-viewer__image">` with `<Image src={active.src} alt={active.alt || name} width={1000} height={1000} sizes="80vw" />` of the selected image.
      - `<div className="az-pdp-viewer__side">` with `<p className="az-pdp-viewer__title">{name}</p>`. When there is more than one image, it also has `<div className="az-pdp-viewer__thumbs" role="group" aria-label="Escolher imagem">` with one button per image: `aria-label={`Imagem ${i + 1} de ${images.length}`}`, `aria-pressed={i === selected}`, click selects, content `<Image src={image.src} alt="" width={64} height={64} />`.

# ---------------------------------------------------------------- product-overview.tsx

sf.features.product.product-overview.ProductOverview:
  description: |
    Middle column of the product page: title, brand, attributes, rating, badges, prices with Pix and installments, benefits, variant swatches and bullets.
    - `discount = discountPercent(product.priceMinor, content.oldPriceMinor)`.
    - `plan = content.installments && installmentPlan(product.priceMinor, content.installments.count)`.
    It is a server component with no state.
    Elements, in order, inside `<section className="az-pdp-info" aria-label="Informações do produto">`:
    1. `<h1 id="product-title">{product.name}</h1>`.
    2. When `content.brand`: `<p className="az-pdp-brand">`. With `brandHref` it holds `<Link href={brandHref}>Marca: {brand}</Link>`; without it, the plain text `Marca: {brand}`.
    3. One `<p key={label} className="az-pdp-attribute"><strong>{label}</strong> : {value}</p>` per entry of `content.attributes`.
    4. When `rating`: `<p className="az-pdp-rating">` holding:
       - `<span aria-hidden="true">{formatRating(rating.average)}</span>`.
       - `<ProductStars rating={rating.average} />`.
       - A plain `<a href="#customer-reviews" aria-label={`${count} avaliações de clientes`}>({count})</a>`, where `count` is `rating.count.toLocaleString('pt-BR')` (`5.512`).
    5. When `content.badges.amazonChoice`: `<p className="az-pdp-choice">Escolha da Amazon</p>`.
    6. When `content.badges.boughtLastMonth`: `<p className="az-pdp-bought-count"><strong>{boughtLastMonth}</strong> no mês passado</p>`.
    7. `<div className="az-pdp-pricing">`:
       - `<p className="az-pdp-pricing__main">`: when `discount` is truthy, `<span className="az-pdp-discount">-{discount}%</span>`; then `<ProductPrice amount={product.priceMinor} currency={product.currency} />`.
       - When `product.active` (even when out of stock): `<PixPrice amountMinor={product.priceMinor} currency={product.currency} percent={pixDiscountPercent} />`.
       - When `content.oldPriceMinor && discount`: `<p className="az-pdp-muted">De: <del>{formatCartMoney(oldPriceMinor, currency)}</del></p>`.
       - When `plan`: `<p className="az-pdp-installments">ou em até <strong>{plan.count}x de {formatCartMoney(plan.eachMinor, currency)} sem juros</strong></p>`.
       - `<p><Link className="az-pdp-link" href="/payment-methods">Ver opções de pagamento</Link></p>`.
    8. `<div className="az-pdp-benefits">`:
       - `<p><Link href="/credit-card">Ganhe pontos nesta compra com o cartão Amazon: peça o seu com anuidade zero e vantagens exclusivas.</Link></p>`.
       - `<ul aria-label="Benefícios">`, whose items are:
         - Always: `<li><Link href="/payment-methods">[icon] Pagamentos e Segurança</Link></li>`.
         - When `content.fulfillment?.shippedBy === 'Amazon'`: `/shipping`, `Enviado pela Amazon`.
         - When `content.fulfillment?.returns`: `/returns`, `Política de devolução`.
         Each icon is `<span className="az-pdp-benefit-icon" aria-hidden="true">` holding a 22×22 stroke svg (lock, truck, return arrow).
    9. When `dimensions.length > 0`: `<div className="az-pdp-variants">`, with one `<div key={name} className="az-pdp-variant">` per dimension:
       - `<p>{name}: <strong>{selected}</strong></p>`.
       - When the dimension has more than one choice: `<ul aria-label={`Escolher ${name.toLowerCase()}`}>`, with one `<li key={value}>` per choice holding a `Link`. Using the choice's `member.product` and `member.image`, the Link has:
         - `href={`/products/${encodeURIComponent(product.slug)}`}` and `scroll={false}`.
         - `className`: `az-pdp-swatch`, plus ` az-pdp-swatch--selected` when selected, plus ` az-pdp-swatch--unavailable` when `!product.inStock`, plus ` az-pdp-swatch--text` when there is no image.
         - `aria-label={`${name} ${value}, ${formatCartMoney(product.priceMinor, product.currency)}`}`, followed by `, indisponível` when out of stock. Example: `Cor Verde, R$ 200,10, indisponível`.
         - `aria-current="true"` only on the selected choice, and `title={value}`.
         - Content: `<Image src={image.src} alt="" width={64} height={64} />`, or `<span>{value}</span>` without an image.
    10. When `content.bullets.length > 0`: `<div className="az-pdp-about"><h2>Sobre este item</h2><ul>` with one `<li>` per bullet.
    11. When `content.details.length > 0 || product.description`: `<a className="az-pdp-link az-pdp-more" href="#product-details">› Ver mais detalhes do produto</a>`.
  notes: |
    Text that tests look up must be a direct text node of its element. For example, `Marca: Amazon` is the text of the `p`, and `-20%` is the text of the span.

# ---------------------------------------------------------------- product-purchase.tsx

sf.features.product.product-purchase.ProductPurchase:
  description: |
    Buy box of the product page: price, Pix, delivery, stock, quantity menu and the "Adicionar ao carrinho" / "Comprar agora" actions through `useCart()`.
    Hooks: `useRouter()`, `useCart()` (`cart, status, pending, error, notice, add, refresh`), and state `quantity` (1), `attempted` (false), `buying` (false).
    Derived values:
    - `inCart`: the quantity of the cart line with `productId === product.id`, else 0.
    - `remaining = max(0, min(MAX_CART_QUANTITY, product.availableQuantity) - inCart)`.
    - `selectedQuantity = max(1, min(quantity, remaining || 1))`.
    - `ready = cartEnabled && status === 'ready' && !pending && !buying`.
    - `canAdd = ready && product.inStock && remaining > 0`.
    - `canBuyNow = ready && checkoutEnabled && product.inStock && (remaining > 0 || inCart > 0)`.
    - `guest = cartEnabled && status === 'guest'`.
    - `loginHref = "/login?next=" + encodeURIComponent("/products/" + product.slug)`.
    - `menuSize = max(1, min(remaining, QUANTITY_MENU_LIMIT))`.
    Stock line, checked in order:
    - `!product.active` → `Indisponível no momento` (tone `unavailable`).
    - `!inStock` → `Fora de estoque` (`unavailable`).
    - `availableQuantity <= LOW_STOCK` → `Apenas ${product.availableQuantity} em estoque` (`low`).
    - Otherwise `Em estoque` (`available`).
    Elements, in order, inside `<section className="az-pdp-buy" aria-label="Comprar produto" aria-busy={pending || buying}>`:
    1. `<ProductPrice amount={product.priceMinor} currency={product.currency} />`.
    2. When `inStock && checkoutEnabled`: `<PixPrice amountMinor={product.priceMinor} currency={product.currency} percent={pixDiscountPercent} prefix="ou " className="az-pix-price--small" />`.
    3. When `installments && inStock`: `<p className="az-pdp-buy__installments">ou em até {installments.count}x de {formatCartMoney(Math.floor(product.priceMinor / installments.count), product.currency)}/mês</p>` (no space before `/mês`).
    4. When `inStock`: `<p className="az-pdp-buy__delivery">Entrega <strong>GRÁTIS</strong></p>`.
    5. When `address`: `<p className="az-pdp-buy__address">` with an aria-hidden 14×14 pin svg and `<span>Enviar para {address.recipient} - {address.city} {address.postalCode}</span>`.
    6. `<p className={`az-pdp-stock az-pdp-stock--${tone}`}>{text}</p>`.
    7. When `!inStock && active`: `<p className="az-pdp-muted">Não sabemos quando ou se este item estará disponível novamente.</p>`.
    8. When `inCart > 0`: `<p className="az-pdp-muted">{inCart} unidade no carrinho</p>` (`unidades no carrinho` when more than one).
    9. When `inStock && inCart > 0 && remaining === 0`: `<p className="az-pdp-muted">Você já adicionou a quantidade disponível para este produto.</p>`.
    10. Only when `inStock`:
        - `<label className="az-pdp-quantity"><span>Quantidade:</span><select aria-label="Quantidade" value={selectedQuantity} disabled={!canAdd}>`, with options 1..`menuSize`. On change, set `quantity` to `Number(value)`.
        - For a guest: two `Link`s to `loginHref`, `className="az-pdp-button"` with the text `Adicionar ao carrinho` and `className="az-pdp-button az-pdp-button--buy"` with `Comprar agora`. Then `<p className="az-pdp-muted">Entre na sua conta para comprar este produto.</p>`.
        - Otherwise:
          - `<button type="button" className="az-pdp-button" disabled={!canAdd}>`, labelled `Adicionando…` while `pending && !buying`, else `Adicionar ao carrinho`. Click: `setAttempted(true)` and `void add(product.id, selectedQuantity)`; it never navigates.
          - `<button type="button" className="az-pdp-button az-pdp-button--buy" disabled={!canBuyNow} aria-describedby={checkoutEnabled ? undefined : 'checkout-unavailable'}>`, labelled `Abrindo o checkout…` while `buying`, else `Comprar agora`. Click (async): set `attempted` and `buying`. If `remaining > 0`, `ok = await add(product.id, selectedQuantity)`; else `ok = true`. If `ok`, `router.push('/checkout')`. Finally clear `buying`. Never call `update`.
          - When `!checkoutEnabled`: `<p id="checkout-unavailable" className="az-pdp-muted">A finalização da compra ainda não está disponível.</p>`.
    11. When `!cartEnabled`: `<p className="az-pdp-muted">O carrinho ainda não está disponível.</p>`. Otherwise, when `status === 'loading'`: `<p role="status" className="az-pdp-muted">Carregando seu carrinho…</p>`.
    12. When `cartEnabled && error`: `<div className="az-pdp-error" role="alert">{error}`. Unless `status === 'guest'`, it also holds `<button type="button" disabled={pending}>Tentar novamente</button>`, which calls `refresh()`.
    13. `<div className="az-pdp-feedback" role="status">`, always present. When `attempted && notice && !buying`, it shows `{notice} ` and `<Link href="/cart">Ver carrinho</Link>`.
    14. When `fulfillment` has `shippedBy`, `soldBy` or `returns`: `<dl className="az-pdp-fulfillment">` with one `<div><dt>…</dt><dd>…</dd></div>` per present field, in order:
        - `Enviado por` / `{shippedBy}`.
        - `Vendido por` / `{soldBy}`.
        - `Devolução` / `<Link href="/returns">{returns}</Link>`.
    15. When `lists`: `<AddToList productId={product.id} signedIn={lists.signedIn} loginHref={loginHref} />`.
    Out of stock, there is no delivery line, no select and no purchase button.

