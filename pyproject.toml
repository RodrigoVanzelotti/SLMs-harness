[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-harness"
version = "0.1.0"
description = "Deterministic orchestrator that rebuilds a project unit by unit with a small language model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
slm-harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness", "harness.lang"]

[tool.setuptools.package-data]
harness = ["templates/*.md", "skeleton/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
